      - name: TTS Generation (Revid TTS API + Vietnamese VTT)
        env:
          REVID_API_KEYS: ${{ secrets.REVID_API_KEYS }}   # mỗi dòng 1 key
          REVID_VOICE_ID: "3001"
          REVID_LANGUAGE: "vi-VN"
          REVID_RATE: "0%"
          TTS_SPEEDUP: "1.0"
          TTS_WORKERS: "6"
          TTS_MAX_RETRIES: "3"
          TTS_TIMEOUT: "200"
          TTS_HEARTBEAT: "30"
          TTS_ERROR_RATIO: "0.1"
        run: |
          python3 <<'PY'
          import os, re, sys, time, base64, subprocess, logging, random, threading, unicodedata
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse
          import numpy as np
          import requests
          import webvtt
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          API_URL = "https://tts.revidapi.com/api/v1/tts"
          API_KEYS = []
          for k in os.environ.get("REVID_API_KEYS", "").splitlines():
              k = k.strip()
              if k and k not in API_KEYS:
                  API_KEYS.append(k)
          VOICE_ID = int(os.environ.get("REVID_VOICE_ID", "3001"))
          LANGUAGE = os.environ.get("REVID_LANGUAGE", "vi-VN")
          RATE = os.environ.get("REVID_RATE", "0%")
          TTS_SPEEDUP = float(os.environ.get("TTS_SPEEDUP", "1.0"))
          WORKERS = max(1, int(os.environ.get("TTS_WORKERS", "2")))
          MAX_RETRIES = max(1, int(os.environ.get("TTS_MAX_RETRIES", "3")))
          TIMEOUT = float(os.environ.get("TTS_TIMEOUT", "100"))
          HEARTBEAT = float(os.environ.get("TTS_HEARTBEAT", "20"))
          ERROR_RATIO = float(os.environ.get("TTS_ERROR_RATIO", "0.1"))
          T0 = time.time()
          LOCK = threading.Lock()
          INFLIGHT = {}
          KEY_STATS = {}
          def log(msg):
              with LOCK:
                  print(f"[{time.time() - T0:7.1f}s] {msg}", flush=True)
          def stat(ki, ok, sec):
              with LOCK:
                  s = KEY_STATS.setdefault(ki, {"n": 0, "ok": 0, "err": 0, "sec": 0.0})
                  s["n"] += 1
                  s["ok" if ok else "err"] += 1
                  s["sec"] += sec
          def heartbeat(stop):
              while not stop.wait(HEARTBEAT):
                  with LOCK:
                      items = sorted(INFLIGHT.items())
                  now = time.time()
                  if items:
                      desc = " | ".join(f"c{i}: key#{ki + 1} lan{att} cho {now - t:.0f}s"
                                        for i, (ki, att, t) in items)
                      log(f"[HEARTBEAT] dang cho: {desc}")
                  else:
                      log("[HEARTBEAT] khong co request nao dang cho")
          def pick_key(avoid=None):
              idxs = list(range(len(API_KEYS)))
              if avoid is not None and len(idxs) > 1:
                  idxs = [i for i in idxs if i != avoid]
              i = random.choice(idxs)
              return i, API_KEYS[i]
          def make_headers(key):
              return {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "x-api-key": key,
                  "x-revidapi-client": "tts-studio",
              }
          def normalize_for_tts(text):
              text = unicodedata.normalize("NFKC", text)
              text = re.sub(r"\{[^}]*\}", " ", text)
              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("\\N", " ").replace("\\n", " ")
              text = re.sub(r"[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff]", " ", text)
              text = re.sub(r"[‘’´`]", "'", text)
              text = re.sub(r"[–—―]", "-", text)
              text = text.lower()
              text = re.sub(r"\b([a-zà-ỹđ])-\1", r"\1", text)
              text = re.sub(r"[^\w\s,.!?;:'%-]|_", " ", text)
              text = re.sub(r"\.{2,}", ".", text)
              text = re.sub(r"([,;:!?])\1+", r"\1", text)
              text = re.sub(r"\s+([,.;:!?])", r"\1", text)
              text = re.sub(r"([,;:!?])(?=\S)", r"\1 ", text)
              text = re.sub(r"\.(?=[^\W\d_])", ". ", text)
              text = re.sub(r"\s+", " ", text).strip(" ,.;:-'")
              if not re.search(r"\w", text):
                  return ""
              if not text.endswith((".", "!", "?")):
                  text += "."
              return text
          def n_words(text):
              return len(re.findall(r"\w+", text, re.UNICODE))
          def decode_mp3(mp3_bytes, sr=24000):
              p = subprocess.run(
                  ["ffmpeg", "-hide_banner", "-loglevel", "error", "-i", "pipe:0",
                   "-f", "f32le", "-ar", str(sr), "-ac", "1", "pipe:1"],
                  input=mp3_bytes, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return np.frombuffer(p.stdout, dtype="<f4").copy(), sr
          def plausible(a, sr, text):
              if a.size == 0 or not np.isfinite(a).all():
                  return False
              if float(np.abs(a).max()) < 0.01:
                  return False
              dur = len(a) / float(sr)
              w = max(1, n_words(text))
              return max(0.15, 0.08 * w) <= dur <= 0.9 * w + 2.5
          def fetch_mp3(i, text):
              payload = {
                  "text": text,
                  "voice_id": VOICE_ID,
                  "language": LANGUAGE,
                  "rate": RATE,
                  "return_base64": True,
              }
              last = "unknown"
              bad_key = None
              for attempt in range(1, MAX_RETRIES + 1):
                  ki, key = pick_key(avoid=bad_key)
                  t_req = time.time()
                  with LOCK:
                      INFLIGHT[i] = (ki, attempt, t_req)
                  log(f"c{i} GUI key#{ki + 1} lan {attempt}/{MAX_RETRIES} | {len(text)} ky tu, "
                      f"{n_words(text)} tu | {text[:60]!r}")
                  try:
                      r = requests.post(API_URL, json=payload, headers=make_headers(key), timeout=TIMEOUT)
                      el = time.time() - t_req
                      log(f"c{i} NHAN key#{ki + 1} lan {attempt} | HTTP {r.status_code} | "
                          f"{el:.1f}s | {len(r.content) / 1024:.1f} KB")
                      if r.status_code in (429, 500, 502, 503, 504):
                          stat(ki, False, el)
                          last = f"HTTP {r.status_code} (key #{ki + 1})"
                          bad_key = ki
                          log(f"c{i} LOI TAM THOI {last} | body: {r.text[:200]!r} | cho {3 * attempt}s roi thu lai")
                          time.sleep(3 * attempt)
                          continue
                      data = r.json()
                      if r.status_code != 200 or not data.get("success"):
                          stat(ki, False, el)
                          raise RuntimeError(f"API loi HTTP {r.status_code} (key #{ki + 1}): "
                                             f"{data.get('error')} | {str(data)[:200]}")
                      audio = None
                      b64 = data.get("audio_base64")
                      if b64:
                          if b64.startswith("data:"):
                              b64 = b64.split(",", 1)[1]
                          audio = base64.b64decode(b64)
                      if not audio and data.get("audio_url"):
                          u = urlparse(data["audio_url"])
                          if u.scheme != "https" or (u.hostname or "").lower() != "tts.revidapi.com":
                              raise RuntimeError("audio_url khong hop le")
                          t_dl = time.time()
                          rr = requests.get(data["audio_url"], timeout=90, allow_redirects=False)
                          rr.raise_for_status()
                          audio = rr.content
                          log(f"c{i} tai audio_url mat {time.time() - t_dl:.1f}s")
                      if not audio:
                          stat(ki, False, el)
                          raise RuntimeError("API khong tra ve du lieu MP3")
                      stat(ki, True, el)
                      return audio
                  except (requests.RequestException, ValueError) as e:
                      el = time.time() - t_req
                      stat(ki, False, el)
                      last = f"{e!r} (key #{ki + 1})"
                      bad_key = ki
                      log(f"c{i} LOI MANG/JSON key#{ki + 1} lan {attempt} sau {el:.1f}s: {e!r} | "
                          f"cho {3 * attempt}s roi thu lai")
                      time.sleep(3 * attempt)
                  finally:
                      with LOCK:
                          INFLIGHT.pop(i, None)
              raise RuntimeError(f"het {MAX_RETRIES} lan thu: {last}")
          def save_mp3(mp3_bytes, out):
              if abs(TTS_SPEEDUP - 1.0) > 0.01:
                  subprocess.run(
                      ["ffmpeg", "-y", "-hide_banner", "-loglevel", "error", "-i", "pipe:0",
                       "-af", f"atempo={TTS_SPEEDUP:.3f}", "-codec:a", "libmp3lame", "-b:a", "192k", out],
                      input=mp3_bytes, check=True)
              else:
                  with open(out, "wb") as f:
                      f.write(mp3_bytes)
              if not os.path.exists(out) or os.path.getsize(out) == 0:
                  raise RuntimeError("Empty mp3")
          def process(i, text):
              out = f"chunks/c_{i}.mp3"
              t_all = time.time()
              try:
                  mp3 = fetch_mp3(i, text)
                  a, sr = decode_mp3(mp3)
                  dur = len(a) / float(sr)
                  if not plausible(a, sr, text):
                      return i, text, False, f"bat thuong (dur={dur:.2f}s, {n_words(text)} tu)", time.time() - t_all, dur
                  save_mp3(mp3, out)
                  return i, text, True, "", time.time() - t_all, dur
              except Exception as e:
                  if os.path.exists(out):
                      os.remove(out)
                  return i, text, False, str(e), time.time() - t_all, 0.0
          def main():
              if not API_KEYS:
                  print("Missing GitHub secret REVID_API_KEYS"); sys.exit(1)
              vtt_path = "work/vietnamese.vtt"
              if not os.path.exists(vtt_path):
                  print(f"Missing {vtt_path}"); sys.exit(1)
              vtt = webvtt.read(vtt_path)
              os.makedirs("chunks", exist_ok=True)
              total = len(vtt)
              log(f"[Revid] keys={len(API_KEYS)} | voice_id={VOICE_ID} lang={LANGUAGE} rate={RATE} | "
                  f"speedup={TTS_SPEEDUP} | workers={WORKERS} | timeout={TIMEOUT:.0f}s | cues={total}")
              jobs = []
              for i, c in enumerate(vtt):
                  text = normalize_for_tts(c.text)
                  if not text or text == ".":
                      continue
                  jobs.append((i, text))
              ERROR_THRESHOLD = max(1, int(len(jobs) * ERROR_RATIO))
              log(f"[Revid] jobs={len(jobs)} | Dung neu loi >= {ERROR_THRESHOLD}/{len(jobs)} doan")
              failed = []
              made = 0
              done = 0
              stop = threading.Event()
              threading.Thread(target=heartbeat, args=(stop,), daemon=True).start()
              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  futs = [ex.submit(process, i, t) for i, t in jobs]
                  for fut in as_completed(futs):
                      i, text, ok, msg, took, dur = fut.result()
                      done += 1
                      if ok:
                          made += 1
                          log(f"c{i} XONG OK | tong {took:.1f}s | audio {dur:.2f}s | [{done}/{len(jobs)}]")
                      else:
                          failed.append((i, text))
                          log(f"c{i} THAT BAI -> bo qua | tong {took:.1f}s | {msg} | [{done}/{len(jobs)}]")
                      if done % 5 == 0 or done == len(jobs):
                          el = time.time() - T0
                          rate = done / el * 60 if el > 0 else 0
                          eta = (len(jobs) - done) / (done / el) / 60 if done else 0
                          log(f"[TIEN DO] {done}/{len(jobs)} | ok={made} | loi={len(failed)} | "
                              f"{rate:.1f} cau/phut | con lai ~{eta:.0f} phut")
              stop.set()
              log("[THONG KE THEO KEY]")
              for ki in sorted(KEY_STATS):
                  s = KEY_STATS[ki]
                  avg = s["sec"] / s["n"] if s["n"] else 0
                  log(f"  key#{ki + 1}: {s['n']} request | ok={s['ok']} loi={s['err']} | trung binh {avg:.1f}s/request")
              failed.sort()
              failed_count = len(failed)
              print(f"Tổng số đoạn lỗi: {failed_count}")
              for i, t in failed:
                  print(f"  - doan {i}: {t!r}")
              if failed_count > ERROR_THRESHOLD:
                  print(f"Phát hiện {failed_count} đoạn lỗi (vượt ngưỡng {ERROR_THRESHOLD}). Dừng Workflow!")
                  sys.exit(1)
              with open("count.txt", "w") as f: f.write(str(total))
              print(f"[DONE] Generated {total} TTS chunks (Revid ok={made}, loi={failed_count})")
          main()
          PY

      - name: Build TTS track (numpy, one pass) & final mix filter
        run: |
          set -euo pipefail
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          AUDIO_RATE=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          if [ -z "$AUDIO_RATE" ]; then AUDIO_RATE=44100; fi
          echo "audio_rate=$AUDIO_RATE" >> $GITHUB_ENV
          export VIDEO_DURATION=$VIDEO_DURATION
          export AUDIO_RATE=$AUDIO_RATE
          python3 <<'EOF'
          import os, wave, subprocess
          import numpy as np
          import av
          import webvtt
          # ---- Âm lượng / chất giọng TTS ----
          TARGET_RMS = 0.28
          TTS_BASS_DB = 4
          TTS_COMP_MAKEUP = 2.0
          TTS_VOLUME = 1.0
          # ---- Mix / tốc độ ----
          BG_RATIO = 0.2             # tiếng gốc khi CÓ thoại (muốn nhỏ hơn: 0.1, to hơn: 0.4)
          BG_OUT = 0.8               # tiếng gốc khi KHÔNG có thoại
          BG_IN = BG_RATIO
          BG_GAIN_MAX = 4.0
          DELAY_MS = 0
          GAP_MS = 60
          MAX_DRIFT_MS = 1500
          LOOKAHEAD_MS = 400
          MAX_SPEEDUP = 1.5
          DUCK_PRE_MS = 500
          DUCK_POST_MS = 400
          SIL_THRESH = 10 ** (-50 / 20)
          rate = int(os.environ["AUDIO_RATE"])
          duration = float(os.environ["VIDEO_DURATION"])
          def to_ms(s):
              h, m, sec = s.replace(',', '.').split(':')
              return int(float(h) * 3600000 + float(m) * 60000 + float(sec) * 1000)
          def as_list(x):
              if x is None: return []
              return x if isinstance(x, list) else [x]
          def decode_mono(path):
              c = av.open(path)
              rs = av.AudioResampler(format="flt", layout="mono", rate=rate)
              parts = []
              for frame in c.decode(audio=0):
                  for f in as_list(rs.resample(frame)):
                      parts.append(f.to_ndarray().reshape(-1))
              for f in as_list(rs.resample(None)):
                  parts.append(f.to_ndarray().reshape(-1))
              c.close()
              return np.concatenate(parts).astype(np.float32) if parts else np.zeros(0, np.float32)
          def atempo(x, speed):
              try:
                  p = subprocess.run(
                      ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "f32le", "-ar", str(rate), "-ac", "1",
                       "-i", "pipe:0", "-af", f"atempo={speed:.4f}", "-f", "f32le", "pipe:1"],
                      input=x.astype("<f4").tobytes(), stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True)
                  out = np.frombuffer(p.stdout, dtype="<f4").copy()
                  return out if out.size else x
              except Exception:
                  return x
          def measure_bg_rms():
              """Đo RMS phần có tiếng của audio gốc."""
              try:
                  p = subprocess.run(
                      ["ffmpeg", "-hide_banner", "-loglevel", "error", "-i", "raw_video.mp4",
                       "-vn", "-map", "0:a:0", "-f", "f32le", "-ar", "8000", "-ac", "1", "pipe:1"],
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  x = np.frombuffer(p.stdout, dtype="<f4")
                  v = x[np.abs(x) > 0.02]
                  return float(np.sqrt(np.mean(v ** 2))) if v.size > 1000 else 0.0
              except Exception:
                  return 0.0

          bg_rms = measure_bg_rms()
          BG_GAIN = float(np.clip(TARGET_RMS / bg_rms, 0.5, BG_GAIN_MAX)) if bg_rms > 1e-4 else 1.0
          print(f"Original audio RMS={bg_rms:.3f} -> BG_GAIN={BG_GAIN:.2f}x "
                f"(co thoai: {BG_RATIO * 100:.0f}% TTS, khong thoai: {BG_OUT * 100:.0f}%)")
          total = int((duration + 10) * rate)
          buf = np.zeros(total, dtype=np.float32)
          vtt = webvtt.read("work/vietnamese.vtt")
          n_cues = len(vtt)
          starts = [max(0, int((to_ms(c.start) + DELAY_MS) * rate / 1000)) for c in vtt]
          gap = int(GAP_MS * rate / 1000)
          max_drift = int(MAX_DRIFT_MS * rate / 1000)
          lookahead = int(LOOKAHEAD_MS * rate / 1000)
          # ---------- Pass 1: đọc, cắt lặng, chuẩn hóa RMS ----------
          clips = [None] * n_cues
          skipped = 0
          for i in range(n_cues):
              path = f"chunks/c_{i}.mp3"
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  skipped += 1
                  continue
              try:
                  x = decode_mono(path)
              except Exception as e:
                  print(f"Decode lỗi đoạn {i}: {e}")
                  skipped += 1
                  continue
              loud = np.nonzero(np.abs(x) > SIL_THRESH)[0]
              if loud.size == 0:
                  skipped += 1
                  continue
              x = x[loud[0]:loud[-1] + 1]
              voiced = x[np.abs(x) > 0.02]
              if voiced.size:
                  rms = float(np.sqrt(np.mean(voiced ** 2)))
                  if rms > 1e-4:
                      x = x * min(8.0, TARGET_RMS / rms)
              clips[i] = x
          # ---------- Pass 2: tốc độ mục tiêu mỗi câu, làm mượt để tăng đều ----------
          need = np.ones(n_cues)
          for i, x in enumerate(clips):
              if x is None: continue
              nxt = starts[i + 1] if i + 1 < n_cues else total
              avail = max(1, nxt - starts[i] - gap)
              need[i] = len(x) / avail
          target = np.clip(need, 1.0, MAX_SPEEDUP)
          smooth = target.copy()
          for i in range(n_cues):
              l = target[i - 1] if i > 0 else target[i]
              r = target[i + 1] if i + 1 < n_cues else target[i]
              smooth[i] = max(target[i], 0.5 * target[i] + 0.25 * (l + r))
          # ---------- Pass 3: đặt tuần tự ----------
          cursor = 0
          placed = sped = overlapped = 0
          max_shift = 0
          spans_ms = []
          for i, c in enumerate(vtt):
              spans_ms.append((to_ms(c.start) - DUCK_PRE_MS, to_ms(c.end) + DUCK_POST_MS))
              x = clips[i]
              if x is None:
                  continue
              pos = max(starts[i], cursor + gap)
              pos = min(pos, starts[i] + max_drift)
              nxt = starts[i + 1] if i + 1 < n_cues else total
              avail = nxt + lookahead - pos
              sp = float(smooth[i])
              if avail > 0:
                  sp = max(sp, min(MAX_SPEEDUP, len(x) / avail))
              if sp > 1.03:
                  x = atempo(x, sp)
                  sped += 1
              if pos < cursor:
                  overlapped += 1
              if pos >= total:
                  continue
              n = min(len(x), total - pos)
              buf[pos:pos + n] += x[:n]
              cursor = pos + n
              max_shift = max(max_shift, pos - starts[i])
              spans_ms.append((pos * 1000.0 / rate - 150, (pos + n) * 1000.0 / rate + 250))
              placed += 1
          print(f"TTS placed={placed} skipped={skipped} sped_up={sped} overlapped={overlapped} "
                f"max_shift={max_shift / rate:.2f}s")
          # ---------- Ghi tts_track.wav (soft limiter) ----------
          BLOCK = 1 << 22
          with wave.open("work/tts_track.wav", "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)
              for s in range(0, total, BLOCK):
                  x = buf[s:s + BLOCK].copy()
                  a = np.abs(x)
                  m = a > 0.85
                  if m.any():
                      x[m] = np.sign(x[m]) * (0.85 + 0.15 * np.tanh((a[m] - 0.85) / 0.15))
                  wf.writeframes((np.clip(x, -1.0, 1.0) * 32767).astype("<i2").tobytes())
          # ---------- Đường cong hạ tiếng gốc (ducking) theo cue ----------
          ENV_HZ = 1000
          env = np.full(int((duration + 10) * ENV_HZ), BG_OUT, dtype=np.float32)
          for a, b in spans_ms:
              a = max(0, int(a * ENV_HZ / 1000)); b = min(len(env), int(b * ENV_HZ / 1000))
              if b > a:
                  env[a:b] = BG_IN
          k = int(0.12 * ENV_HZ)
          env = np.convolve(env, np.ones(k, np.float32) / k, mode="same")
          idx = np.arange(len(env), dtype=np.float64)
          with wave.open("work/duck_env.wav", "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)
              for s in range(0, total, BLOCK):
                  e = min(total, s + BLOCK)
                  t = np.arange(s, e, dtype=np.float64) * 1000.0 / rate * (ENV_HZ / 1000.0)
                  g = np.interp(t, idx, env)
                  wf.writeframes((np.clip(g, 0, 1) * 32767).astype("<i2").tobytes())
          # ---------- Filter mix: input 0 = video gốc, 1 = tts_track, 2 = duck_env ----------
          fmt = "aformat=sample_fmts=fltp:channel_layouts=stereo"
          tts_fx = ""
          if TTS_BASS_DB:
              tts_fx += f",bass=g={TTS_BASS_DB}:f=200"
          tts_fx += f",acompressor=threshold=0.1:ratio=3:attack=10:release=120:makeup={TTS_COMP_MAKEUP}"
          if abs(TTS_VOLUME - 1.0) > 0.01:
              tts_fx += f",volume={TTS_VOLUME}"
          with open("final_mix.txt", "w") as f:
              f.write(f"[0:a]aresample={rate}:async=1,{fmt},volume={BG_GAIN:.3f},asetpts=PTS-STARTPTS[bg0];")
              f.write(f"[2:a]aresample={rate},{fmt},asetpts=PTS-STARTPTS[env];")
              f.write("[bg0][env]amultiply[bg];")
              f.write(f"[1:a]aresample={rate},{fmt},asetpts=PTS-STARTPTS{tts_fx}[tts];")
              f.write("[bg][tts]amix=inputs=2:normalize=0:duration=first,alimiter=limit=0.95:level=0[out_audio]")
          EOF
          ls -lh work/tts_track.wav work/duck_env.wav
          cat final_mix.txt; echo

      # ============================================================
      # MIX AUDIO SẴN (tiếng gốc + TTS + ducking) -> work/mixed_audio.m4a
      # ============================================================
      - name: Mix final audio (original + TTS + ducking) -> mixed_audio.m4a
        run: |
          set -euo pipefail
          RATE="${audio_rate:-44100}"
          ffmpeg -y -hide_banner -loglevel error \
            -i raw_video.mp4 -i work/tts_track.wav -i work/duck_env.wav \
            -filter_complex_script final_mix.txt \
            -map "[out_audio]" \
            -c:a aac -ar "$RATE" -b:a 128k -movflags +faststart \
            work/mixed_audio.m4a
          ls -lh work/mixed_audio.m4a
          V=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4)
          A=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/mixed_audio.m4a)
          echo "video=${V}s | mixed_audio=${A}s"
          python3 - "$V" "$A" <<'PY'
          import sys
          v, a = float(sys.argv[1]), float(sys.argv[2])
          if abs(v - a) > 5:
              print(f"::warning::Audio mix lệch {abs(v - a):.1f}s so với video, kiểm tra lại.")
          PY

      # ============================================================
      # ĐÓNG GÓI {slug}-SUB.zip + UPLOAD LÊN PIXELDRAIN -> lấy ID
      # Zip chứa: mixed_audio.m4a, vietnamese.srt/.vtt,
      #           subtitle_geometry.json, static_regions.json
      # (KHÔNG chứa raw_video.mp4 vì đã có sẵn trên Pixeldrain ở bước 1)
      # ============================================================
      - name: Pack results and upload to Pixeldrain
        id: pixel
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          rm -rf pack && mkdir -p pack
          cp work/mixed_audio.m4a          pack/mixed_audio.m4a
          cp work/vietnamese.srt           pack/vietnamese.srt
          cp work/vietnamese.vtt           pack/vietnamese.vtt
          cp work/subtitle_geometry.json   pack/subtitle_geometry.json
          cp work/static_regions.json      pack/static_regions.json
          ZIP="${SLUG}-SUB.zip"
          rm -f "$ZIP"
          (cd pack && zip -0 -q -r "../$ZIP" .)
          unzip -tq "$ZIP"
          SIZE=$(stat -c %s "$ZIP")
          echo "ZIP: $ZIP = $((SIZE / 1048576)) MB"
          ID=""
          MAX=6
          for attempt in $(seq 1 "$MAX"); do
            echo "[UP] Pixeldrain attempt $attempt/$MAX"
            rm -f work/pd_upload.json
            code=$(curl -sS -T "$ZIP" -u ":$PD_KEY" \
              -o work/pd_upload.json -w "%{http_code}" \
              "https://pixeldrain.com/api/file/${ZIP}" || true)
            echo "HTTP $code: $(head -c 300 work/pd_upload.json 2>/dev/null || true)"
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              ID=$(jq -r '.id // empty' work/pd_upload.json)
              [ -n "$ID" ] && break
            fi
            case "$code" in
              401|403|413|422)
                echo "::error::Pixeldrain từ chối (HTTP $code), không thử lại: $(head -c 300 work/pd_upload.json 2>/dev/null || true)"
                exit 1 ;;
            esac
            [ "$attempt" -lt "$MAX" ] && sleep $(( attempt * 10 ))
          done
          [ -n "$ID" ] || { echo '::error::Upload Pixeldrain thất bại sau nhiều lần thử'; exit 1; }
          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://pixeldrain.com/api/file/${ID}/info")
          remote_size=$(jq -r '.size' <<<"$info")
          echo "Pixeldrain ID=$ID | size=$remote_size (local=$SIZE)"
          [ "$remote_size" = "$SIZE" ] || { echo '::error::Size trên Pixeldrain không khớp file local'; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Link: https://pixeldrain.com/u/${ID}"

      - name: Notify VPS (type=sub)
        env:
          PIXEL_ID: ${{ steps.pixel.outputs.id }}
        run: |
          set -euo pipefail
          [ -n "$PIXEL_ID" ] || { echo '::error::Không có Pixeldrain ID'; exit 1; }
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -G "https://cp.ssplay.net/vicdn.php" \
            --data-urlencode "type=sub" \
            --data-urlencode "slug=${SLUG}" \
            --data-urlencode "pixel=${PIXEL_ID}"
          echo
          echo "Đã báo type=sub cho VPS (slug=${SLUG}, pixel=${PIXEL_ID})."
