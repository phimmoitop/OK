      - name: Create static overlay detection script
        run: |
          cat > static_detect.py <<'PY'
          """
          Phat hien lop phu CO DINH (watermark/logo) CHI O 2 GOC TREN (top-left, top-right).
          Lay 8-16 frame NGAU NHIEN (chia deu theo thoi gian, moi doan 1 frame), tim cac diem canh
          xuat hien o >=80% so frame VA gan nhu khong doi mau, CHI xet trong 2 goc tren.
          Neu co watermark nam trong goc -> che FULL goc do, sat mep video.
          Ket qua: work/static_regions.json. Loi o day KHONG lam hong workflow.
          """
          import cv2, json, math, os, random, subprocess
          import numpy as np
          from pathlib import Path
          VIDEO = "raw_video.mp4"
          WORK = Path("work")
          W_SMALL = 800
          EDGE_PRESENT = 0.80
          STD_MAX = 10.0
          SCAN_X = 0.35
          SCAN_Y = 0.25
          MAX_REGIONS = 4
          CORNERS = ("tl", "tr")
          CORNER_X = SCAN_X
          CORNER_Y = SCAN_Y
          CORNER_MIN_W = 0.22
          CORNER_MIN_H = 0.12
          CORNER_MAX_W = 0.38
          CORNER_MAX_H = 0.28
          CORNER_PAD = 0.03
          def log(msg):
              print(msg, flush=True)
          def grab_frame(t, width, height):
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-ss", f"{t:.3f}",
                     "-i", VIDEO, "-frames:v", "1", "-an",
                     "-f", "rawvideo", "-pix_fmt", "bgr24", "pipe:1"]
              out = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout
              if len(out) < width * height * 3:
                  return None
              return np.frombuffer(out, np.uint8)[:width * height * 3].reshape(height, width, 3).copy()
          def merge_boxes(boxes, gap):
              boxes = [list(b) for b in boxes]
              changed = True
              while changed:
                  changed = False
                  out = []
                  while boxes:
                      a = boxes.pop()
                      merged = False
                      for b in out:
                          if a[0] <= b[2] + gap and b[0] <= a[2] + gap and a[1] <= b[3] + gap and b[1] <= a[3] + gap:
                              b[0], b[1] = min(a[0], b[0]), min(a[1], b[1])
                              b[2], b[3] = max(a[2], b[2]), max(a[3], b[3])
                              merged = changed = True
                              break
                      if not merged:
                          out.append(a)
                  boxes = out
              return boxes
          def expand_corners(boxes, W, H):
              """Box nam trong goc -> thay bang 1 vung goc lon, sat mep video."""
              groups = {"tl": [], "tr": [], "bl": [], "br": []}
              rest = []
              for b in boxes:
                  cx, cy = (b[0] + b[2]) / 2.0, (b[1] + b[3]) / 2.0
                  left, right = cx < CORNER_X * W, cx > (1 - CORNER_X) * W
                  top, bottom = cy < CORNER_Y * H, cy > (1 - CORNER_Y) * H
                  key = ("t" if top else "b" if bottom else "") + ("l" if left else "r" if right else "")
                  if len(key) == 2 and key in CORNERS:
                      groups[key].append(b)
                  else:
                      rest.append(b)
              out = list(rest)
              for key, g in groups.items():
                  if not g:
                      continue
                  ux1, uy1 = min(b[0] for b in g), min(b[1] for b in g)
                  ux2, uy2 = max(b[2] for b in g), max(b[3] for b in g)
                  px, py = CORNER_PAD * W, CORNER_PAD * H
                  mw, mh = CORNER_MIN_W * W, CORNER_MIN_H * H
                  xw, xh = CORNER_MAX_W * W, CORNER_MAX_H * H
                  if key[1] == "l":
                      x1, x2 = 0, min(xw, max(ux2 + px, mw))
                  else:
                      x1, x2 = max(W - xw, min(ux1 - px, W - mw)), W
                  if key[0] == "t":
                      y1, y2 = 0, min(xh, max(uy2 + py, mh))
                  else:
                      y1, y2 = max(H - xh, min(uy1 - py, H - mh)), H
                  log(f"[STATIC-OVERLAY] goc {key}: che full {int(x2 - x1)}x{int(y2 - y1)} (small-scale)")
                  out.append([x1, y1, x2, y2])
              return out
          def load_sub_rects():
              """Cac vung blur sub (da duoc lam mo roi) -> bo qua box nam gon trong do."""
              rects = []
              gp = WORK / "subtitle_geometry.json"
              if gp.exists():
                  try:
                      geo = json.loads(gp.read_text(encoding="utf-8"))
                      if geo.get("valid"):
                          for s in geo.get("segments", []):
                              b = s.get("blur")
                              if b:
                                  rects.append((b["x"], b["y"], b["x"] + b["width"], b["y"] + b["height"]))
                  except Exception:
                      pass
              return rects
          def detect():
              if os.environ.get("STATIC_DETECT", "1") != "1":
                  log("[STATIC-OVERLAY] tat (STATIC_DETECT != 1)")
                  return []
              duration = float(subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=nw=1:nk=1", VIDEO], text=True).strip())
              cap = cv2.VideoCapture(VIDEO)
              width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
              height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
              cap.release()
              if width <= 0 or height <= 0 or duration < 3:
                  return []
              n = max(8, min(16, int(duration // 10)))
              rng = random.Random()
              times = []
              for i in range(n):
                  lo = duration * (0.03 + 0.94 * i / n)
                  hi = duration * (0.03 + 0.94 * (i + 1) / n)
                  times.append(rng.uniform(lo, hi))
              log(f"[STATIC-OVERLAY] lay {n} frame ngau nhien: " + ", ".join(f"{t:.1f}s" for t in times))
              scale = W_SMALL / float(width)
              sh = max(2, int(round(height * scale)))
              grays, edges, first_img = [], [], None
              for t in times:
                  img = grab_frame(t, width, height)
                  if img is None:
                      continue
                  if first_img is None:
                      first_img = img.copy()
                  g = cv2.resize(cv2.cvtColor(img, cv2.COLOR_BGR2GRAY), (W_SMALL, sh), interpolation=cv2.INTER_AREA)
                  e = cv2.Canny(cv2.GaussianBlur(g, (3, 3), 0), 40, 120)
                  e = cv2.dilate(e, np.ones((3, 3), np.uint8)) > 0
                  grays.append(g.astype(np.float32))
                  edges.append(e)
              m = len(grays)
              if m < 5:
                  log("[STATIC-OVERLAY] khong du frame de phan tich")
                  return []
              stack = np.stack(grays)
              std = stack.std(axis=0)
              if float(std.mean()) < 2.0:
                  log("[STATIC-OVERLAY] video gan nhu dung yen -> bo qua de tranh lam mo nham")
                  return []
              count = np.sum(np.stack(edges), axis=0)
              static = (count >= int(math.ceil(EDGE_PRESENT * m))) & (std < STD_MAX)
              ys = np.arange(sh)[:, None]
              xs = np.arange(W_SMALL)[None, :]
              zone = (ys < SCAN_Y * sh) & ((xs < SCAN_X * W_SMALL) | (xs > (1 - SCAN_X) * W_SMALL))
              static &= zone
              ratio = float(static.sum()) / max(1, int(zone.sum()))
              log(f"[STATIC-OVERLAY] pixel tinh trong 2 goc tren: {ratio * 100:.2f}%")
              if ratio > 0.25:
                  log("[STATIC-OVERLAY] ty le tinh qua cao (canh quay co dinh?) -> bo qua")
                  return []
              k = cv2.getStructuringElement(cv2.MORPH_RECT, (max(9, int(W_SMALL * 0.03)), 5))
              closed = cv2.morphologyEx(static.astype(np.uint8) * 255, cv2.MORPH_CLOSE, k)
              nlab, _, stats, _ = cv2.connectedComponentsWithStats(closed, connectivity=8)
              boxes = []
              for i in range(1, nlab):
                  x, y, w, h, _a = stats[i]
                  pix = int(static[y:y + h, x:x + w].sum())
                  if w < 10 or h < 6 or pix < 25:
                      continue
                  if w * h > 0.12 * sh * W_SMALL:
                      continue
                  if pix / float(w * h) < 0.04:
                      continue
                  if w > 0.6 * W_SMALL and h < 0.04 * sh:
                      continue
                  if h > 0.6 * sh and w < 0.04 * W_SMALL:
                      continue
                  boxes.append([x - 4, y - 4, x + w + 4, y + h + 4])
              boxes = merge_boxes(boxes, gap=int(W_SMALL * 0.04))
              boxes = expand_corners(boxes, W_SMALL, sh)
              boxes = merge_boxes(boxes, gap=2)
              sub_rects = load_sub_rects()
              inv = 1.0 / scale
              regions = []
              for b in boxes:
                  x1 = max(0, int(b[0] * inv) - 4)
                  y1 = max(0, int(b[1] * inv) - 4)
                  x2 = min(width, int(math.ceil(b[2] * inv)) + 4)
                  y2 = min(height, int(math.ceil(b[3] * inv)) + 4)
                  x1 -= x1 % 2
                  y1 -= y1 % 2
                  w = (x2 - x1) // 2 * 2
                  h = (y2 - y1) // 2 * 2
                  if w < 16 or h < 12:
                      continue
                  skip = False
                  for sr in sub_rects:
                      ix = max(0, min(x1 + w, sr[2]) - max(x1, sr[0]))
                      iy = max(0, min(y1 + h, sr[3]) - max(y1, sr[1]))
                      if ix * iy >= 0.6 * w * h:
                          log(f"[STATIC-OVERLAY] bo qua vung ({x1},{y1},{w},{h}): nam trong vung blur sub")
                          skip = True
                          break
                  if skip:
                      continue
                  tol = 6
                  feather = [int(x1 > tol), int(x1 + w < width - tol),
                             int(y1 > tol), int(y1 + h < height - tol)]
                  regions.append({"x": x1, "y": y1, "w": w, "h": h, "feather": feather})
              regions.sort(key=lambda r: r["w"] * r["h"], reverse=True)
              regions = regions[:MAX_REGIONS]
              if sum(r["w"] * r["h"] for r in regions) > 0.30 * width * height:
                  log("[STATIC-OVERLAY] tong dien tich qua lon -> bo qua")
                  return []
              if regions and first_img is not None:
                  for r in regions:
                      cv2.rectangle(first_img, (r["x"], r["y"]), (r["x"] + r["w"], r["y"] + r["h"]),
                                    (255, 0, 255), 3)
                  cv2.imwrite("work/static-regions-preview.jpg", first_img)
              for r in regions:
                  log(f"[STATIC-OVERLAY] che: x={r['x']} y={r['y']} w={r['w']} h={r['h']} feather={r['feather']}")
              if not regions:
                  log("[STATIC-OVERLAY] khong tim thay lop phu co dinh nao")
              return regions
          def main():
              regions = []
              try:
                  regions = detect()
              except Exception as e:
                  log(f"[STATIC-OVERLAY] loi, bo qua: {e!r}")
                  regions = []
              Path("work/static_regions.json").write_text(
                  json.dumps({"regions": regions}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if __name__ == "__main__":
              main()
          PY

      - name: Detect static overlays (top-left / top-right watermark)
        env:
          STATIC_DETECT: "1"
        run: |
          set -euo pipefail
          python3 static_detect.py
          cat work/static_regions.json

      # ============================================================
      # DỊCH: dọn sub Trung -> Gemini -> không bao giờ fallback tiếng Trung
      # ============================================================
      - name: Create Translate script
        run: |
          cat > translate_native.py <<'PY'
          """
          Doc sub goc (work/native.srt, tieng Trung) -> DON SACH sub Trung (gop cue trung/gan giong,
          bo rac) -> dich sang tieng Viet bang Gemini -> rut gon cau qua dai.
          Dong AI tra "..." (rac OCR khong doc duoc) = BO TRONG, KHONG BAO GIO giu lai tieng Trung.
          Ket qua: work/vi_raw.json (start, end, text, vi). Buoc finalize_vi.py se lam sach hoan toan.
          """
          import os, re, time, random, json
          from difflib import SequenceMatcher
          from pathlib import Path
          import pysubs2
          from google import genai
          from google.genai import types
          WORK = Path("work")
          NATIVE_SRT = WORK / "native.srt"
          MIN_CUE_DURATION = 0.10
          ZH_MERGE_GAP = 1.5
          ZH_MERGE_SIM = 0.55
          MAX_SYL_PER_SEC = 6.0
          CJK_RE = re.compile(r"[\u2e80-\u2fdf\u3000-\u30ff\u3100-\u31ff\u3200-\u32ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]")
          # ---- GEMINI ----
          GEMINI_MODEL = "gemini-3.5-flash-lite"
          GEMINI_BATCH_SIZE = 150
          GEMINI_MAX_RETRIES = 10
          RAW_GEMINI_KEYS = os.environ.get("GEMINI_API_KEYS", "")
          GEMINI_API_KEYS = [k.strip() for k in RAW_GEMINI_KEYS.strip().splitlines() if k.strip()]
          SYSTEM_INSTRUCTION = (
              "You are a professional video subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty, unreadable garbage, or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context of the whole video.\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text.\n"
              "6. PRONOUN SAFETY (VERY IMPORTANT): The source is Chinese, where family/relationship terms "
              "(mother, older brother, uncle, etc.) are usually explicit in the dialogue itself. When translating "
              "to Vietnamese, ALWAYS use the correct relational pronoun based on the clear relationship stated or "
              "implied (mẹ/con, anh/em, cô/cháu, etc.) — never swap the roles.\n"
              "7. If the relationship between speaker and listener is AMBIGUOUS or CANNOT be determined from the "
              "given line alone, DO NOT guess a specific relational pronoun. Instead, rephrase the sentence to be "
              "SHORTER and more NEUTRAL — using no pronoun, an implied subject, or a generic/neutral phrasing — "
              "so the sentence still sounds natural in Vietnamese without committing to an incorrect relationship.\n"
              "8. The source subtitles come from OCR of burned-in subtitles and may contain recognition errors, "
              "wrong or missing characters and homophone mistakes. Use the surrounding context to infer the "
              "intended meaning. If a line is so corrupted that you cannot recover a sensible meaning, output '...' for it.\n"
              "9. CONCISENESS (VERY IMPORTANT): Make every Vietnamese line SHORT, concise and easy to understand at a "
              "glance. Use simple, everyday spoken Vietnamese. Cut filler words, repeated phrases and unnecessary "
              "modifiers, and prefer short sentences. Keep the core meaning and the tone, but never pad or explain.\n"
              "10. The output must be PURE VIETNAMESE. NEVER output Chinese characters, pinyin or any other language."
          )
          def log(msg):
              print(msg, flush=True)
          def has_cjk(t):
              return bool(CJK_RE.search(t or ""))
          def cjk_n(t):
              return sum("\u4e00" <= ch <= "\u9fff" for ch in t)
          def norm_zh(t):
              return re.sub(r"[^\u4e00-\u9fffA-Za-z0-9]", "", t)
          def similar_zh(a, b):
              a, b = norm_zh(a), norm_zh(b)
              if not a or not b:
                  return False
              if min(len(a), len(b)) >= 3 and (a in b or b in a):
                  return True
              need = ZH_MERGE_SIM if min(len(a), len(b)) >= 6 else 0.75
              return SequenceMatcher(None, a, b).ratio() >= need
          def clean_text(raw):
              t = raw.replace("\\N", " ").replace("\\n", " ").replace("\n", " ")
              t = re.sub(r"\{[^}]*\}", "", t)
              t = re.sub(r"<[^>]+>", "", t)
              t = re.sub(r"\s+", " ", t).strip()
              return t
          def load_native_cues():
              if not NATIVE_SRT.exists():
                  raise RuntimeError(f"Khong tim thay {NATIVE_SRT}")
              subs = pysubs2.load(str(NATIVE_SRT), encoding="utf-8")
              raw = []
              for ev in subs.events:
                  text = clean_text(ev.text)
                  if not text:
                      continue
                  raw.append({"start": ev.start / 1000.0, "end": ev.end / 1000.0, "text": text})
              raw.sort(key=lambda c: (c["start"], c["end"]))
              final = []
              for c in raw:
                  st, en = c["start"], c["end"]
                  if final and st < final[-1]["end"]:
                      if st > final[-1]["start"]:
                          mid = (st + final[-1]["end"]) / 2.0
                          mid = min(mid, st)
                          final[-1]["end"] = max(final[-1]["start"] + 0.01, mid)
                      else:
                          st = final[-1]["end"]
                  if en - st < MIN_CUE_DURATION:
                      continue
                  final.append({"start": st, "end": en, "text": c["text"]})
              log(f"CHINESE CUES (native sub, tho) = {len(final)}")
              if not final:
                  raise RuntimeError("Sub goc khong co cue nao hop le.")
              return final
          def clean_zh_cues(cues):
              """Bo cue khong co chu Han, gop cue gan nhau co chu gan giong."""
              kept = [c for c in cues if cjk_n(c["text"]) >= 2]
              dropped = len(cues) - len(kept)
              out, merged = [], 0
              for c in kept:
                  if out:
                      p = out[-1]
                      if c["start"] - p["end"] <= ZH_MERGE_GAP and similar_zh(p["text"], c["text"]):
                          p["end"] = max(p["end"], c["end"])
                          if len(norm_zh(c["text"])) > len(norm_zh(p["text"])) * 1.15:
                              p["text"] = c["text"]
                          merged += 1
                          continue
                  out.append(dict(c))
              log(f"CLEAN ZH: bo {dropped} cue khong co chu Han, gop {merged} cue trung/gan giong -> con {len(out)} cue")
              if not out:
                  raise RuntimeError("Sau khi don sach khong con cue nao.")
              return out
          def get_random_gemini_client():
              key = random.choice(GEMINI_API_KEYS)
              return genai.Client(api_key=key), key
          def call_gemini_with_retry(prompt_text, max_retries=GEMINI_MAX_RETRIES):
              for attempt in range(max_retries):
                  wait = 6 * (2 ** attempt)
                  client, key = get_random_gemini_client()
                  log(f">> GUI GEMINI - Lan {attempt + 1}/{max_retries} | Key #{GEMINI_API_KEYS.index(key) + 1} | {time.strftime('%H:%M:%S')}")
                  try:
                      t0 = time.time()
                      response = client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=SYSTEM_INSTRUCTION,
                              temperature=0.3,
                          )
                      )
                      log(f"<< NHAN KET QUA - Thanh cong sau {time.time() - t0:.1f}s")
                      return response.text
                  except Exception as e:
                      err = str(e)
                      log(f"<< LOI API: {err}")
                      if any(c in err for c in ("503", "429", "500", "UNAVAILABLE")):
                          log(f"   Server ban/qua tai/limit. Doi key va cho {wait}s...")
                          time.sleep(wait)
                      else:
                          log("   Loi khong the retry. Dung thu lai.")
                          break
              return None
          def parse_translated(response_text):
              out = {}
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          head, val = line.split("]", 1)
                          val = val.strip()
                          idx = int(head.replace("[", "").split("|")[0].strip())
                          out[idx] = "" if val == "..." else val
                      except Exception:
                          pass
              return out
          def parse_pairs(response_text):
              pairs = []
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          head, val = line.split("]", 1)
                          idx = int(head.replace("[", "").split("|")[0].strip())
                          pairs.append((idx, val.strip()))
                      except Exception:
                          pass
              return pairs
          def parse_batch(response_text, n):
              """Ghep theo SO THU TU AI ghi. Dong sot -> KHONG co trong dict (de retry).
              Dong AI chu dong tra '...' -> co trong dict voi gia tri '' (= bo trong, KHONG retry)."""
              pairs = parse_pairs(response_text)
              out = {}
              in_range = sum(1 for i, _ in pairs if 0 <= i < n)
              if len(pairs) == n and in_range < n * 0.5:
                  log(">> SUA SO THU TU: AI ghi sai so hang loat, ghep theo vi tri")
                  for k, (_, val) in enumerate(pairs):
                      out[k] = "" if val == "..." else val
                  return out
              prev = -1
              for k, (i, val) in enumerate(pairs):
                  nxt_i = pairs[k + 1][0] if k + 1 < len(pairs) else None
                  if prev < i < n:
                      idx = i
                  else:
                      expected = prev + 1
                      if expected < n and expected not in out and (nxt_i is None or nxt_i == expected + 1):
                          log(f">> SUA SO THU TU: AI ghi [{i}], dat vao [{expected}]")
                          idx = expected
                      else:
                          log(f">> BO QUA dong thua/trung/sai so [{i}]: {val[:40]!r}")
                          continue
                  out[idx] = "" if val == "..." else val
                  prev = idx
              return out
          def translate_cues(cues):
              if not GEMINI_API_KEYS:
                  raise RuntimeError("Chua cau hinh GEMINI_API_KEYS trong GitHub Secrets.")
              total = len(cues)
              total_batches = (total + GEMINI_BATCH_SIZE - 1) // GEMINI_BATCH_SIZE
              log(f"BAT DAU DICH - {total} dong / {total_batches} batch")
              results = []
              n_blank = 0
              for i in range(0, total, GEMINI_BATCH_SIZE):
                  batch = cues[i:i + GEMINI_BATCH_SIZE]
                  bn = i // GEMINI_BATCH_SIZE + 1
                  log(f"[BATCH {bn}/{total_batches}] Dong {i + 1}-{min(i + GEMINI_BATCH_SIZE, total)}")
                  prompt_text = "".join(f"[{idx}] {c['text'].strip() or '...'}\n" for idx, c in enumerate(batch))
                  log(">> NOI DUNG GUI LEN API:")
                  for line in prompt_text.strip().split("\n"):
                      log(f"   {line}")
                  response_text = call_gemini_with_retry(prompt_text)
                  if response_text is None:
                      raise RuntimeError(f"[THAT BAI] Khong the dich batch {bn}.")
                  log(">> KET QUA DICH TU AI:")
                  for line in response_text.strip().split("\n"):
                      log(f"   {line}")
                  translated = parse_batch(response_text, len(batch))
                  redo = [idx for idx in range(len(batch))
                          if idx not in translated or has_cjk(translated.get(idx, ""))]
                  if redo:
                      log(f">> Retry {len(redo)} dong bi sot/con chu Han: {redo}")
                      rp = "Translate ONLY these lines into pure Vietnamese (no Chinese characters). Use '...' if unreadable:\n\n"
                      rp += "".join(f"[{idx}] {batch[idx]['text'].strip() or '...'}\n" for idx in redo)
                      rp += "\nOutput ONLY these lines with their exact [index] prefix."
                      rr = call_gemini_with_retry(rp)
                      if rr:
                          log(">> KET QUA RETRY:")
                          for line in rr.strip().split("\n"):
                              log(f"   {line}")
                          for k, v in parse_translated(rr).items():
                              if k in redo and not has_cjk(v):
                                  translated[k] = v
                  for idx, cue in enumerate(batch):
                      vi = translated.get(idx, "")
                      if not vi.strip():
                          vi = ""
                          n_blank += 1
                          log(f"   [{i + idx + 1:04d}] BO TRONG: {cue['text']!r}")
                      results.append({"start": cue["start"], "end": cue["end"],
                                      "text": cue["text"], "vi": vi})
                  log(f"[BATCH {bn}/{total_batches}] Hoan thanh")
                  time.sleep(3)
              log(f">> Tong cong {n_blank}/{total} dong bo trong (rac OCR / khong doc duoc)")
              return results
          def count_syl(t):
              return len(re.findall(r"\w+", t, re.UNICODE))
          def shorten_long(results):
              for _round in range(2):
                  todo = []
                  for i, r in enumerate(results):
                      if not r["vi"].strip():
                          continue
                      nxt = results[i + 1]["start"] if i + 1 < len(results) else r["end"] + 2
                      budget = min(max(nxt - r["start"], 0.8), 10.0)
                      limit = max(2, int(budget * MAX_SYL_PER_SEC))
                      if count_syl(r["vi"]) > limit:
                          todo.append((i, limit))
                  log(f">> SHORTEN round {_round + 1}: {len(todo)} dong qua dai")
                  if not todo:
                      break
                  for k in range(0, len(todo), 100):
                      part = todo[k:k + 100]
                      prompt = (
                          "Rewrite each Vietnamese subtitle line to be SHORTER so it can be spoken within the time limit. "
                          "Keep the core meaning, keep the same speaker relationship and pronouns (or drop pronouns if unsure), "
                          "keep it natural and fluent, and drop filler words. Each line is formatted as [index|max_words] text. "
                          "Your output for each line MUST be at most max_words words. "
                          "Output ONLY '[index] shortened text' lines. Do NOT output the max_words number. Pure Vietnamese only.\n\n"
                          + "".join(f"[{i}|{lim}] {results[i]['vi']}\n" for i, lim in part)
                      )
                      resp = call_gemini_with_retry(prompt)
                      if not resp:
                          continue
                      log(">> KET QUA RUT GON:")
                      for line in resp.strip().split("\n"):
                          log(f"   {line}")
                      allowed = {i for i, _ in part}
                      for i, txt in parse_translated(resp).items():
                          if i in allowed and txt and not has_cjk(txt):
                              results[i]["vi"] = txt
                      time.sleep(2)
              return results
          def write_debug(results):
              with open(WORK / "translation_debug.txt", "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh, vi = len(r["text"]), len(r["vi"])
                      dur = r["end"] - r["start"]
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s ({dur:.2f}s)\n")
                      f.write(f"  ZH ({zh}): {r['text']}\n")
                      f.write(f"  VI ({vi}, {count_syl(r['vi'])} tu): {r['vi']}\n\n")
          def main():
              cues = load_native_cues()
              cues = clean_zh_cues(cues)
              subs = pysubs2.SSAFile()
              for c in cues:
                  subs.events.append(pysubs2.SSAEvent(start=int(c["start"] * 1000), end=int(c["end"] * 1000), text=c["text"]))
              subs.save(str(WORK / "chinese.srt"), encoding="utf-8")
              for i, c in enumerate(cues, 1):
                  log("[%04d] %.3f -> %.3f | %s" % (i, c["start"], c["end"], c["text"]))
              translated = translate_cues(cues)
              translated = shorten_long(translated)
              write_debug(translated)
              (WORK / "vi_raw.json").write_text(json.dumps(translated, ensure_ascii=False, indent=1), encoding="utf-8")
              log("TRANSLATE COMPLETE -> work/vi_raw.json (chua hoan thien, chay finalize_vi.py)")
          if __name__ == "__main__":
              main()
          PY

      - name: Run Translate (native sub → Vietnamese raw)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          python translate_native.py

      # ============================================================
      # HOÀN THIỆN SUB VIỆT (TRƯỚC KHI TTS)
      # ============================================================
      - name: Create Finalize-Vietnamese script
        run: |
          cat > finalize_vi.py <<'PY'
          """
          work/vi_raw.json -> work/vietnamese.srt + work/vietnamese.vtt (SACH).
          1) Chuan hoa: NFKC, bo tag/markdown, XOA moi ky tu Han/CJK/fullwidth. Dong co chu Han ma con lai < 3 tu -> bo.
          2) Bo dong trong / chi co dau cau / khong co chu cai.
          3) Gop cau TRUNG hoac GAN GIONG nhau trong cua so thoi gian ngan, giu ban dai hon.
          4) Sua thoi gian: sap xep, khong chong lan, end > start.
          5) Kiem tra cung: khong CJK, khong cap lien ke trung lap, co it nhat vai cue. Loi -> exit 1.
          """
          import json, re, sys, unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path
          WORK = Path("work")
          CJK_RE = re.compile(r"[\u2e80-\u2fdf\u3000-\u30ff\u3100-\u31ff\u3200-\u32ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]")
          SHORT_WORDS = 4
          WIN_SHORT = 3.0
          WIN_LONG = 8.0
          SIM_THRESHOLD = 0.85
          CONTAIN_RATIO = 0.60
          LOOKBACK = 3
          MIN_FINAL_CUES = 1
          def log(msg):
              print(msg, flush=True)
          def clean_vi(text):
              t = unicodedata.normalize("NFKC", text or "")
              t = re.sub(r"\{[^}]*\}", " ", t)
              t = re.sub(r"<[^>]+>", " ", t)
              t = re.sub(r"^\s*\[\d+(\|\d+)?\]\s*", "", t)
              t = t.replace("、", ", ").replace("。", ". ")
              had_cjk = bool(CJK_RE.search(t))
              t = CJK_RE.sub(" ", t)
              t = t.replace("…", "...")
              t = re.sub(r"[\*_`#~^|\\<>]", " ", t)
              t = re.sub(r"\.{2,}", ".", t)
              t = re.sub(r"([,;:!?])\1+", r"\1", t)
              t = re.sub(r"\s+([,.;:!?])", r"\1", t)
              t = re.sub(r"([,;:!?])(?=[^\s,;:!?.])", r"\1 ", t)
              t = re.sub(r"\s+", " ", t).strip()
              t = t.lstrip(" ,.;:!?-–—'\"")
              t = t.rstrip(" ,;:-–—'\"")
              t = unicodedata.normalize("NFC", t)
              return t, had_cjk
          def n_words(t):
              return len(re.findall(r"\w+", t, re.UNICODE))
          def has_letters(t):
              return bool(re.search(r"[^\W\d_]", t, re.UNICODE))
          def key_of(t):
              k = re.sub(r"[\W_]+", " ", t.casefold(), flags=re.UNICODE)
              return re.sub(r"\s+", " ", k).strip()
          def is_dup(ka, kb):
              if not ka or not kb:
                  return False
              if ka == kb:
                  return True
              short, long_ = (ka, kb) if len(ka) <= len(kb) else (kb, ka)
              if len(short.split()) >= 2 and short in long_ and len(short) / float(len(long_)) >= CONTAIN_RATIO:
                  return True
              return SequenceMatcher(None, ka, kb).ratio() >= SIM_THRESHOLD
          def ts(sec, sep):
              ms = max(0, int(round(sec * 1000)))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{s:02}{sep}{ms:03}"
          def main():
              raw = json.loads((WORK / "vi_raw.json").read_text(encoding="utf-8"))
              raw.sort(key=lambda r: (r["start"], r["end"]))
              dropped = []
              cues = []
              for r in raw:
                  t, had_cjk = clean_vi(r.get("vi", ""))
                  if not t or not has_letters(t):
                      dropped.append((r["start"], "TRONG", r.get("text", ""), r.get("vi", "")))
                      continue
                  if had_cjk and n_words(t) < 3:
                      dropped.append((r["start"], "CON_CHU_HAN", r.get("text", ""), r.get("vi", "")))
                      continue
                  cues.append({"start": float(r["start"]), "end": float(r["end"]), "text": t, "key": key_of(t)})
              n_clean = len(cues)
              out = []
              for c in cues:
                  hit, hit_pos = None, None
                  for back, p in enumerate(reversed(out[-LOOKBACK:])):
                      words = min(n_words(p["text"]), n_words(c["text"]))
                      win = WIN_SHORT if words < SHORT_WORDS else WIN_LONG
                      if c["start"] - p["end"] <= win and is_dup(p["key"], c["key"]):
                          hit, hit_pos = p, back
                          break
                  if hit is None:
                      out.append(c)
                      continue
                  if len(c["key"]) > len(hit["key"]):
                      hit["text"], hit["key"] = c["text"], c["key"]
                  if hit_pos == 0:
                      hit["end"] = max(hit["end"], c["end"])
                  dropped.append((c["start"], "TRUNG", "", c["text"]))
              n_dedup = len(out)
              out.sort(key=lambda c: (c["start"], c["end"]))
              for i, c in enumerate(out):
                  if i + 1 < len(out) and c["end"] > out[i + 1]["start"]:
                      c["end"] = out[i + 1]["start"]
                  if c["end"] <= c["start"]:
                      c["end"] = c["start"] + 0.1
              errors = []
              for i, c in enumerate(out):
                  if CJK_RE.search(c["text"]):
                      errors.append(f"cue {i} con ky tu Trung: {c['text']!r}")
                  if i > 0:
                      p = out[i - 1]
                      words = min(n_words(p["text"]), n_words(c["text"]))
                      win = WIN_SHORT if words < SHORT_WORDS else WIN_LONG
                      if c["start"] - p["end"] <= win and is_dup(p["key"], c["key"]):
                          errors.append(f"cue {i-1}/{i} trung lap: {p['text']!r} | {c['text']!r}")
              if len(out) < MIN_FINAL_CUES:
                  errors.append("khong con cue nao sau khi hoan thien")
              with (WORK / "vi_dropped.txt").open("w", encoding="utf-8") as f:
                  for st, why, zh, vi in dropped:
                      f.write(f"{st:8.2f}s | {why:11s} | ZH={zh!r} | VI={vi!r}\n")
              log(f"[FINALIZE] raw={len(raw)} -> sach={n_clean} -> sau loai trung={n_dedup} | "
                  f"bo {len(dropped)} dong (chi tiet: work/vi_dropped.txt)")
              if errors:
                  for e in errors[:30]:
                      print(f"::error::{e}")
                  sys.exit(1)
              with (WORK / "vietnamese.srt").open("w", encoding="utf-8") as f:
                  for i, c in enumerate(out, 1):
                      f.write(f"{i}\n{ts(c['start'], ',')} --> {ts(c['end'], ',')}\n{c['text']}\n\n")
              with (WORK / "vietnamese.vtt").open("w", encoding="utf-8") as f:
                  f.write("WEBVTT\n\n")
                  for c in out:
                      f.write(f"{ts(c['start'], '.')} --> {ts(c['end'], '.')}\n{c['text']}\n\n")
              log(f"[FINALIZE] OK: {len(out)} cue sach -> work/vietnamese.srt / work/vietnamese.vtt")
          if __name__ == "__main__":
              main()
          PY

      - name: Finalize Vietnamese subtitles (clean + dedupe + validate)
        run: |
          set -euo pipefail
          python3 finalize_vi.py

