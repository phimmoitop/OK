                              cv2.rectangle(image, (int(d["x1"]), int(d["y1"])),
                                            (int(d["x2"]), int(d["y2"])), (0, 255, 0), 2)
                      bl = next((b for b in blur_segs if b["t_start"] <= a["t_mid"] < b["t_end"]), blur_segs[0])["blur"]
                      cv2.rectangle(image, (bl["x"], bl["y"]),
                                    (bl["x"] + bl["width"], bl["y"] + bl["height"]), (0, 0, 255), 3)
                      cv2.rectangle(image, (x0, segs[seg_i]["ty0"]), (x1, segs[seg_i]["ty1"]), (0, 255, 255), 2)
                      cv2.imwrite("work/subtitle-geometry-preview.jpg", image)
              except Exception as e:
                  log(f"[PREVIEW] bo qua: {e!r}")
              needs_review = bool(review_rows) or not valid_geometry or not cues
              write_gh_output(needs_review)
              print(f"duration={duration:.3f}s size={width}x{height} "
                    f"windows={n_win} anchors={len(real)} segments={len(segs)} blur_segments={len(blur_segs)} "
                    f"ocr_detections={len(detections)} subtitle_cues={len(cues)} "
                    f"review_cues={len(review_rows)} geometry_valid={valid_geometry}")
              if not cues:
                  print("OCR produced no stable subtitle cues.")
          if __name__ == "__main__":
              main()
          PY

