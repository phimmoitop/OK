name: "NEW [3/3] SUB → HLS"

on:
  workflow_dispatch:
    inputs:
      link:
        description: "AUDIOID-SUB-SUBID"
        required: true
        type: string
      slug:
        description: "slug"
        required: true
        type: string
      token:
        description: "token"
        required: true
        type: string
      page:
        description: "page"
        required: true
        type: string
      account:
        description: "account"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      # Muốn render nhanh hơn: đổi X264_PRESET thành veryfast / faster (file to hơn một chút)
      X264_PRESET: "fast"
      X264_CRF: "23"
      SLUG: ${{ inputs.slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ============================================================
      # TÁCH LINK "AUDIOID-SUB-SUBID" -> AUDIO_ID (zip bước 2) + SUB_ID (zip bước 1)
      # RAW_ID sẽ lấy từ raw.txt nằm trong SUB zip
      # ============================================================
      - name: Validate inputs and split link
        env:
          LINK: ${{ inputs.link }}
        run: |
          set -euo pipefail
          [[ "$SLUG" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo '::error::slug chỉ được chứa A-Z a-z 0-9 _ -'; exit 1; }
          LINK="$(echo -n "$LINK" | tr -d '[:space:]')"
          [[ "$LINK" == *-SUB-* ]] || { echo '::error::link phải có dạng AUDIOID-SUB-SUBID (vd: sT1sbAuW-SUB-htUT5prY)'; exit 1; }
          AUDIO_ID="${LINK%%-SUB-*}"
          SUB_ID="${LINK#*-SUB-}"
          [[ "$AUDIO_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::AUDIO ID không hợp lệ'; exit 1; }
          [[ "$SUB_ID" =~ ^[A-Za-z0-9_-]+$ ]]   || { echo '::error::SUB ID không hợp lệ'; exit 1; }
          echo "AUDIO_ID=$AUDIO_ID" >> "$GITHUB_ENV"
          echo "SUB_ID=$SUB_ID" >> "$GITHUB_ENV"
          echo "AUDIO ({slug}-AUDIO.zip: c_*.mp3)                         = $AUDIO_ID"
          echo "SUB   ({slug}-SUB.zip: sub + geometry + static + raw.txt) = $SUB_ID"
          echo "RAW   ({slug}-RAW.mp4) = lấy ID từ raw.txt trong SUB zip"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-noto-core fontconfig unzip
          # Cài font Oswald từ file zip có sẵn trong repo (bỏ variable font, chỉ dùng static)
          sudo mkdir -p /usr/local/share/fonts/oswald
          sudo unzip -o -j Oswald.zip '*.ttf' -x '*VariableFont*' -d /usr/local/share/fonts/oswald
          sudo fc-cache -f
          fc-list | grep -i oswald || { echo '::error::Không cài được font Oswald'; exit 1; }

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-render-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pip-render-${{ runner.os }}-

      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install \
            opencv-python-headless \
            pysubs2 \
            webvtt-py \
            av \
            numpy \
            requests
          python3 <<'PY'
          import cv2, pysubs2, webvtt, av, numpy, requests
          print("ALL IMPORTS OK")
          PY

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work output dl

      # ============================================================
      # HÀM TẢI PIXELDRAIN DÙNG CHUNG
      #   - resume (-C -), kiểm tra sha256 nếu Pixeldrain có, không thì unzip -t / ffprobe
      #   - nếu có secret PIXELDRAIN_API_KEY thì dùng (đỡ bị giới hạn tải), không có thì tải ẩn danh
      # ============================================================
      - name: Create Pixeldrain download helper
        run: |
          cat > pd_get.sh <<'SH'
          # usage: pd_get <pixeldrain_id> <out_file> <zip|video>
          pd_get() {
            local ID="$1" OUT="$2" KIND="$3"
            local AUTH=()
            [ -n "${PD_KEY:-}" ] && AUTH=(-u ":$PD_KEY")
            local info want size avail
            info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${AUTH[@]}" "https://pixeldrain.com/api/file/${ID}/info" || true)
            [ -n "$info" ] || { echo "::error::Không lấy được thông tin file '$ID' (sai ID / file đã bị xóa?)"; return 1; }
            want=$(jq -r '.hash_sha256 // empty' <<<"$info" 2>/dev/null || true)
            size=$(jq -r '.size // 0' <<<"$info" 2>/dev/null || echo 0)
            avail=$(jq -r '.availability // empty' <<<"$info" 2>/dev/null || true)
            echo "[GET] id=$ID name=$(jq -r '.name' <<<"$info") size=$((size / 1024)) KB sha256=${want:-?}"
            [ -z "$avail" ] || echo "::warning::Pixeldrain báo file bị hạn chế: $avail"
            _ok() {
              [ -s "$OUT" ] || return 1
              if [ -n "$want" ]; then
                [ "$(sha256sum "$OUT" | cut -d' ' -f1)" = "$want" ]
              elif [ "$KIND" = "zip" ]; then
                unzip -tq "$OUT" >/dev/null 2>&1
              else
                local d; d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT" 2>/dev/null || true)
                [ -n "$d" ] && [ "$d" != "N/A" ]
              fi
            }
            local ok=0 attempt
            for attempt in $(seq 1 10); do
              if _ok; then ok=1; break; fi
              if [ -f "$OUT" ] && [ "$size" -gt 0 ] && [ "$(stat -c %s "$OUT")" -ge "$size" ]; then
                echo "::warning::$OUT đủ dung lượng nhưng sai, tải lại từ đầu."
                rm -f "$OUT"
              fi
              echo "[GET $OUT] attempt $attempt/10"
              curl -fL --retry 5 --retry-delay 5 --retry-all-errors -C - "${AUTH[@]}" \
                "https://pixeldrain.com/api/file/${ID}?download" -o "$OUT" \
                || echo "::warning::curl lỗi lần $attempt, thử tiếp (resume)."
              sleep 3
            done
            if [ "$ok" -ne 1 ] && _ok; then ok=1; fi
            [ "$ok" -eq 1 ] || { echo "::error::Không tải được file '$ID' hợp lệ sau 10 lần thử."; return 1; }
            echo "[OK] $OUT hợp lệ"
          }
          SH

      # ============================================================
      # TẢI SUB.zip (bước 1) + AUDIO.zip (bước 2)
      # ============================================================
      - name: Download SUB zip + AUDIO zip and extract
        timeout-minutes: 60
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          source pd_get.sh

          # ---- (1) {slug}-SUB.zip: sub + geometry + static + raw.txt ----
          pd_get "$SUB_ID" sub.zip zip
          unzip -o -q sub.zip -d dl_sub
          for f in vietnamese.srt vietnamese.vtt subtitle_geometry.json static_regions.json raw.txt; do
            [ -s "dl_sub/$f" ] || { echo "::error::Trong SUB zip thiếu file '$f' (có chắc ID sau -SUB- là {slug}-SUB.zip của bước 1?)"; exit 1; }
          done
          RAW_ID="$(tr -d '[:space:]' < dl_sub/raw.txt)"
          [[ "$RAW_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::raw.txt không chứa ID hợp lệ: '$RAW_ID'"; exit 1; }
          echo "RAW_ID=$RAW_ID" >> "$GITHUB_ENV"
          echo "RAW ID (từ raw.txt) = $RAW_ID"
          mv dl_sub/vietnamese.srt dl_sub/vietnamese.vtt \
             dl_sub/subtitle_geometry.json dl_sub/static_regions.json work/

          # ---- (2) {slug}-AUDIO.zip: chunks c_*.mp3 (chỉ số = thứ tự cue trong vtt) ----
          pd_get "$AUDIO_ID" audio.zip zip
          mkdir -p chunks
          unzip -o -q audio.zip -d chunks
          N=$(ls chunks/c_*.mp3 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo "::error::AUDIO zip không có file c_*.mp3 nào (có chắc ID trước -SUB- là {slug}-AUDIO.zip của bước 2?)"; exit 1; }
          echo "AUDIO: $N file mp3"

          rm -rf dl_sub sub.zip audio.zip
          ls -lh work/

      - name: Download RAW video from Pixeldrain (ID lấy từ raw.txt)
        timeout-minutes: 90
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          source pd_get.sh
          pd_get "$RAW_ID" raw_video.mp4 video
          ls -lh raw_video.mp4

      - name: Validate downloaded media (video / geometry / vtt khớp nhau)
        run: |
          set -euo pipefail
          V=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4)
          WH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 raw_video.mp4)
          echo "video=${V}s ${WH}"
          python3 - "$V" "$WH" <<'PY'
          import json, sys, glob, re, webvtt
          v = float(sys.argv[1])
          w, h = (int(x) for x in sys.argv[2].split("x"))
          if v <= 0:
              print("::error::Duration không hợp lệ"); sys.exit(1)
          g = json.load(open("work/subtitle_geometry.json", encoding="utf-8"))
          if not g.get("valid") or not g.get("segments"):
              print("::error::subtitle_geometry.json không hợp lệ (OCR bước 1 chưa tìm được điểm neo)."); sys.exit(1)
          if (int(g["video_width"]), int(g["video_height"])) != (w, h):
              print(f"::error::Kích thước video RAW {w}x{h} khác geometry {g['video_width']}x{g['video_height']} -> sai cặp SUB/RAW."); sys.exit(1)
          if abs(float(g["duration_seconds"]) - v) > 2:
              print(f"::error::Duration geometry {g['duration_seconds']}s khác video {v:.1f}s -> sai cặp SUB/RAW."); sys.exit(1)
          n_cues = len(webvtt.read("work/vietnamese.vtt"))
          idx = [int(re.search(r"c_(\d+)\.mp3", p).group(1)) for p in glob.glob("chunks/c_*.mp3")]
          if idx and max(idx) >= n_cues:
              print(f"::error::AUDIO zip có chỉ số mp3 tới {max(idx)} nhưng vtt chỉ có {n_cues} cue -> sai cặp AUDIO/SUB."); sys.exit(1)
          print(f"OK: geometry {len(g['segments'])} đoạn blur | vtt {n_cues} cue | mp3 {len(idx)} file")
          PY

      # ============================================================
      # MIX AUDIO: ghép TTS (chunks/c_*.mp3) theo vtt -> tts_track.wav + duck_env.wav + final_mix.txt
      # ============================================================
      - name: Build TTS track (numpy, one pass) & final mix filter
        run: |
          set -euo pipefail
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          AUDIO_RATE=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          if [ -z "$AUDIO_RATE" ]; then AUDIO_RATE=44100; fi
          echo "audio_rate=$AUDIO_RATE" >> $GITHUB_ENV
          export VIDEO_DURATION=$VIDEO_DURATION
          export AUDIO_RATE=$AUDIO_RATE
          python3 <<'EOF'
          import os, wave, subprocess
          import numpy as np
          import av
          import webvtt
          # ---- Âm lượng / chất giọng TTS ----
          TARGET_RMS = 0.28
          TTS_BASS_DB = 4
          TTS_COMP_MAKEUP = 2.0
          TTS_VOLUME = 1.0
          # ---- Mix / tốc độ ----
          BG_RATIO = 0.2             # tiếng gốc khi CÓ thoại (muốn nhỏ hơn: 0.1, to hơn: 0.4)
          BG_OUT = 0.8               # tiếng gốc khi KHÔNG có thoại
          BG_IN = BG_RATIO
          BG_GAIN_MAX = 4.0
          DELAY_MS = 300
          GAP_MS = 60
          MAX_DRIFT_MS = 1500
          LOOKAHEAD_MS = 400
          MAX_SPEEDUP = 1.5
          DUCK_PRE_MS = 500
          DUCK_POST_MS = 400
          SIL_THRESH = 10 ** (-50 / 20)
          rate = int(os.environ["AUDIO_RATE"])
          duration = float(os.environ["VIDEO_DURATION"])
          def to_ms(s):
              h, m, sec = s.replace(',', '.').split(':')
              return int(float(h) * 3600000 + float(m) * 60000 + float(sec) * 1000)
          def as_list(x):
              if x is None: return []
              return x if isinstance(x, list) else [x]
          def decode_mono(path):
              c = av.open(path)
              rs = av.AudioResampler(format="flt", layout="mono", rate=rate)
              parts = []
              for frame in c.decode(audio=0):
                  for f in as_list(rs.resample(frame)):
                      parts.append(f.to_ndarray().reshape(-1))
              for f in as_list(rs.resample(None)):
                  parts.append(f.to_ndarray().reshape(-1))
              c.close()
              return np.concatenate(parts).astype(np.float32) if parts else np.zeros(0, np.float32)
          def atempo(x, speed):
              try:
                  p = subprocess.run(
                      ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "f32le", "-ar", str(rate), "-ac", "1",
                       "-i", "pipe:0", "-af", f"atempo={speed:.4f}", "-f", "f32le", "pipe:1"],
                      input=x.astype("<f4").tobytes(), stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True)
                  out = np.frombuffer(p.stdout, dtype="<f4").copy()
                  return out if out.size else x
              except Exception:
                  return x
          def measure_bg_rms():
              """Đo RMS phần có tiếng của audio gốc."""
              try:
                  p = subprocess.run(
                      ["ffmpeg", "-hide_banner", "-loglevel", "error", "-i", "raw_video.mp4",
                       "-vn", "-map", "0:a:0", "-f", "f32le", "-ar", "8000", "-ac", "1", "pipe:1"],
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  x = np.frombuffer(p.stdout, dtype="<f4")
                  v = x[np.abs(x) > 0.02]
                  return float(np.sqrt(np.mean(v ** 2))) if v.size > 1000 else 0.0
              except Exception:
                  return 0.0

          bg_rms = measure_bg_rms()
          BG_GAIN = float(np.clip(TARGET_RMS / bg_rms, 0.5, BG_GAIN_MAX)) if bg_rms > 1e-4 else 1.0
          print(f"Original audio RMS={bg_rms:.3f} -> BG_GAIN={BG_GAIN:.2f}x "
                f"(co thoai: {BG_RATIO * 100:.0f}% TTS, khong thoai: {BG_OUT * 100:.0f}%)")
          total = int((duration + 10) * rate)
          buf = np.zeros(total, dtype=np.float32)
          vtt = webvtt.read("work/vietnamese.vtt")
          n_cues = len(vtt)
          starts = [max(0, int((to_ms(c.start) + DELAY_MS) * rate / 1000)) for c in vtt]
          gap = int(GAP_MS * rate / 1000)
          max_drift = int(MAX_DRIFT_MS * rate / 1000)
          lookahead = int(LOOKAHEAD_MS * rate / 1000)
          # ---------- Pass 1: đọc, cắt lặng, chuẩn hóa RMS ----------
          clips = [None] * n_cues
          skipped = 0
          for i in range(n_cues):
              path = f"chunks/c_{i}.mp3"
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  skipped += 1
                  continue
              try:
                  x = decode_mono(path)
              except Exception as e:
                  print(f"Decode lỗi đoạn {i}: {e}")
                  skipped += 1
                  continue
              loud = np.nonzero(np.abs(x) > SIL_THRESH)[0]
              if loud.size == 0:
                  skipped += 1
                  continue
              x = x[loud[0]:loud[-1] + 1]
              voiced = x[np.abs(x) > 0.02]
              if voiced.size:
                  rms = float(np.sqrt(np.mean(voiced ** 2)))
                  if rms > 1e-4:
                      x = x * min(8.0, TARGET_RMS / rms)
              clips[i] = x
          # ---------- Pass 2: tốc độ mục tiêu mỗi câu, làm mượt để tăng đều ----------
          need = np.ones(n_cues)
          for i, x in enumerate(clips):
              if x is None: continue
              nxt = starts[i + 1] if i + 1 < n_cues else total
              avail = max(1, nxt - starts[i] - gap)
              need[i] = len(x) / avail
          target = np.clip(need, 1.0, MAX_SPEEDUP)
          smooth = target.copy()
          for i in range(n_cues):
              l = target[i - 1] if i > 0 else target[i]
              r = target[i + 1] if i + 1 < n_cues else target[i]
              smooth[i] = max(target[i], 0.5 * target[i] + 0.25 * (l + r))
          # ---------- Pass 3: đặt tuần tự ----------
          cursor = 0
          placed = sped = overlapped = 0
          max_shift = 0
          spans_ms = []
          for i, c in enumerate(vtt):
              spans_ms.append((to_ms(c.start) - DUCK_PRE_MS, to_ms(c.end) + DUCK_POST_MS))
              x = clips[i]
              if x is None:
                  continue
              pos = max(starts[i], cursor + gap)
              pos = min(pos, starts[i] + max_drift)
              nxt = starts[i + 1] if i + 1 < n_cues else total
              avail = nxt + lookahead - pos
              sp = float(smooth[i])
              if avail > 0:
                  sp = max(sp, min(MAX_SPEEDUP, len(x) / avail))
              if sp > 1.03:
                  x = atempo(x, sp)
                  sped += 1
              if pos < cursor:
                  overlapped += 1
              if pos >= total:
                  continue
              n = min(len(x), total - pos)
              buf[pos:pos + n] += x[:n]
              cursor = pos + n
              max_shift = max(max_shift, pos - starts[i])
              spans_ms.append((pos * 1000.0 / rate - 150, (pos + n) * 1000.0 / rate + 250))
              placed += 1
          print(f"TTS placed={placed} skipped={skipped} sped_up={sped} overlapped={overlapped} "
                f"max_shift={max_shift / rate:.2f}s")
          # ---------- Ghi tts_track.wav (soft limiter) ----------
          BLOCK = 1 << 22
          with wave.open("work/tts_track.wav", "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)
              for s in range(0, total, BLOCK):
                  x = buf[s:s + BLOCK].copy()
                  a = np.abs(x)
                  m = a > 0.85
                  if m.any():
                      x[m] = np.sign(x[m]) * (0.85 + 0.15 * np.tanh((a[m] - 0.85) / 0.15))
                  wf.writeframes((np.clip(x, -1.0, 1.0) * 32767).astype("<i2").tobytes())
          # ---------- Đường cong hạ tiếng gốc (ducking) theo cue ----------
          ENV_HZ = 1000
          env = np.full(int((duration + 10) * ENV_HZ), BG_OUT, dtype=np.float32)
          for a, b in spans_ms:
              a = max(0, int(a * ENV_HZ / 1000)); b = min(len(env), int(b * ENV_HZ / 1000))
              if b > a:
                  env[a:b] = BG_IN
          k = int(0.12 * ENV_HZ)
          env = np.convolve(env, np.ones(k, np.float32) / k, mode="same")
          idx = np.arange(len(env), dtype=np.float64)
          with wave.open("work/duck_env.wav", "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)
              for s in range(0, total, BLOCK):
                  e = min(total, s + BLOCK)
                  t = np.arange(s, e, dtype=np.float64) * 1000.0 / rate * (ENV_HZ / 1000.0)
                  g = np.interp(t, idx, env)
                  wf.writeframes((np.clip(g, 0, 1) * 32767).astype("<i2").tobytes())
          # ---------- Filter mix: input 0 = video gốc, 1 = tts_track, 2 = duck_env ----------
          fmt = "aformat=sample_fmts=fltp:channel_layouts=stereo"
          tts_fx = ""
          if TTS_BASS_DB:
              tts_fx += f",bass=g={TTS_BASS_DB}:f=200"
          tts_fx += f",acompressor=threshold=0.1:ratio=3:attack=10:release=120:makeup={TTS_COMP_MAKEUP}"
          if abs(TTS_VOLUME - 1.0) > 0.01:
              tts_fx += f",volume={TTS_VOLUME}"
          with open("final_mix.txt", "w") as f:
              f.write(f"[0:a]aresample={rate}:async=1,{fmt},volume={BG_GAIN:.3f},asetpts=PTS-STARTPTS[bg0];")
              f.write(f"[2:a]aresample={rate},{fmt},asetpts=PTS-STARTPTS[env];")
              f.write("[bg0][env]amultiply[bg];")
              f.write(f"[1:a]aresample={rate},{fmt},asetpts=PTS-STARTPTS{tts_fx}[tts];")
              f.write("[bg][tts]amix=inputs=2:normalize=0:duration=first,alimiter=limit=0.95:level=0[out_audio]")
          EOF
          ls -lh work/tts_track.wav work/duck_env.wav
          cat final_mix.txt; echo

      # ============================================================
      # MIX AUDIO SẴN (tiếng gốc + TTS + ducking) -> work/mixed_audio.m4a
      # ============================================================
      - name: Mix final audio (original + TTS + ducking) -> mixed_audio.m4a
        run: |
          set -euo pipefail
          RATE="${audio_rate:-44100}"
          ffmpeg -y -hide_banner -loglevel error \
            -i raw_video.mp4 -i work/tts_track.wav -i work/duck_env.wav \
            -filter_complex_script final_mix.txt \
            -map "[out_audio]" \
            -c:a aac -ar "$RATE" -b:a 128k -movflags +faststart \
            work/mixed_audio.m4a
          ls -lh work/mixed_audio.m4a
          V=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4)
          A=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/mixed_audio.m4a)
          echo "video=${V}s | mixed_audio=${A}s"
          python3 - "$V" "$A" <<'PY'
          import sys
          v, a = float(sys.argv[1]), float(sys.argv[2])
          if abs(v - a) > 5:
              print(f"::warning::Audio mix lệch {abs(v - a):.1f}s so với video, kiểm tra lại.")
          PY

      # ============================================================
      # RENDER: blur sub gốc + đặt sub Việt THEO TỪNG ĐOẠN ĐIỂM NEO (subtitle_geometry.json)
      #   - Mỗi đoạn trong geometry có vùng blur riêng bám theo vị trí sub cục bộ (center_y, blur{})
      #   - Các đoạn có vùng blur gần giống nhau gộp thành 1 "level" (1 nhánh crop+gblur),
      #     bật/tắt bằng enable=between(t,..) -> ít nhánh, render nhanh
      #   - Sub Việt đặt đúng center_y của đoạn chứa dòng sub đó
      #   - Che watermark 2 góc trên theo static_regions.json
      #   - Ghép audio mix sẵn (mixed_audio.m4a, vừa tạo ở bước trên)
      # ============================================================
      - name: Render Vietnamese video and HLS with per-anchor subtitle blur
        env:
          MAX_LEVELS: "8"      # tối đa số nhánh blur (càng ít càng render nhanh, nhưng vùng blur bị gộp rộng hơn)
          SEG_PAD: "1.0"       # mỗi đoạn blur rộng thêm +-N giây quanh ranh giới đổi vị trí
          ENHANCE: "light"     # off | light | normal | strong  (màu rực hơn + nét hơn)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, math, os, re
          from bisect import bisect_right
          from pathlib import Path
          import cv2
          import numpy as np
          import pysubs2
          geo = json.loads(Path("work/subtitle_geometry.json").read_text(encoding="utf-8"))
          segs = sorted(geo.get("segments") or [], key=lambda s: s["t_start"])
          if not geo.get("valid") or not segs:
              raise SystemExit("Subtitle geometry was not validated; refusing to render.")
          width, height = int(geo["video_width"]), int(geo["video_height"])
          duration = float(geo["duration_seconds"])
          sub_h = int(geo["subtitle_height"])
          center_x = width // 2
          PAD = float(os.environ.get("SEG_PAD", "1.0"))
          MAX_LEVELS = max(1, int(os.environ.get("MAX_LEVELS", "8")))
          seg_starts = [s["t_start"] for s in segs]
          def seg_at(sec):
              i = bisect_right(seg_starts, sec) - 1
              return segs[max(0, min(i, len(segs) - 1))]
          # ------------------------------------------------------------
          # Gom các đoạn có vùng blur gần giống nhau thành "level"
          # ------------------------------------------------------------
          def union(a, b):
              return [min(a[0], b[0]), min(a[1], b[1]), max(a[2], b[2]), max(a[3], b[3])]
          def close(a, b):
              h = max(a[3] - a[1], b[3] - b[1])
              tol = max(6, int(.25 * h))
              return abs(a[1] - b[1]) <= tol and abs(a[3] - b[3]) <= tol
          levels = []
          for si, s in enumerate(segs):
              b = s["blur"]
              rect = [int(b["x"]), int(b["y"]), int(b["x"] + b["width"]), int(b["y"] + b["height"])]
              th = float(s.get("height") or sub_h)
              a_t = 0.0 if si == 0 else max(0.0, s["t_start"] - PAD)
              e_t = duration + 10.0 if si == len(segs) - 1 else s["t_end"] + PAD
              for lv in levels:
                  if close(lv["rect"], rect):
                      lv["rect"] = union(lv["rect"], rect)
                      lv["iv"].append((a_t, e_t))
                      lv["th"] = max(lv["th"], th)
                      break
              else:
                  levels.append({"rect": rect, "iv": [(a_t, e_t)], "th": th})
          while len(levels) > MAX_LEVELS:
              best = None
              for i in range(len(levels)):
                  for j in range(i + 1, len(levels)):
                      ci = (levels[i]["rect"][1] + levels[i]["rect"][3]) / 2.0
                      cj = (levels[j]["rect"][1] + levels[j]["rect"][3]) / 2.0
                      d = abs(ci - cj)
                      if best is None or d < best[0]:
                          best = (d, i, j)
              _, i, j = best
              levels[i]["rect"] = union(levels[i]["rect"], levels[j]["rect"])
              levels[i]["iv"] += levels[j]["iv"]
              levels[i]["th"] = max(levels[i]["th"], levels[j]["th"])
              del levels[j]
          def merge_iv(iv):
              iv = sorted(iv)
              out = [list(iv[0])]
              for a, b in iv[1:]:
                  if a <= out[-1][1] + 0.01:
                      out[-1][1] = max(out[-1][1], b)
                  else:
                      out.append([a, b])
              return [(a, b) for a, b in out]
          clean_levels = []
          for lv in levels:
              x1, y1, x2, y2 = lv["rect"]
              x1, y1 = max(0, x1) // 2 * 2, max(0, y1) // 2 * 2
              x2, y2 = min(width, x2), min(height, y2)
              w, h = (x2 - x1) // 2 * 2, (y2 - y1) // 2 * 2
              if w < 16 or h < 8:
                  continue
              clean_levels.append({"x": x1, "y": y1, "w": w, "h": h, "th": lv["th"],
                                   "iv": merge_iv(lv["iv"])})
          levels = clean_levels
          if not levels:
              raise SystemExit("No valid blur level; refusing to render.")
          def feather_mask(w, h, fx, fy, path, sides=(1, 1, 1, 1)):
              """Mat na alpha feather. sides = (trai, phai, tren, duoi); 0 = canh do KHONG feather
              (dung cho canh sat mep video de dai sat mep van duoc lam mo 100%)."""
              fx, fy = float(max(1, fx)), float(max(1, fy))
              xs = np.arange(w, dtype=np.float32)[None, :]
              ys = np.arange(h, dtype=np.float32)[:, None]
              big = np.float32(1e6)
              l = xs / fx if sides[0] else big
              r = (w - 1 - xs) / fx if sides[1] else big
              t = ys / fy if sides[2] else big
              b = (h - 1 - ys) / fy if sides[3] else big
              alpha = np.clip(np.minimum(np.minimum(l, r), np.minimum(t, b)), 0.0, 1.0)
              alpha = np.broadcast_to(alpha, (h, w))
              cv2.imwrite(str(path), (alpha * 255).astype(np.uint8))
          for old in Path("work").glob("blur_mask_*.png"):
              old.unlink()
          for k, lv in enumerate(levels):
              fx = max(8, int(round(lv["h"] * .27)))
              fy = max(3, int(round(lv["h"] * .09)))
              feather_mask(lv["w"], lv["h"], fx, fy, f"work/blur_mask_{k}.png")
          def enable_expr(iv):
              if len(iv) == 1 and iv[0][0] <= 0.01 and iv[0][1] >= duration:
                  return ""
              return ":enable='" + "+".join(f"between(t,{a:.2f},{b:.2f})" for a, b in iv) + "'"
          # ------------------------------------------------------------
          # Phụ đề Việt (ASS): đặt theo center_y của đoạn điểm neo chứa dòng sub
          # ------------------------------------------------------------
          vi = pysubs2.load("work/vietnamese.srt", encoding="utf-8")
          max_chars = max((len(re.sub(r"\s+", "", ev.text)) for ev in vi.events), default=20)
          FONT_SCALE = 1.5
          font_size = max(80, int(sub_h * .95 * FONT_SCALE))
          font_size = min(font_size, max(80, int(width * .100 / max(1, max_chars * .50))))
          ass = [
              "[Script Info]", "Title: Vietnamese hard subtitles",
              "ScriptType: v4.00+", f"PlayResX: {width}", f"PlayResY: {height}",
              "WrapStyle: 2", "ScaledBorderAndShadow: yes", "",
              "[V4+ Styles]",
              "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding",
              f"Style: Default,Oswald,{font_size},&H00FFFFFF,&H000000FF,&H00000000,&H64000000,0,0,0,0,100,100,0,0,1,2,1,5,40,40,0,1",
              "", "[Events]", "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
          ]
          def ass_time(ms):
              total = max(0, int(ms))
              h, total = divmod(total, 3600000)
              m, total = divmod(total, 60000)
              sec, total = divmod(total, 1000)
              return f"{h}:{m:02}:{sec:02}.{total // 10:02}"
          pos_log = []
          for ev in vi.events:
              text = ev.text.replace("\n", "\\N")
              text = text.replace("{", "\\{").replace("}", "\\}")
              mid = (ev.start + ev.end) / 2000.0
              cy = int(seg_at(mid)["center_y"])
              pos_log.append((ev.start / 1000.0, cy))
              ass.append(
                  f"Dialogue: 0,{ass_time(ev.start)},{ass_time(ev.end)},Default,,0,0,0,,"
                  f"{{\\an5\\pos({center_x},{cy})}}{text}"
              )
          Path("work/vietnamese-overlay.ass").write_text("\n".join(ass) + "\n", encoding="utf-8")
          # ---- Vùng che cố định (watermark 2 góc trên) từ bước static_detect ----
          regions = []
          sp = Path("work/static_regions.json")
          if sp.exists():
              try:
                  regions = json.loads(sp.read_text(encoding="utf-8")).get("regions", [])
              except Exception:
                  regions = []
          clean = []
          for r in regions:
              x, y, w, h = int(r["x"]), int(r["y"]), int(r["w"]), int(r["h"])
              x -= x % 2; y -= y % 2
              w = min(w, width - x) // 2 * 2
              h = min(h, height - y) // 2 * 2
              if w >= 16 and h >= 12:
                  clean.append((x, y, w, h, r.get("feather", [1, 1, 1, 1])))
          regions = clean
          for old in Path("work").glob("static_mask_*.png"):
              old.unlink()
          for k, (x, y, w, h, fs) in enumerate(regions):
              fx = max(4, int(round(min(w, h) * .18)))
              feather_mask(w, h, fx, fx, f"work/static_mask_{k}.png", sides=fs)
          # Input: 0 = raw_video.mp4, 1 = work/mixed_audio.m4a,
          #        2..(1+L) = work/blur_mask_k.png (lặp, mỗi level 1 mask),
          #        (2+L).. = work/static_mask_k.png (lặp)
          L = len(levels)
          n_split = 1 + L + len(regions)
          graph = ["[0:v]split=%d[vbase]" % n_split
                   + "".join(f"[lv{k}]" for k in range(L))
                   + "".join(f"[sp{k}]" for k in range(len(regions))) + ";"]
          cur = "vbase"
          for k, (x, y, w, h, fs) in enumerate(regions):
              sg = max(10, min(60, int(round(h * .60))))
              graph.append(
                  f"[sp{k}]crop={w}:{h}:{x}:{y},gblur=sigma={sg},format=rgb24[sb{k}];"
                  f"[{2 + L + k}:v]format=gray[sm{k}];"
                  f"[sb{k}][sm{k}]alphamerge[sq{k}];"
                  f"[{cur}][sq{k}]overlay=x={x}:y={y}:shortest=1[sv{k}];"
              )
              cur = f"sv{k}"
          for k, lv in enumerate(levels):
              sigma = max(24, int(round(lv["th"] * .80)))   # độ mờ theo chiều cao chữ của chính level đó
              graph.append(
                  f"[lv{k}]crop={lv['w']}:{lv['h']}:{lv['x']}:{lv['y']},"
                  f"scale=iw/4:ih/4,gblur=sigma={max(6, sigma // 4)},"
                  f"scale={lv['w']}:{lv['h']}:flags=bilinear,format=rgb24[lb{k}];"
                  f"[{2 + k}:v]format=gray[lm{k}];"
                  f"[lb{k}][lm{k}]alphamerge[lq{k}];"
                  f"[{cur}][lq{k}]overlay=x={lv['x']}:y={lv['y']}:shortest=1{enable_expr(lv['iv'])}[lo{k}];"
              )
              cur = f"lo{k}"
          # ---- Làm đẹp video (màu rực hơn + nét hơn), đặt TRƯỚC subtitles để chữ không bị ảnh hưởng ----
          ENH = {
              "off":    "",
              "light":  "eq=contrast=1.04:gamma=1.03:saturation=1.10,cas=strength=0.35:planes=1",
              "normal": "eq=contrast=1.06:gamma=1.04:saturation=1.15,cas=strength=0.50:planes=1",
              "strong": "eq=contrast=1.08:gamma=1.06:saturation=1.22,cas=strength=0.70:planes=1",
          }
          enh_mode = os.environ.get("ENHANCE", "light").strip().lower()
          enh_chain = ENH.get(enh_mode, ENH["light"])
          print(f"ENHANCE={enh_mode} -> {enh_chain or '(không áp dụng)'}")
          if enh_chain:
              graph.append(f"[{cur}]{enh_chain}[ve];")
              cur = "ve"
          graph.append(f"[{cur}]subtitles=work/vietnamese-overlay.ass[v]")
          Path("work/render-filter.txt").write_text("".join(graph) + "\n", encoding="utf-8")
          print(f"Subtitle segments (anchor): {len(segs)} | blur levels: {L}/{MAX_LEVELS}")
          for i, s in enumerate(segs[:60]):
              b = s["blur"]
              print(f"  seg[{i}] {s['t_start']:.1f}s -> {s['t_end']:.1f}s center_y={s['center_y']} "
                    f"th={s.get('height')} | blur y={b['y']} h={b['height']}")
          for k, lv in enumerate(levels):
              span = ", ".join(f"{a:.0f}-{b:.0f}s" for a, b in lv["iv"][:8])
              print(f"  level[{k}] x={lv['x']} y={lv['y']} w={lv['w']} h={lv['h']} th={lv['th']:.0f} "
                    f"| {len(lv['iv'])} khoảng: {span}")
          ys = sorted({cy for _, cy in pos_log})
          print(f"Sub Việt: {len(vi.events)} dòng, font={font_size}px, {len(ys)} vị trí y khác nhau: {ys[:12]}")
          print(f"Static overlay blur regions: {len(regions)}")
          for k, (x, y, w, h, fs) in enumerate(regions):
              print(f"  [{k}] x={x} y={y} w={w} h={h} feather(l,r,t,b)={fs}")
          PY
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 raw_video.mp4)
          # Thứ tự input mask phải khớp filter graph: blur_mask_0..L-1 trước, rồi static_mask_0..
          EXTRA=()
          for m in $(ls work/blur_mask_*.png 2>/dev/null | sort -V) $(ls work/static_mask_*.png 2>/dev/null | sort -V); do
            EXTRA+=(-loop 1 -framerate 30 -t "$DUR" -i "$m")
          done
          ffmpeg -y -i raw_video.mp4 -i work/mixed_audio.m4a \
            "${EXTRA[@]}" \
            -filter_complex_script work/render-filter.txt \
            -map "[v]" -map 1:a:0 \
            -force_key_frames "expr:gte(t,n_forced*5)" -sc_threshold 0 \
            -c:v libx264 -preset "${X264_PRESET}" -crf "${X264_CRF}" -tune animation -maxrate 3000k -bufsize 5000k -pix_fmt yuv420p \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:a copy \
            -t "$DUR" final.mp4
          mkdir -p output
          ffmpeg -y -i final.mp4 -c copy -f hls \
            -hls_time 5 -hls_list_size 0 -start_number 10001 -hls_playlist_type vod \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "${SLUG}-index.png" \
            -hls_segment_filename "output/${SLUG}-index%d.png" \
            "output/${SLUG}.m3u8"

      - name: Copy subtitle file into output folder
        run: |
          set -eux
          cp work/vietnamese.vtt "output/${SLUG}.vtt"
          ls -lh output/

      - name: Deploy to Cloudflare Pages (first)
        id: deploy1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.account }}
          command: pages deploy ./output --project-name=${{ github.event.inputs.page }} --branch=${{ github.event.inputs.slug }}

      - name: Verify Cloudflare deployment (branch domain check)
        id: verify
        continue-on-error: true
        env:
          PROJECT: ${{ github.event.inputs.page }}
          BRANCH: ${{ github.event.inputs.slug }}
        run: |
          set -e
          FILE_URL="https://${BRANCH}.${PROJECT}.pages.dev/${BRANCH}.m3u8"

          echo "[TARGET] $FILE_URL"

          check () {
            code=$(curl -L -o /dev/null -s -w "%{http_code}" "$FILE_URL")
            echo "HTTP CODE: $code"
            [ "$code" = "200" ]
          }

          # Báo về ViCDN khi deploy thành công (dùng chung cho cả 2 lần check)
          notify () {
            curl -G "https://cp.ssplay.net/bili.php" \
              --data-urlencode "type=ok0" \
              --data-urlencode "key=${PROJECT}" \
              --data-urlencode "slug=${BRANCH}" || true
            curl -L -A "MySecretAgent_ViCDN_cc" "https://vicdn.cc/${BRANCH}?r=1" || true
          }

          echo "[WAIT] Waiting 1 minutes for Pages propagation..."
          sleep 60

          echo "[CHECK #1]"
          if check; then
            echo "[SUCCESS] File exists"
            notify
            exit 0
          fi

          echo "[WAIT] Still not found, wait extra 3 minutes..."
          sleep 180

          echo "[CHECK #2]"
          if check; then
            echo "[SUCCESS] File exists after delay"
            notify
            exit 0
          fi

          echo "[FAIL] File still missing → mark for redeploy"
          echo "NEED_REDEPLOY=true" >> $GITHUB_ENV
          exit 1

      - name: Deploy to Cloudflare Pages (retry – reuse encoded files)
        if: env.NEED_REDEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.account }}
          command: pages deploy ./output --project-name=${{ github.event.inputs.page }} --branch=${{ github.event.inputs.slug }}
