              xs = np.arange(W_SMALL)[None, :]
              zone = (ys < SCAN_Y * sh) & ((xs < SCAN_X * W_SMALL) | (xs > (1 - SCAN_X) * W_SMALL))
              static = (mag > thr) & zone
              ratio = float(static.sum()) / max(1, int(zone.sum()))
              log(f"[STATIC-OVERLAY] nhieu nen p99={ref_p99:.1f} -> nguong={thr:.1f} | "
                  f"diem tinh trong 2 goc tren: {ratio * 100:.2f}% | max={float(mag[zone].max()):.0f}")
              # anh gradient de kiem tra bang mat
              try:
                  hm = np.clip(mag / (thr * 3.0) * 255.0, 0, 255).astype(np.uint8)
                  cv2.imwrite(str(WORK / "static-gradient-preview.jpg"), cv2.applyColorMap(hm, cv2.COLORMAP_INFERNO))
              except Exception:
                  pass
              if ratio > 0.30:
                  log("[STATIC-OVERLAY] ty le tinh qua cao (canh quay co dinh?) -> bo qua")
                  return []
              k = cv2.getStructuringElement(cv2.MORPH_RECT, (max(15, int(W_SMALL * 0.05)), 9))
              mask = cv2.dilate(static.astype(np.uint8) * 255, np.ones((3, 3), np.uint8), iterations=2)
              closed = cv2.morphologyEx(mask, cv2.MORPH_CLOSE, k)
              nlab, _, stats, _ = cv2.connectedComponentsWithStats(closed, connectivity=8)
              boxes = []
              for i in range(1, nlab):
                  x, y, w, h, _a = stats[i]
                  pix = int(static[y:y + h, x:x + w].sum())
                  if w < 10 or h < 8 or pix < 20:
                      continue
                  if w * h > 0.12 * sh * W_SMALL:
                      continue
                  if h <= 12 and w >= 0.08 * W_SMALL:      # duong ke ngang dai (vien letterbox...) khong phai logo
                      continue
                  if w <= 12 and h >= 0.10 * sh:           # duong doc dai
                      continue
                  boxes.append([x, y, x + w, y + h])
              boxes = merge_boxes(boxes, gap=max(2, int(W_SMALL * 0.01)))
              boxes = expand_corners(boxes, W_SMALL, sh)
              boxes = merge_boxes(boxes, gap=2)
              sub_rects = load_sub_rects()
              inv = 1.0 / scale
              regions = []
              for b in boxes:
                  x1 = max(0, int(b[0] * inv))
                  y1 = max(0, int(b[1] * inv))
                  x2 = min(width, int(math.ceil(b[2] * inv)))
                  y2 = min(height, int(math.ceil(b[3] * inv)))
                  x1 -= x1 % 2
                  y1 -= y1 % 2
                  w = (x2 - x1) // 2 * 2
                  h = (y2 - y1) // 2 * 2
                  if w < 16 or h < 12:
                      continue
                  skip = False
                  for sr in sub_rects:
                      ix = max(0, min(x1 + w, sr[2]) - max(x1, sr[0]))
                      iy = max(0, min(y1 + h, sr[3]) - max(y1, sr[1]))
                      if ix * iy >= 0.6 * w * h:
                          log(f"[STATIC-OVERLAY] bo qua vung ({x1},{y1},{w},{h}): nam trong vung blur sub")
                          skip = True
                          break
                  if skip:
                      continue
                  tol = 6
                  feather = [int(x1 > tol), int(x1 + w < width - tol),
                             int(y1 > tol), int(y1 + h < height - tol)]
                  regions.append({"x": x1, "y": y1, "w": w, "h": h, "feather": feather})
              regions.sort(key=lambda r: r["w"] * r["h"], reverse=True)
              regions = regions[:MAX_REGIONS]
              if sum(r["w"] * r["h"] for r in regions) > 0.30 * width * height:
                  log("[STATIC-OVERLAY] tong dien tich qua lon -> bo qua")
                  return []
              if regions:
                  img = grab_full(duration / 2.0, width, height)
                  if img is not None:
                      for r in regions:
                          cv2.rectangle(img, (r["x"], r["y"]), (r["x"] + r["w"], r["y"] + r["h"]), (255, 0, 255), 3)
                      cv2.imwrite(str(WORK / "static-regions-preview.jpg"), img)
              for r in regions:
                  log(f"[STATIC-OVERLAY] che: x={r['x']} y={r['y']} w={r['w']} h={r['h']} feather={r['feather']}")
              if not regions:
                  log("[STATIC-OVERLAY] khong tim thay lop phu co dinh nao")
              return regions
          def main():
              regions = []
              try:
                  regions = detect()
              except Exception as e:
                  log(f"[STATIC-OVERLAY] loi, bo qua: {type(e).__name__}: {e}")
                  traceback.print_exc()
                  regions = []
              (WORK / "static_regions.json").write_text(
                  json.dumps({"regions": regions}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # OCR + VỊ TRÍ LÀM MỜ -> ${SLUG}-SUBCN.zip -> Pixeldrain -> VPS
      # ============================================================
      - name: Process episode (OCR + blur geometry + static regions)
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          OMP_NUM_THREADS: "1"
          OCR_FAST: "1"
          STATIC_DETECT: "1"
        run: |
          set -euo pipefail
          EP_DIR="work/eps/${SLUG}"
          export VIDEO="${EP_DIR}/raw_video.mp4"
          export WORK_DIR="${EP_DIR}"
          mkdir -p "${EP_DIR}/ocr"
          python3 ocr_run.py
          cp "${EP_DIR}/ocr/hardsub-3fps.srt" "${EP_DIR}/native.srt"
          cp "${EP_DIR}/ocr/ocr-frames-3fps.txt" "${EP_DIR}/native-frames-3fps.txt"
          python3 - <<'PYCODE'
          import json, os, sys
          d=os.environ['WORK_DIR']
          g=json.load(open(os.path.join(d,'subtitle_geometry.json'),encoding='utf-8'))
          if not g.get('valid') or not g.get('segments'):
              sys.exit('::error::Không xác định được vị trí phụ đề để làm mờ.')
          print(f"OCR cues: {sum(1 for _ in open(os.path.join(d,'native.srt'),encoding='utf-8') if '-->' in _)} | geometry segments: {len(g['segments'])}")
          PYCODE
          python3 static_detect.py
          PACK="${EP_DIR}/pack"
          mkdir -p "$PACK"
          cp "${EP_DIR}/native.srt" "$PACK/native.srt"
          cp "${EP_DIR}/native-frames-3fps.txt" "$PACK/native-frames-3fps.txt"
          cp "${EP_DIR}/ocr/ocr-raw-3fps.tsv" "$PACK/ocr-raw-3fps.tsv"
          cp "${EP_DIR}/ocr/ocr-review-needed.tsv" "$PACK/ocr-review-needed.tsv"
          cp "${EP_DIR}/ocr/ocr-discarded.tsv" "$PACK/ocr-discarded.tsv"
          cp "${EP_DIR}/subtitle_geometry.json" "$PACK/subtitle_geometry.json"
          cp "${EP_DIR}/static_regions.json" "$PACK/static_regions.json"
          printf '%s' "$PD_ID" > "$PACK/raw.txt"
          (cd "$PACK" && zip -0 -q -r "${GITHUB_WORKSPACE}/${SLUG}-SUBCN.zip" .)
          unzip -tq "${SLUG}-SUBCN.zip"
          PIXEL_ID=$(bash pd_upload.sh "$GITHUB_WORKSPACE/${SLUG}-SUBCN.zip" "${SLUG}-SUBCN.zip")
          [ -n "$PIXEL_ID" ]
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -G "https://cp.ssplay.net/bili.php" \
            --data-urlencode "type=ocr" --data-urlencode "slug=${SLUG}" --data-urlencode "pixel=${PIXEL_ID}"
          echo
          echo "OCR Pixel ID=$PIXEL_ID | input for step1: ${PD_ID}-SUBCN-${PIXEL_ID}"
