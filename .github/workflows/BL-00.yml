name: "NEW [00/04] RAW → SUBCN (OCR)"

on:
  workflow_dispatch:
    inputs:
      link:
        description: "RAWID-RAW"
        required: true
        type: string
      slug:
        description: "slug video"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      SLUG: ${{ inputs.slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          PD_LINK: ${{ inputs.link }}
        run: |
          set -euo pipefail
          PD_LINK="$(echo -n "$PD_LINK" | tr -d '[:space:]')"
          [[ "$PD_LINK" =~ ^([A-Za-z0-9_-]+)-RAW$ ]] || { echo '::error::link phải có dạng Pixeldrain RAW ID, ví dụ cG27aCed-RAW'; exit 1; }
          PD_ID="${BASH_REMATCH[1]}"
          [[ "$SLUG" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo '::error::slug chỉ được chứa A-Z a-z 0-9 _ -'; exit 1; }
          echo "PD_ID=$PD_ID" >> "$GITHUB_ENV"
          echo "RAW Pixeldrain ID=$PD_ID"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip unzip jq

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-s1-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pip-s1-${{ runner.os }}-

      - name: Install Python packages (OCR)
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install \
            rapidocr==3.10.0 \
            onnxruntime \
            pysubs2 \
            numpy \
            requests
          # Kiểm tra xung đột thư viện: tất cả phải import được cùng nhau
          python3 <<'PY'
          import cv2, pysubs2, numpy, requests
          from rapidocr import EngineType, LangRec, ModelType, OCRVersion, RapidOCR
          # Validate config typing before starting the multiprocessing OCR phase.
          RapidOCR(params={
              "Rec.engine_type": EngineType.ONNXRUNTIME,
              "Rec.lang_type": LangRec.CH,
              "Rec.model_type": ModelType.SMALL,
              "Rec.ocr_version": OCRVersion.PPOCRV6,
              "Rec.rec_img_shape": [3, 48, 2048],
              "Rec.rec_batch_num": 1,
          })
          print("ALL IMPORTS OK")
          PY

      # ============================================================
      # SMOKE TEST: PIXELDRAIN API KEY. Lỗi thì dừng ngay.
      # ============================================================
      - name: Test Pixeldrain API key (smoke test, stop early if it fails)
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          code=$(curl -s -o /tmp/pd_user.json -w "%{http_code}" --retry 3 --retry-all-errors \
            -u ":$PD_KEY" "https://pixeldrain.com/api/user" || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Pixeldrain API key sai / không truy cập được: $(head -c 300 /tmp/pd_user.json 2>/dev/null)"; exit 1; }
          can_upload=$(jq -r '.can_upload // true' /tmp/pd_user.json)
          echo "Pixeldrain user: $(jq -r '.username' /tmp/pd_user.json) | can_upload=$can_upload"
          [ "$can_upload" != "false" ] || { echo '::error::Tài khoản Pixeldrain chưa được phép upload (cần xác minh email)'; exit 1; }

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work work/eps

      # ============================================================
      # TẢI RAW VIDEO ĐÃ CÓ TRÊN PIXELDRAIN
      # ============================================================
      - name: Prepare single-video plan
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          slug = os.environ["SLUG"]
          plan = {"clean_url": "", "split": False,
                  "eps": [{"n": 1, "slug": slug, "start": None, "end": None}]}
          Path("work/plan.json").write_text(json.dumps(plan, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Download RAW video from Pixeldrain
        timeout-minutes: 120
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          URL="https://pixeldrain.com/api/file/${PD_ID}"
          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -u ":$PD_KEY" "${URL}/info")
          REMOTE_SIZE=$(jq -r '.size // empty' <<<"$info")
          [ -n "$REMOTE_SIZE" ] || { echo '::error::Không lấy được kích thước RAW trên Pixeldrain'; exit 1; }
          echo "Pixeldrain RAW: $(jq -r '.name' <<<"$info") | size=$REMOTE_SIZE"
          ok=0
          for attempt in $(seq 1 10); do
            echo "=== download attempt $attempt/10 (resume) ==="
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors -C - -u ":$PD_KEY" \
              -o raw_video.mp4 "${URL}?download" || true
            if [ -s raw_video.mp4 ]; then
              LOCAL=$(stat -c %s raw_video.mp4)
              echo "local=$LOCAL remote=$REMOTE_SIZE"
              if [ "$LOCAL" = "$REMOTE_SIZE" ]; then
                d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4 2>/dev/null || true)
                if [ -n "$d" ] && [ "$d" != "N/A" ]; then ok=1; break; fi
                echo '::warning::ffprobe không đọc được video, tải lại từ đầu.'
                rm -f raw_video.mp4
              elif [ "$LOCAL" -gt "$REMOTE_SIZE" ]; then
                echo '::warning::File local lớn hơn file Pixeldrain, tải lại từ đầu.'
                rm -f raw_video.mp4
              fi
            fi
            [ "$attempt" -lt 10 ] && sleep $(( attempt * 8 > 60 ? 60 : attempt * 8 ))
          done
          [ "$ok" -eq 1 ] || { echo '::error::Tải RAW từ Pixeldrain thất bại'; exit 1; }
          ls -lh raw_video.mp4
          echo "duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4)"

      - name: Create split script
        run: |
          cat > split_video.py <<'PY'
          """
          Doc work/plan.json, cat raw_video.mp4 thanh tung ep (stream copy, can keyframe).
          Khong co ep nao -> chi chuyen file vao work/eps/<slug>/raw_video.mp4.
          Ghi work/eps.json: [ {n, slug, dir, video, start, end, duration} ]
          """
          import json, shutil, subprocess, sys
          from pathlib import Path

          VIDEO = Path("raw_video.mp4")
          WORK = Path("work")
          SHARE_GAP = 2.0       # end ep truoc ~ start ep sau (<= N giay) -> dung chung 1 diem cat
          MIN_EP_SECONDS = 1.0

          def log(msg):
              print(msg, flush=True)

          def fail(msg):
              print(f"::error::{msg}", flush=True)
              sys.exit(1)

          def probe_duration(path):
              out = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=nw=1:nk=1", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True).stdout.strip()
              try:
                  return float(out)
              except ValueError:
                  return None

          def keyframes_near(t):
              """Liet ke thoi diem cac keyframe quanh t (doc packet flags, khong decode -> rat nhanh)."""
              for radius in (30, 120, 600):
                  lo, hi = max(0.0, t - radius), t + radius
                  out = subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                       "-read_intervals", f"{lo:.3f}%{hi:.3f}",
                       "-show_entries", "packet=pts_time,flags", "-of", "csv=p=0", str(VIDEO)],
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True).stdout
                  ks = []
                  for line in out.splitlines():
                      parts = line.strip().split(",")
                      if len(parts) >= 2 and parts[0] not in ("", "N/A") and "K" in parts[1]:
                          try:
                              ks.append(float(parts[0]))
                          except ValueError:
                              pass
                  if ks:
                      return sorted(ks)
              return []

          def main():
              plan = json.loads((WORK / "plan.json").read_text(encoding="utf-8"))
              eps = plan["eps"]
              dur = probe_duration(VIDEO)
              if not dur:
                  fail("Khong doc duoc do dai raw_video.mp4")
              log(f"[SPLIT] video dai {dur:.3f}s | split={plan['split']} | {len(eps)} ep")
              result = []

              if not plan["split"]:
                  ep = eps[0]
                  d = WORK / "eps" / ep["slug"]
                  d.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(VIDEO), str(d / "raw_video.mp4"))
                  result.append({"n": ep["n"], "slug": ep["slug"], "dir": str(d),
                                 "video": str(d / "raw_video.mp4"), "start": 0.0, "end": dur, "duration": dur})
                  (WORK / "eps.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  log("[SPLIT] khong co epN-start/epN-end -> lay toan bo video")
                  return

              def snap(t):
                  if t <= 0.05:
                      return 0.0
                  if t >= dur - 0.05:
                      return dur
                  ks = keyframes_near(t)
                  if not ks:
                      fail(f"Khong tim thay keyframe nao quanh {t:.1f}s")
                  return min(ks, key=lambda k: abs(k - t))

              # --- 1) mốc yeu cau (da kep vao do dai video) ---
              req_s, req_e = [], []
              for ep in eps:
                  s = float(ep["start"] or 0.0)
                  e = ep["end"]
                  if s >= dur - 0.5:
                      fail(f"ep{ep['n']}: start={s:.1f}s vuot qua do dai video ({dur:.1f}s)")
                  if e is None or e >= dur - 0.5:
                      if e is not None:
                          log(f"::warning::ep{ep['n']}: end={e:.1f}s >= do dai video ({dur:.1f}s) -> cat den het video")
                      e = dur
                  req_s.append(s)
                  req_e.append(float(e))

              # --- 2) can keyframe (diem cat chung cho 2 ep sat nhau) ---
              n = len(eps)
              S = [None] * n
              E = [None] * n
              for i in range(n):
                  if S[i] is None:
                      S[i] = snap(req_s[i])
                  if i + 1 < n and abs(req_s[i + 1] - req_e[i]) <= SHARE_GAP:
                      c = snap(req_s[i + 1])
                      E[i] = c
                      S[i + 1] = c
                  else:
                      E[i] = snap(req_e[i])

              # --- 3) cat bang stream copy ---
              for i, ep in enumerate(eps):
                  s, e = S[i], E[i]
                  if e - s < MIN_EP_SECONDS:
                      fail(f"ep{ep['n']}: doan sau khi can keyframe qua ngan ({s:.2f}s -> {e:.2f}s)")
                  d = WORK / "eps" / ep["slug"]
                  d.mkdir(parents=True, exist_ok=True)
                  out = d / "raw_video.mp4"
                  log(f"[SPLIT] ep{ep['n']} ({ep['slug']}): yeu cau {req_s[i]:.2f}s -> {req_e[i]:.2f}s | "
                      f"keyframe {s:.3f}s -> {e:.3f}s (lech {s - req_s[i]:+.2f}s / {e - req_e[i]:+.2f}s)")
                  cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                         "-ss", f"{s + 0.001:.3f}" if s > 0 else "0", "-i", str(VIDEO)]
                  if e < dur - 0.01:
                      cmd += ["-t", f"{e - s - 0.003:.3f}"]
                  cmd += ["-map", "0:v:0", "-map", "0:a?", "-c", "copy",
                          "-avoid_negative_ts", "make_zero", "-movflags", "+faststart", str(out)]
                  r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if r.returncode != 0 or not out.exists() or out.stat().st_size == 0:
                      fail(f"ffmpeg cat ep{ep['n']} that bai: {r.stderr[-500:]}")
                  od = probe_duration(out)
                  if not od:
                      fail(f"ep{ep['n']}: file cat ra khong doc duoc do dai")
                  if abs(od - (e - s)) > 3.0:
                      log(f"::warning::ep{ep['n']}: do dai thuc te {od:.2f}s lech so voi du kien {e - s:.2f}s")
                  chk = subprocess.run(
                      ["ffmpeg", "-v", "error", "-i", str(out), "-t", "20", "-f", "null", "-"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if chk.stderr.strip():
                      log(f"::warning::ep{ep['n']}: decode thu 20s dau co canh bao: {chk.stderr.strip()[:300]}")
                  log(f"[SPLIT] ep{ep['n']} OK: {od:.2f}s, {out.stat().st_size // 1048576} MB -> {out}")
                  result.append({"n": ep["n"], "slug": ep["slug"], "dir": str(d), "video": str(out),
                                 "start": s, "end": e, "duration": od})

              VIDEO.unlink()  # giai phong dia, ban goc khong can nua
              (WORK / "eps.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              log(f"[SPLIT] xong {len(result)} ep -> work/eps.json")

          if __name__ == "__main__":
              main()
          PY

      - name: Split video by episode (stream copy, keyframe-aligned)
        run: |
          set -euo pipefail
          python3 split_video.py
          cat work/eps.json
          ls -lh work/eps/*/raw_video.mp4

      - name: Record existing RAW ID
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          printf '%s' "$PD_ID" > "work/eps/${SLUG}/raw_id.txt"

      # ============================================================
      # PIXELDRAIN UPLOAD HELPER: bash pd_upload.sh <file> <ten-tren-pixeldrain> -> in ra ID (stdout)
      # ============================================================
      - name: Create Pixeldrain upload helper
        run: |
          cat > pd_upload.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          FILE="$1"
          NAME="$2"
          : "${PD_KEY:?Missing PD_KEY}"
          SIZE=$(stat -c %s "$FILE")
          echo "FILE: $NAME = $((SIZE / 1048576)) MB ($SIZE bytes)" >&2
          TMP=$(mktemp)
          ID=""
          MAX=6
          for attempt in $(seq 1 "$MAX"); do
            echo "[UP] Pixeldrain attempt $attempt/$MAX" >&2
            rm -f "$TMP"
            code=$(curl -sS -T "$FILE" -u ":$PD_KEY" \
              -o "$TMP" -w "%{http_code}" \
              "https://pixeldrain.com/api/file/${NAME}" || true)
            echo "HTTP $code: $(head -c 300 "$TMP" 2>/dev/null || true)" >&2
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              ID=$(jq -r '.id // empty' "$TMP")
              if [ -n "$ID" ]; then break; fi
            fi
            case "$code" in
              401|403|413|422)
                echo "::error::Pixeldrain từ chối (HTTP $code), không thử lại: $(head -c 300 "$TMP" 2>/dev/null || true)" >&2
                exit 1 ;;
            esac
            if [ "$attempt" -lt "$MAX" ]; then sleep $(( attempt * 10 )); fi
          done
          [ -n "$ID" ] || { echo '::error::Upload Pixeldrain thất bại sau nhiều lần thử' >&2; exit 1; }
          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://pixeldrain.com/api/file/${ID}/info")
          remote_size=$(jq -r '.size' <<<"$info")
          echo "Pixeldrain ID=$ID | size=$remote_size (local=$SIZE)" >&2
          [ "$remote_size" = "$SIZE" ] || { echo '::error::Size trên Pixeldrain không khớp file local' >&2; exit 1; }
          echo "$ID"
          SH

      - name: Create OCR script
        run: |
          cat > ocr_run.py <<'PY'
          """
          OCR sub cung (hardsub) theo DIEM NEO (anchor) moi WIN giay.
          1) Moi cua so lay toi da vai frame (dung som khi du frame co chu), det+rec tren vung rong
             -> dai (band) chua sub -> 1 diem neo (cy, th). th = TRUNG VI chieu cao TUNG BOX.
             Chu TINH (watermark/logo) duoc loai tren TOAN BO mau.
          2) Gom neo thanh DOAN vi tri (mac dinh 1 doan; chi tach khi >= 2 neo lien tiep cung lech y).
          3) FAST (rec-only) chi bat khi dai khit 1 dong + do khop cao + ti le rac thap.
          4) Gop cue: gop frame lien tiep, roi gop cue gan nhau co chu gan giong.
          5) Xuat <WORK_DIR>/subtitle_geometry.json dang { segments: [ {t_start,t_end,center_y,height,blur{}} ] }.
             Moi segment la 1 doan BLUR nho bam theo vi tri sub cuc bo (neo dao dong <= BLUR_RANGE_K*th).
          Bien moi truong: VIDEO (mac dinh raw_video.mp4), WORK_DIR (mac dinh work).
          """
          import cv2, json, math, os, random, re, subprocess, sys, time
          import multiprocessing as mp
          import numpy as np
          from pathlib import Path
          from difflib import SequenceMatcher
          VIDEO = os.environ.get("VIDEO", "raw_video.mp4")
          WORK = Path(os.environ.get("WORK_DIR", "work"))
          OUT = WORK / "ocr"
          FPS = 5.0
          STEP = 1.0 / FPS
          WIN = 45.0               # khoang cach giua 2 diem neo (giay)
          SAMPLES_PER_WIN = 8      # tang mau tim vi tri sub; early-stop van giu thoi gian nhanh
          MIN_WIN_FRAMES = 1       # chap nhan sub ngan chi xuat hien tren 1 frame mau
          EARLY_STOP_HITS = 3      # du N frame co chu thi bo qua mau con lai cua cua so
          MAX_REUSE = 2            # chi dung trong worker det+rec du phong
          SAME_IOU = 0.85          # chi dung trong worker det+rec du phong
          FAST_HALF_K = 0.8        # nua chieu cao dai FAST = th * K
          FAST_STRIP_MAX_RATIO = 0.22   # dai FAST cao hon ty le nay cua video -> tat FAST
          FAST_MIN_SCORE = 0.60    # FAST: diem toi thieu de giu ket qua
          BLUR_W_K = 0.70          # chieu rong vung blur sub = 70% chieu rong video
          BLUR_H_K = 1.1           # chieu cao vung blur = text_height * 1.1
          BLUR_RANGE_K = 0.5       # gom neo vao 1 doan blur khi cy dao dong <= K * th
          BLUR_MIN_GROUP = 2       # doan blur it hon N neo thi gop vao doan ben canh
          BLUR_OUTLIER_K = 0.5     # neo lech trung vi cua doan > K*th => coi la neo lac, bo
          TH_MAX_RATIO = 0.12      # chieu cao chu > ty le nay cua video -> bo neo (do hong)
          CHANGE_TOL_K = 0.8       # lech y > max(10, K*th) moi coi la doi vi tri
          CHANGE_MIN_ANCHORS = 2   # can >= N neo lien tiep cung lech moi tach doan
          REFINE_MIN_GAP = 1.5     # dung do nhi phan khi khoang < N giay
          REFINE_MAX_IT = 7        # so vong do nhi phan toi da cho moi diem doi
          SEG_PAD = 1.0            # moi doan OCR rong them +-N giay quanh ranh gioi
          MERGE_GAP = 0.4          # chi noi lai cung mot cue sau mot khung OCR trong
          MERGE_SIM = 0.90         # khong gop hai cau rieng chi vi cung chu de
          def log(msg):
              print(msg, flush=True)
          _ENGINE = None
          def make_engine():
              """Cache 1 engine moi process (tranh load model lai o moi task)."""
              global _ENGINE
              if _ENGINE is not None:
                  return _ENGINE
              from rapidocr import EngineType, LangRec, ModelType, OCRVersion, RapidOCR
              # PP-OCRv6 small giu toc do; rong 2048 de khong ep dong sub dai vao 320px.
              _ENGINE = RapidOCR(params={
                  "Rec.engine_type": EngineType.ONNXRUNTIME,
                  "Rec.lang_type": LangRec.CH,
                  "Rec.model_type": ModelType.SMALL,
                  "Rec.ocr_version": OCRVersion.PPOCRV6,
                  "Rec.rec_img_shape": [3, 48, 2048],
                  "Rec.rec_batch_num": 1,
              })
              return _ENGINE
          def has_text_edges(gray):
              h, w = gray.shape
              need = max(30, int(h * w * 0.0001))
              return cv2.countNonZero(cv2.Canny(gray, 80, 180)) >= need
          def norm_text(t):
              return re.sub(r"[^\u4e00-\u9fffA-Za-z0-9]", "", t)
          def cjk_count(t):
              return sum("\u4e00" <= ch <= "\u9fff" for ch in t)
          def output_items(output):
              """Normalize RapidOCR 3.x output and the older tuple/list output."""
              if output is None:
                  return []
              if isinstance(output, tuple) and len(output) == 2:
                  output = output[0]
              if hasattr(output, "boxes") and hasattr(output, "txts"):
                  boxes = output.boxes
                  texts = output.txts
                  scores = getattr(output, "scores", None)
                  if scores is None:
                      scores = [1.0] * len(texts)
                  return list(zip(boxes, texts, scores))
              return list(output)
          def run_ocr(engine, crop, x_off, y_off, frame_no):
              dets = []
              result = output_items(engine(crop))
              if not result:
                  return dets
              for box, text, score in result:
                  text = re.sub(r"\s+", "", text)
                  chars = cjk_count(text)
                  min_score = .34 if chars <= 2 else .40
                  if chars < 1 or float(score) < min_score:
                      continue
                  xs = [float(p[0]) + x_off for p in box]
                  ys = [float(p[1]) + y_off for p in box]
                  dets.append({
                      "frame": frame_no, "time": frame_no * STEP, "text": text,
                      "score": float(score), "x1": min(xs), "x2": max(xs),
                      "y1": min(ys), "y2": max(ys),
                      "cy": (min(ys) + max(ys)) / 2.0
                  })
              return dets
          def rec_only(engine, img):
              """Chi chay nhan dang (bo phat hien chu): nhanh hon rat nhieu, dung cho 1 dong sub."""
              try:
                  r = engine(img, use_det=False, use_cls=False, use_rec=True)
              except Exception:
                  return "", 0.0
              if not r:
                  return "", 0.0
              if isinstance(r, tuple) and len(r) == 2:
                  r = r[0]
              if hasattr(r, "txts"):
                  texts = list(r.txts)
                  raw_scores = getattr(r, "scores", None)
                  scores = list(raw_scores) if raw_scores is not None else []
                  if not texts:
                      return "", 0.0
                  return re.sub(r"\s+", "", str(texts[0])), float(scores[0] if scores else 0.0)
              if isinstance(r, (list, tuple)) and r:
                  return re.sub(r"\s+", "", str(r[0][0])), float(r[0][1])
              return "", 0.0
          def text_similarity(a, b):
              a, b = norm_text(a), norm_text(b)
              return SequenceMatcher(None, a, b, autojunk=False).ratio() if a and b else 0.0
          def retry_view(img):
              """Alternative contrast view for first/uncertain frames of a subtitle cue."""
              gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
              clahe = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(8, 8)).apply(gray)
              return cv2.cvtColor(clahe, cv2.COLOR_GRAY2BGR)
          def grab_frame(t, width, height):
              """Lay 1 frame tai thoi diem t bang ffmpeg CLI (seek on dinh, khong dung cv2 seek)."""
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-ss", f"{max(0.0, t):.3f}",
                     "-i", VIDEO, "-frames:v", "1", "-an",
                     "-f", "rawvideo", "-pix_fmt", "bgr24", "pipe:1"]
              out = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout
              if len(out) < width * height * 3:
                  return None
              return np.frombuffer(out, np.uint8)[:width * height * 3].reshape(height, width, 3).copy()
          # ------------------------------------------------------------
          # CHU TINH (watermark / logo)
          # ------------------------------------------------------------
          def find_static(dets, total_windows):
              """Tim watermark/logo: chu co cung vi tri+kich thuoc, xuat hien suot video."""
              if len(dets) < 10:
                  return None
              win = np.array([d["win"] for d in dets])
              x1 = np.array([d["x1"] for d in dets])
              x2 = np.array([d["x2"] for d in dets])
              cy = np.array([d["cy"] for d in dets])
              static_idx = []
              for i in range(len(dets)):
                  m = (np.abs(x1 - x1[i]) < 15) & (np.abs(x2 - x2[i]) < 15) & (np.abs(cy - cy[i]) < 15)
                  w = win[m]
                  nw = len(np.unique(w))
                  spread = (int(w.max() - w.min()) + 1) / max(1, total_windows)
                  if nw >= max(3, 0.70 * total_windows) and spread >= 0.85:
                      static_idx.append(i)
              if not static_idx:
                  return None
              static_txt = {norm_text(dets[i]["text"]) for i in static_idx}
              boxes = {(round(dets[i]["x1"] / 10), round(dets[i]["x2"] / 10), round(dets[i]["cy"] / 10))
                       for i in static_idx}
              sb = [(a * 10, b * 10, c * 10) for a, b, c in boxes]
              log(f"[STATIC] phat hien watermark: {sorted(static_txt)[:5]}")
              return {"txt": static_txt, "sb": sb}
          def apply_static(dets, st):
              if not st:
                  return dets
              static_txt, sb = st["txt"], st["sb"]
              keep = []
              for d in dets:
                  t = norm_text(d["text"])
                  near = any(abs(d["cy"] - c) < 20 for _, _, c in sb)
                  if near:
                      similar = bool(t) and any(t in s or s in t or SequenceMatcher(None, t, s).ratio() >= .5
                                                for s in static_txt)
                      inside = any(d["x1"] >= a - 30 and d["x2"] <= b + 30 and abs(d["cy"] - c) < 20
                                   for a, b, c in sb)
                      # Giu cue ngan de watermark lap lai khong lam mat loi thoai 1-2 chu.
                      if cjk_count(d["text"]) > 2 and (similar or inside):
                          continue
                  keep.append(d)
              if len(keep) != len(dets):
                  log(f"[STATIC] loai {len(dets) - len(keep)}/{len(dets)} detection (watermark)")
              return keep
          def pick_band(dets, height, min_frames=3):
              """Gom box theo vi tri doc, tra ve dai on dinh nhat + tolerance."""
              tolerance = max(14.0, height * .03)
              bands = []
              for d in sorted(dets, key=lambda v: v["cy"]):
                  choices = [(abs(float(np.median([x["cy"] for x in band])) - d["cy"]), band)
                             for band in bands]
                  choices = [item for item in choices if item[0] <= tolerance]
                  if choices:
                      min(choices, key=lambda item: item[0])[1].append(d)
                  else:
                      bands.append([d])
              bands = [b for b in bands if len({d["frame"] for d in b}) >= min_frames]
              if not bands:
                  return [], tolerance
              band = max(bands, key=lambda b: (
                  len({d["frame"] for d in b}),
                  sum(d["score"] for d in b),
                  sum(len(d["text"]) for d in b)))
              return band, tolerance
          # ------------------------------------------------------------
          # GIAI DOAN 1: MAU THUA THEO CUA SO -> DIEM NEO
          # ------------------------------------------------------------
          def plan_samples(duration):
              n_win = max(1, int(math.ceil(duration / WIN)))
              spw = min(30, max(SAMPLES_PER_WIN, int(math.ceil(30.0 / n_win))))
              wins = []
              for w in range(n_win):
                  a = w * WIN
                  b = min(duration, (w + 1) * WIN)
                  ln = b - a
                  if ln <= 0.5:
                      continue
                  n = max(3, min(spw, int(ln)))
                  times = [min(a + (j + 0.5) * ln / n, max(0.0, duration - 0.2)) for j in range(n)]
                  wins.append((w, times))
              return n_win, wins
          def sample_worker(task):
              width, height, x0, x1, y0, wins = task
              engine = make_engine()
              dets = []
              for w, times in wins:
                  hits = 0
                  for j, t in enumerate(times):
                      image = grab_frame(t, width, height)
                      if image is None:
                          continue
                      crop = image[y0:height, x0:x1]
                      gray = cv2.cvtColor(crop, cv2.COLOR_BGR2GRAY)
                      if not has_text_edges(gray):
                          continue
                      found = run_ocr(engine, crop, x0, y0, w * 64 + j)
                      if found:
                          hits += 1
                          for d in found:
                              d["time"] = t
                              d["win"] = w
                              dets.append(d)
                      if hits >= EARLY_STOP_HITS:
                          break
              return dets
          def build_anchor(win, band, height):
              """Tu cac box cua dai trong 1 cua so -> (cy, th). th = TRUNG VI chieu cao TUNG BOX."""
              by = {}
              for d in band:
                  by.setdefault(d["frame"], []).append(d)
              cys, hs, lefts, rights = [], [], [], []
              for items in by.values():
                  for d in items:
                      hs.append(d["y2"] - d["y1"])
                  cys.append(float(np.median([d["cy"] for d in items])))
                  lefts.append(min(d["x1"] for d in items))
                  rights.append(max(d["x2"] for d in items))
              cy = float(np.median(cys))
              th = float(np.median(hs))
              x1 = float(np.percentile(lefts, 5))
              x2 = float(np.percentile(rights, 95))
              ok = (th >= max(8, height * .012) and th <= height * TH_MAX_RATIO
                    and height * .35 <= cy <= height * .98)
              if not ok:
                  return None
              times = [d["time"] for d in band]
              return {"win": win, "cy": cy, "th": th, "x1": x1, "x2": x2, "frames": len(by), "by": by,
                      "t_first": float(min(times)), "t_last": float(max(times)),
                      "t_mid": float(np.median(times))}
          def anchor_strip(cy_lo, cy_hi, th, y0, height):
              half = th * FAST_HALF_K
              ty0 = max(y0, int(cy_lo - half))
              ty1 = min(height, int(math.ceil(cy_hi + half)))
              return ty0, ty1
          def fast_check(seg, width, height, x0, x1, y0, duration, st):
              """Tu kiem tra FAST tren doan CHINH: so rec-only voi det+rec tren cung 1 dai khit.
              Lay mau ngau nhien ca frame KHONG co sub de do ti le rac."""
              engine = make_engine()
              ty0, ty1 = seg["ty0"], seg["ty1"]
              n = 40
              rng = random.Random(12345)
              pos, neg, junk = [], 0, 0
              junk_txt = []
              for i in range(n):
                  t = duration * (i + rng.random()) / n
                  image = grab_frame(t, width, height)
                  if image is None:
                      continue
                  strip = image[ty0:ty1, x0:x1]
                  if strip.shape[0] < 8:
                      continue
                  gray = cv2.cvtColor(strip, cv2.COLOR_BGR2GRAY)
                  if not has_text_edges(gray):
                      continue
                  dets = apply_static(run_ocr(engine, strip, x0, ty0, 0), st)
                  ref = norm_text("".join(d["text"] for d in sorted(dets, key=lambda d: d["x1"])))
                  txt, sc = rec_only(engine, strip)
                  chars = cjk_count(txt)
                  rec_ok = chars >= 1 and sc >= (0.60 if chars <= 2 else FAST_MIN_SCORE)
                  if len(ref) >= 1:
                      pos.append(SequenceMatcher(None, ref, norm_text(txt) if rec_ok else "").ratio())
                  else:
                      neg += 1
                      if rec_ok:
                          junk += 1
                          junk_txt.append((round(t, 1), txt, round(sc, 2)))
              mean = float(np.mean(pos)) if pos else 0.0
              junk_rate = junk / float(max(1, len(pos) + neg))
              ok = len(pos) >= 8 and mean >= 0.70 and junk_rate <= 0.15
              log(f"[FAST-CHECK] co sub: {len(pos)} mau, khop TB {mean:.2f} | khong sub: {neg} mau, rac {junk} "
                  f"({junk_rate * 100:.1f}% tong mau) -> {'DUNG che do nhanh' if ok else 'KHONG dung (dung det+rec)'}")
              for jt in junk_txt[:6]:
                  log(f"[FAST-CHECK]   rac? t={jt[0]}s diem={jt[2]} text={jt[1]!r}")
              return ok
          # ------------------------------------------------------------
          # DO NHI PHAN DIEM DOI VI TRI GIUA 2 NEO
          # ------------------------------------------------------------
          def observe(engine, t, ctx, cy_a, cy_b, tolm, st):
              """Tai thoi diem t: sub dang o vi tri A hay B? None neu khong thay sub."""
              width, height, x0, x1, y0 = ctx
              image = grab_frame(t, width, height)
              if image is None:
                  return None
              crop = image[y0:height, x0:x1]
              gray = cv2.cvtColor(crop, cv2.COLOR_BGR2GRAY)
              if not has_text_edges(gray):
                  return None
              dets = apply_static(run_ocr(engine, crop, x0, y0, 0), st)
              na = nb = 0
              for d in dets:
                  da, db = abs(d["cy"] - cy_a), abs(d["cy"] - cy_b)
                  if da <= db and da <= tolm:
                      na += 1
                  elif db < da and db <= tolm:
                      nb += 1
              if na == 0 and nb == 0:
                  return None
              return "a" if na >= nb else "b"
          def refine(engine, ctx, t_a, t_b, cy_a, cy_b, th, st):
              """Tra ve (lo, hi): doan thoi gian chua diem doi."""
              lo, hi = t_a, t_b
              tolm = max(18.0, th * .9)
              offsets = [0, .5, -.5, 1, -1, 1.5, -1.5, 2.5, -2.5, 4, -4, 6, -6]
              probes = 0
              for _ in range(REFINE_MAX_IT):
                  if hi - lo <= REFINE_MIN_GAP:
                      break
                  mid = (lo + hi) / 2.0
                  got = False
                  for off in offsets:
                      tf = mid + off
                      if not (lo + 0.05 < tf < hi - 0.05):
                          continue
                      probes += 1
                      side = observe(engine, tf, ctx, cy_a, cy_b, tolm, st)
                      if side is None:
                          continue
                      if side == "a":
                          lo = tf
                      else:
                          hi = tf
                      got = True
                      break
                  if not got:
                      break
              state = "hoi tu" if hi - lo <= REFINE_MIN_GAP * 1.5 else "KHONG chac -> 2 doan chong lan"
              log(f"[REFINE] {t_a:.1f}s..{t_b:.1f}s (y {cy_a:.0f} -> {cy_b:.0f}) => doi trong {lo:.1f}s..{hi:.1f}s "
                  f"({probes} probe, {state})")
              return lo, hi
          def group_anchors(real):
              """Mac dinh 1 nhom. Chi tach nhom khi >= CHANGE_MIN_ANCHORS neo lien tiep cung lech y."""
              groups, pending = [], []
              for a in real:
                  if not groups:
                      groups.append([a])
                      continue
                  g = groups[-1]
                  med = float(np.median([x["cy"] for x in g]))
                  th_ref = max(a["th"], float(np.median([x["th"] for x in g])))
                  tol = max(10.0, CHANGE_TOL_K * th_ref)
                  if abs(a["cy"] - med) <= tol:
                      pending = []
                      g.append(a)
                      continue
                  if pending and abs(a["cy"] - float(np.median([x["cy"] for x in pending]))) <= tol:
                      pending.append(a)
                  else:
                      pending = [a]
                  if len(pending) >= CHANGE_MIN_ANCHORS:
                      groups.append(pending)
                      pending = []
              big = [g for g in groups if len(g) >= CHANGE_MIN_ANCHORS]
              groups = big or [max(groups, key=len)]
              merged = []
              for g in groups:
                  if merged:
                      pm = float(np.median([x["cy"] for x in merged[-1]]))
                      pth = float(np.median([x["th"] for x in merged[-1] + g]))
                      if abs(float(np.median([x["cy"] for x in g])) - pm) <= max(10.0, CHANGE_TOL_K * pth):
                          merged[-1].extend(g)
                          continue
                  merged.append(g)
              return merged
          def make_blur(seg, width, height):
              """Tao box blur sub rong 70% khung hinh, cao hon bbox chu 10%."""
              th = max(2.0, float(seg["height"]))
              bw = min(width // 2 * 2, max(2, int(math.ceil(width * BLUR_W_K / 2.0) * 2)))
              bh = min(height // 2 * 2, max(2, int(math.ceil(th * BLUR_H_K / 2.0) * 2)))
              bx = int(math.floor(((width - bw) / 2.0) / 2.0) * 2)
              bx = min(max(0, bx), max(0, width - bw))
              bx -= bx % 2
              top = int(math.floor((float(seg["center_y"]) - bh / 2.0) / 2.0) * 2)
              y = min(max(0, top), max(0, height - bh))
              y -= y % 2
              return {"x": bx, "y": y, "width": bw, "height": bh,
                      "width_ratio": BLUR_W_K, "height_ratio": BLUR_H_K,
                      "center_y": int(round(seg["center_y"]))}
          def build_blur_segments(real, segs, width, height):
              """Chia moi doan vi tri lon thanh cac doan blur nho theo neo.
              FIX: (1) loc neo lac theo trung vi cua doan truoc khi chia nhom,
                   (2) nhom le khong bi nhet vao nhom khac neu lam gian qua gioi han (bo luon)."""
              out = []
              for si, s in enumerate(segs):
                  an = sorted([a for a in real if s["t_start"] <= a["t_mid"] < s["t_end"]],
                              key=lambda a: a["t_mid"])
                  if not an:
                      an = [{"cy": s["center_y"], "th": s["height"], "x1": s["x1"], "x2": s["x2"],
                             "t_mid": (s["t_start"] + s["t_end"]) / 2.0}]
                  else:
                      # --- (1) loc neo lac ---
                      med = float(np.median([a["cy"] for a in an]))
                      th_med = float(np.median([a["th"] for a in an]))
                      tol = max(10.0, BLUR_OUTLIER_K * th_med)
                      good = [a for a in an if abs(a["cy"] - med) <= tol]
                      n_bad = len(an) - len(good)
                      if n_bad and good:
                          bad_cys = sorted(round(a["cy"]) for a in an if abs(a["cy"] - med) > tol)
                          log(f"[BLUR] doan {si}: bo {n_bad}/{len(an)} neo lac (trung vi cy={med:.0f}, "
                              f"tol={tol:.0f}px), cy lac={bad_cys[:10]}")
                          an = good
                  th_all = float(np.median([a["th"] for a in an]))
                  limit = max(10.0, BLUR_RANGE_K * th_all)
                  groups, cur = [], [an[0]]
                  lo = hi = an[0]["cy"]
                  for a in an[1:]:
                      nlo, nhi = min(lo, a["cy"]), max(hi, a["cy"])
                      if nhi - nlo <= limit:
                          cur.append(a)
                          lo, hi = nlo, nhi
                      else:
                          groups.append(cur)
                          cur = [a]
                          lo = hi = a["cy"]
                  groups.append(cur)
                  # --- (2) nhom qua it neo: chi gop neu khong pha gioi han, neu khong thi bo ---
                  changed = True
                  while changed and len(groups) > 1:
                      changed = False
                      for i, g in enumerate(groups):
                          if len(g) >= BLUR_MIN_GROUP:
                              continue
                          gcy = float(np.median([x["cy"] for x in g]))
                          cands = [j for j in (i - 1, i + 1) if 0 <= j < len(groups)]
                          j = min(cands, key=lambda j: abs(float(np.median([x["cy"] for x in groups[j]])) - gcy))
                          merged = groups[j] + g
                          mcys = [a["cy"] for a in merged]
                          if max(mcys) - min(mcys) <= limit:
                              groups[j] = sorted(merged, key=lambda a: a["t_mid"])
                          else:
                              log(f"[BLUR] doan {si}: bo nhom le {len(g)} neo (cy={gcy:.0f}), "
                                  f"khong gop vi se lam gian blur")
                          del groups[i]
                          changed = True
                          break
                  for gi, g in enumerate(groups):
                      t0 = s["t_start"] if gi == 0 else (groups[gi - 1][-1]["t_mid"] + g[0]["t_mid"]) / 2.0
                      t1 = s["t_end"] if gi == len(groups) - 1 else (g[-1]["t_mid"] + groups[gi + 1][0]["t_mid"]) / 2.0
                      cys = [a["cy"] for a in g]
                      lo, hi = min(cys), max(cys)
                      th = float(np.median([a["th"] for a in g]))
                      x1 = float(np.percentile([a["x1"] for a in g], 5))
                      x2 = float(np.percentile([a["x2"] for a in g], 95))
                      seg = {"center_y": (lo + hi) / 2.0, "height": th, "x1": x1, "x2": x2}
                      out.append({"t_start": round(t0, 3), "t_end": round(t1, 3),
                                  "center_y": int(round(seg["center_y"])), "height": int(round(th)),
                                  "cy_lo": int(round(lo)), "cy_hi": int(round(hi)),
                                  "x1": int(round(x1)), "x2": int(round(x2)),
                                  "anchors": len(g), "blur": make_blur(seg, width, height)})
              log(f"[BLUR] {len(out)} doan blur (tu {len(segs)} doan vi tri)")
              return out
          # ------------------------------------------------------------
          # GIAI DOAN 2: OCR toan video theo tung doan (song song)
          # ------------------------------------------------------------
          def worker(task):
              seg, start_frame, n_frames, x0, y0, x1, y1 = task
              w, h = (x1 - x0) // 2 * 2, (y1 - y0) // 2 * 2
              engine = make_engine()
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-threads", "1",
                     "-ss", f"{start_frame * STEP:.3f}", "-i", VIDEO,
                     "-t", f"{n_frames * STEP:.3f}", "-an",
                     "-vf", f"fps={FPS},crop={w}:{h}:{x0}:{y0}",
                     "-frames:v", str(n_frames),
                     "-f", "rawvideo", "-pix_fmt", "bgr24", "pipe:1"]
              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE)
              size = w * h * 3
              dets, last, last_mask, reuse, k, ocr_calls = [], None, None, 0, 0, 0
              t_w = time.time()
              while True:
                  buf = proc.stdout.read(size)
                  if len(buf) < size:
                      break
                  fn = start_frame + k
                  k += 1
                  if k % 40 == 0:
                      el = time.time() - t_w
                      log(f"[worker seg{seg}@{start_frame}] {k}/{n_frames} frames, ocr_calls={ocr_calls}, "
                          f"{el:.0f}s, {el / k:.2f}s/frame")
                  frame = np.frombuffer(buf, np.uint8).reshape(h, w, 3).copy()
                  gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                  if not has_text_edges(gray):
                      last, last_mask, reuse = None, None, 0
                      continue
                  small = cv2.resize(gray, (max(1, w // 4), max(1, h // 4)), interpolation=cv2.INTER_AREA)
                  mask = small >= 200
                  cnt = int(mask.sum())
                  usable = 20 <= cnt <= mask.size * 0.3
                  if usable and last is not None and last_mask is not None and reuse < MAX_REUSE:
                      union = int(np.logical_or(mask, last_mask).sum())
                      inter = int(np.logical_and(mask, last_mask).sum())
                      if union and inter / union >= SAME_IOU:
                          reuse += 1
                          dets.extend(dict(d, frame=fn, time=fn * STEP) for d in last)
                          continue
                  cur = run_ocr(engine, frame, x0, y0, fn)
                  ocr_calls += 1
                  last, last_mask, reuse = cur, mask, 0
                  dets.extend(cur)
              proc.stdout.close()
              proc.wait()
              for d in dets:
                  d["seg"] = seg
              log(f"[worker seg{seg}@{start_frame}] done frames={k} ocr_calls={ocr_calls} in {time.time() - t_w:.0f}s")
              return dets
          def worker_fast(task):
              """FAST rec-only; OCR tung frame, them mot view OCR khi dau cue/score thap."""
              seg, start_frame, n_frames, x0, y0, x1, y1, cy, th = task
              w, h = (x1 - x0) // 2 * 2, (y1 - y0) // 2 * 2
              engine = make_engine()
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-threads", "1",
                     "-ss", f"{start_frame * STEP:.3f}", "-i", VIDEO,
                     "-t", f"{n_frames * STEP:.3f}", "-an",
                     "-vf", f"fps={FPS},crop={w}:{h}:{x0}:{y0}",
                     "-frames:v", str(n_frames),
                     "-f", "rawvideo", "-pix_fmt", "bgr24", "pipe:1"]
              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE)
              size = w * h * 3
              dets, audit, k, calls, retries = [], [], 0, 0, 0
              last_text = ""
              t_w = time.time()
              while True:
                  buf = proc.stdout.read(size)
                  if len(buf) < size:
                      break
                  fn = start_frame + k
                  k += 1
                  if k % 100 == 0:
                      el = time.time() - t_w
                      log(f"[fast seg{seg}@{start_frame}] {k}/{n_frames} frames, rec_calls={calls}, {el:.0f}s, {el / k:.2f}s/frame")
                  frame = np.frombuffer(buf, np.uint8).reshape(h, w, 3).copy()
                  gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                  if not has_text_edges(gray):
                      audit.append((seg, fn, "", "", "", "", "", "", "no_text_edges"))
                      last_text = ""
                      continue
                  text, score = rec_only(engine, frame)
                  calls += 1
                  alt_text, alt_score = "", 0.0
                  # Chay view thu hai chi luc bat dau/doi cau hoac OCR co diem thap.
                  if score < .72 or (text and (not last_text or text_similarity(text, last_text) < .90)):
                      alt_text, alt_score = rec_only(engine, retry_view(frame))
                      retries += 1
                  selected_text, selected_score = text, score
                  if alt_text and (alt_score > score + .02 or not text):
                      selected_text, selected_score = alt_text, alt_score
                  cur = None
                  chars = cjk_count(selected_text)
                  if not selected_text:
                      status = "empty_recognition"
                  elif chars < 1:
                      status = "no_chinese_character"
                  elif selected_score < FAST_MIN_SCORE:
                      status = "rejected_low_confidence"
                  else:
                      status = "accepted"
                  audit.append((seg, fn, text, f"{score:.3f}", alt_text, f"{alt_score:.3f}" if alt_text else "",
                                selected_text, f"{selected_score:.3f}", status))
                  # Giu moi ket qua co chu Hoa; diem thap se duoc danh dau de review, khong xoa khoi SRT.
                  if chars >= 1:
                      glyph_w = sum(th if "\u4e00" <= ch <= "\u9fff" else th * 0.55 for ch in selected_text)
                      box_w = min(float(x1 - x0), max(th, glyph_w * 1.05))
