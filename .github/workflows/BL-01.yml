name: "NEW NEW [01/03] Bili → RAW → SUB"

on:
  workflow_dispatch:
    inputs:
      link:
        description: "https://www.bilibili.com/video/BV1YZJb6RELN?p=1 (tuỳ chọn thêm &ep1-start=0&ep1-end=7215&ep2-start=7216&ep2-end=14400 ... đơn vị giây)"
        required: true
        type: string
      slug:
        description: "slug (nếu cắt nhiều ep: slug của ep ĐẦU, phải kết thúc bằng số, vd tv-id-1-14 -> ep sau tự thành tv-id-1-15)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      SLUG: ${{ inputs.slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          VIDEO_URL: ${{ inputs.link }}
        run: |
          [[ "$VIDEO_URL" =~ ^https?://([[:alnum:]-]+\.)?bilibili\.com/video/BV[0-9A-Za-z]+ ]] || { echo '::error::url must be a Bilibili video URL'; exit 1; }
          [[ "$SLUG" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo '::error::slug chỉ được chứa A-Z a-z 0-9 _ -'; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip unzip jq

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-s1-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pip-s1-${{ runner.os }}-

      - name: Install Python packages (yt-dlp + Gemini)
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            yt-dlp \
            google-genai \
            pysubs2 \
            requests
          python3 <<'PY'
          import pysubs2, requests
          from google import genai
          print("ALL IMPORTS OK")
          PY

      # ============================================================
      # SMOKE TEST: PIXELDRAIN API KEY. Lỗi thì dừng ngay.
      # ============================================================
      - name: Test Pixeldrain API key (smoke test, stop early if it fails)
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          code=$(curl -s -o /tmp/pd_user.json -w "%{http_code}" --retry 3 --retry-all-errors \
            -u ":$PD_KEY" "https://pixeldrain.com/api/user" || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Pixeldrain API key sai / không truy cập được: $(head -c 300 /tmp/pd_user.json 2>/dev/null)"; exit 1; }
          can_upload=$(jq -r '.can_upload // true' /tmp/pd_user.json)
          echo "Pixeldrain user: $(jq -r '.username' /tmp/pd_user.json) | can_upload=$can_upload"
          [ "$can_upload" != "false" ] || { echo '::error::Tài khoản Pixeldrain chưa được phép upload (cần xác minh email)'; exit 1; }

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work work/eps

      # ============================================================
      # PARSE URL: tách tham số epN-start / epN-end ra khỏi link,
      # tính slug riêng cho từng ep (slug đầu + offset ở số cuối).
      # Kết quả: work/plan.json + output clean_url (link sạch để yt-dlp tải)
      # ============================================================
      - name: Create plan script (parse ep params from URL)
        run: |
          cat > plan_eps.py <<'PY'
          """
          Doc link + slug -> work/plan.json
            { "clean_url": "...", "split": bool,
              "eps": [ {"n": 1, "slug": "...", "start": float|None, "end": float|None}, ... ] }
          - Tham so epN-start / epN-end (giay hoac HH:MM:SS) bi loai khoi URL truoc khi tai.
          - Khong co tham so ep nao -> 1 ep duy nhat, giu nguyen slug, khong cat.
          - Co >= 2 ep -> slug phai ket thuc bang so; ep thu k co slug = so cuoi + (epK - ep dau).
          """
          import json, os, re, sys
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          link = os.environ["VIDEO_URL"].strip()
          slug = os.environ["SLUG"].strip()
          EP_KEY = re.compile(r"^ep(\d+)-(start|end)$", re.I)
          SLUG_OK = re.compile(r"^[A-Za-z0-9_-]{1,100}$")

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def to_sec(v, name):
              v = v.strip()
              try:
                  if ":" in v:
                      parts = [float(x) for x in v.split(":")]
                      if len(parts) > 3:
                          raise ValueError
                      sec = 0.0
                      for p in parts:
                          sec = sec * 60 + p
                  else:
                      sec = float(v)
              except ValueError:
                  fail(f"{name}='{v}' khong phai so giay (hoac HH:MM:SS)")
              if sec < 0:
                  fail(f"{name}='{v}' khong duoc am")
              return sec

          u = urlsplit(link)
          keep, raw = [], {}
          for k, v in parse_qsl(u.query, keep_blank_values=True):
              m = EP_KEY.match(k)
              if m:
                  raw.setdefault(int(m.group(1)), {})[m.group(2).lower()] = v
              else:
                  keep.append((k, v))
          clean_url = urlunsplit((u.scheme, u.netloc, u.path, urlencode(keep), ""))

          eps = []
          if not raw:
              eps.append({"n": 1, "slug": slug, "start": None, "end": None})
              split = False
          else:
              split = True
              nums = sorted(raw)
              first = nums[0]
              for i, n in enumerate(nums):
                  d = raw[n]
                  if "start" in d:
                      s = to_sec(d["start"], f"ep{n}-start")
                  elif i == 0:
                      s = 0.0
                  else:
                      fail(f"ep{n} thieu ep{n}-start")
                  if "end" in d:
                      e = to_sec(d["end"], f"ep{n}-end")
                  elif i + 1 < len(nums) and "start" in raw[nums[i + 1]]:
                      e = to_sec(raw[nums[i + 1]]["start"], f"ep{nums[i + 1]}-start")
                  else:
                      e = None
                  if e is not None and e <= s:
                      fail(f"ep{n}: end ({e}) phai lon hon start ({s})")
                  eps.append({"n": n, "start": s, "end": e, "offset": n - first})
              for a, b in zip(eps, eps[1:]):
                  if a["end"] is not None and b["start"] < a["end"] - 2.0:
                      fail(f"ep{a['n']} va ep{b['n']} chong lan thoi gian ({a['end']} > {b['start']})")
              if len(eps) > 1:
                  m = re.match(r"^(.*?)(\d+)$", slug)
                  if not m:
                      fail("Cat tu 2 ep tro len: slug phai ket thuc bang so (vd tv-id-1-14)")
                  prefix, num = m.group(1), m.group(2)
                  for ep in eps:
                      ep["slug"] = prefix + str(int(num) + ep["offset"]).zfill(len(num))
              else:
                  eps[0]["slug"] = slug
              for ep in eps:
                  ep.pop("offset", None)
                  if not SLUG_OK.match(ep["slug"]):
                      fail(f"slug sinh ra khong hop le: {ep['slug']}")

          plan = {"clean_url": clean_url, "split": split, "eps": eps}
          Path("work/plan.json").write_text(json.dumps(plan, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"clean_url = {clean_url}")
          print(f"split     = {split}")
          for ep in eps:
              print(f"  ep{ep['n']}: slug={ep['slug']} start={ep['start']} end={ep['end']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"clean_url={clean_url}\n")
              f.write(f"split={'true' if split else 'false'}\n")
          PY

      - name: Parse URL (episode plan)
        id: plan
        env:
          VIDEO_URL: ${{ inputs.link }}
        run: |
          set -euo pipefail
          python3 plan_eps.py

      - name: Prepare Bilibili cookies (inline Python)
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re
          from pathlib import Path
          raw = os.environ.get("BILIBILI_COOKIES", "").strip()
          if not raw:
              raise SystemExit("Missing GitHub secret BILIBILI_COOKIES")
          out = Path("work/cookies.txt")
          if raw.startswith("# Netscape HTTP Cookie File") or raw.startswith("# HTTP Cookie File"):
              out.write_text(raw + ("\n" if not raw.endswith("\n") else ""), encoding="utf-8")
          else:
              pairs = []
              for item in raw.split(";"):
                  item = item.strip()
                  if "=" not in item:
                      continue
                  name, value = item.split("=", 1)
                  name, value = name.strip(), value.strip()
                  if re.fullmatch(r"[A-Za-z0-9_]+", name) and value:
                      pairs.append((name, value))
              if not pairs:
                  raise SystemExit("BILIBILI_COOKIES is neither a Netscape file nor a Cookie header")
              with out.open("w", encoding="utf-8") as f:
                  f.write("# Netscape HTTP Cookie File\n")
                  for name, value in pairs:
                      f.write(f".bilibili.com\tTRUE\t/\tTRUE\t0\t{name}\t{value}\n")
          os.chmod(out, 0o600)
          print("Cookie file prepared (values hidden).")
          PY

      # ============================================================
      # SUB TRUNG CÓ SẴN CỦA BILI (sub rời, CC / AI).
      # Gọi API player của Bili (cần cookie đăng nhập mới thấy sub), chọn sub tiếng Trung
      # (ưu tiên sub người làm zh-CN/zh-Hans, sau đó mới tới AI 'ai-zh').
      # Kết quả: work/bili_sub.json {lan, cues:[{from,to,content}]} (thời gian = thời gian video GỐC).
      # KHÔNG có sub -> dừng NGAY (trước khi tải video, đỡ tốn thời gian).
      # ============================================================
      - name: Create Bili subtitle scripts
        run: |
          cat > bili_sub_fetch.py <<'PY'
          """
          Tai sub roi tieng Trung cua Bilibili -> work/bili_sub.json
            { "lan": "...", "bvid": "...", "cid": N, "cues": [ {"from": s, "to": s, "content": "..."} ] }
          Bien moi truong: VIDEO_URL (link sach, co the co ?p=N).
          Khong lay duoc sub -> exit 1.
          """
          import hashlib, json, os, re, sys, time, urllib.parse
          from pathlib import Path
          import requests

          WORK = Path("work")
          OUT = WORK / "bili_sub.json"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          HEADERS = {"User-Agent": UA, "Referer": "https://www.bilibili.com/", "Origin": "https://www.bilibili.com"}
          # sub nguoi lam truoc, AI sau cung
          LAN_PREF = ["zh-CN", "zh-Hans", "zh", "zh-Hant", "zh-TW", "zh-HK", "ai-zh"]
          MIXIN = [46, 47, 18, 2, 53, 8, 23, 32, 15, 50, 10, 31, 58, 3, 45, 35, 27, 43, 5, 49, 33, 9, 42, 19, 29, 28, 14,
                   39, 12, 38, 41, 13, 37, 48, 7, 16, 24, 55, 40, 61, 26, 17, 0, 1, 60, 51, 30, 4, 22, 25, 54, 21, 56, 59,
                   6, 63, 57, 62, 11, 36, 20, 34, 44, 52]

          def log(msg):
              print(msg, flush=True)

          def die(msg):
              print(f"::error::{msg}", flush=True)
              sys.exit(1)

          def load_cookies():
              jar = {}
              p = WORK / "cookies.txt"
              if not p.exists():
                  return jar
              for line in p.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("#HttpOnly_"):
                      line = line[len("#HttpOnly_"):]
                  elif line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) >= 7:
                      jar[parts[5]] = parts[6]
              return jar

          def new_session():
              s = requests.Session()
              s.headers.update(HEADERS)
              for k, v in load_cookies().items():
                  s.cookies.set(k, v, domain=".bilibili.com")
              return s

          def get_json(s, url, params=None, tries=4):
              last = None
              for i in range(tries):
                  try:
                      r = s.get(url, params=params, timeout=30)
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last = e
                      time.sleep(2 * (i + 1))
              raise RuntimeError(f"GET {url} that bai: {last!r}")

          def wbi_sign(s, params):
              j = get_json(s, "https://api.bilibili.com/x/web-interface/nav")
              img = j["data"]["wbi_img"]
              img_key = img["img_url"].rsplit("/", 1)[1].split(".")[0]
              sub_key = img["sub_url"].rsplit("/", 1)[1].split(".")[0]
              raw = img_key + sub_key
              mixin = "".join(raw[i] for i in MIXIN)[:32]
              p = dict(params)
              p["wts"] = int(time.time())
              p = {k: "".join(c for c in str(v) if c not in "!'()*") for k, v in sorted(p.items())}
              q = urllib.parse.urlencode(p)
              p["w_rid"] = hashlib.md5((q + mixin).encode()).hexdigest()
              return p

          def list_subtitles(s, bvid, cid):
              for kind in ("v2", "wbi"):
                  try:
                      if kind == "v2":
                          j = get_json(s, "https://api.bilibili.com/x/player/v2", {"bvid": bvid, "cid": cid})
                      else:
                          j = get_json(s, "https://api.bilibili.com/x/player/wbi/v2", wbi_sign(s, {"bvid": bvid, "cid": cid}))
                  except Exception as e:
                      log(f"[BILI-SUB] api {kind} loi: {e!r}")
                      continue
                  if j.get("code") != 0:
                      log(f"[BILI-SUB] api {kind}: code={j.get('code')} msg={j.get('message')}")
                      continue
                  d = j.get("data") or {}
                  subs = (d.get("subtitle") or {}).get("subtitles") or []
                  log(f"[BILI-SUB] api {kind}: {len(subs)} sub | login={d.get('login_mid')} "
                      f"need_login_subtitle={d.get('need_login_subtitle')}")
                  for x in subs:
                      log(f"[BILI-SUB]   lan={x.get('lan')} doc={x.get('lan_doc')} ai_type={x.get('ai_type')}")
                  if subs:
                      return subs
              return []

          def pick_sub(subs):
              best, best_rank = None, 999
              for x in subs:
                  lan = str(x.get("lan") or "")
                  if not x.get("subtitle_url"):
                      continue
                  if lan in LAN_PREF:
                      rank = LAN_PREF.index(lan)
                  elif lan.startswith("zh"):
                      rank = 50
                  elif lan.startswith("ai-zh"):
                      rank = 60
                  else:
                      continue
                  if rank < best_rank:
                      best, best_rank = x, rank
              return best

          def download_body(url):
              if url.startswith("//"):
                  url = "https:" + url
              elif url.startswith("http://"):
                  url = "https://" + url[7:]
              last = None
              for i in range(4):
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=30)
                      r.raise_for_status()
                      return r.json().get("body") or []
                  except Exception as e:
                      last = e
                      time.sleep(2 * (i + 1))
              raise RuntimeError(f"tai sub that bai: {last!r}")

          def main():
              OUT.unlink(missing_ok=True)
              url = os.environ["VIDEO_URL"]
              m = re.search(r"/video/(BV[0-9A-Za-z]+)", url)
              if not m:
                  die("Khong tach duoc BV id tu link")
              bvid = m.group(1)
              q = urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
              try:
                  p = int((q.get("p") or ["1"])[0] or 1)
              except ValueError:
                  p = 1
              s = new_session()
              j = get_json(s, "https://api.bilibili.com/x/web-interface/view", {"bvid": bvid})
              if j.get("code") != 0:
                  die(f"Bili view api loi: code={j.get('code')} msg={j.get('message')}")
              data = j["data"]
              pages = data.get("pages") or []
              cid = pages[p - 1]["cid"] if 1 <= p <= len(pages) else data["cid"]
              log(f"[BILI-SUB] {bvid} p={p} cid={cid} ({len(pages)} phan)")
              subs = list_subtitles(s, bvid, cid)
              sub = pick_sub(subs)
              if not sub:
                  die("Video nay KHONG co sub tieng Trung tren Bili (hoac cookie het han/khong dang nhap -> khong thay sub).")
              body = download_body(sub["subtitle_url"])
              cues = []
              for it in body:
                  try:
                      cues.append({"from": float(it["from"]), "to": float(it["to"]),
                                   "content": str(it.get("content") or "")})
                  except Exception:
                      pass
              if len(cues) < 3:
                  die(f"Sub Bili qua it cue ({len(cues)})")
              cues.sort(key=lambda c: (c["from"], c["to"]))
              OUT.write_text(json.dumps({"lan": sub.get("lan"), "bvid": bvid, "cid": cid, "cues": cues},
                                        ensure_ascii=False) + "\n", encoding="utf-8")
              log(f"[BILI-SUB] OK lan={sub.get('lan')}: {len(cues)} cue, {cues[0]['from']:.1f}s .. {cues[-1]['to']:.1f}s")
              for c in cues[:5]:
                  log(f"[BILI-SUB]   {c['from']:.2f}-{c['to']:.2f} {c['content']}")

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  die(f"Loi khi lay sub Bili: {e!r}")
          PY

          cat > bili_sub.py <<'PY'
          """
          Cho 1 ep: cat sub Bili (work/bili_sub.json) theo moc cat cua ep, dich ve thoi gian cua file ep,
          KIEM TRA DON GIAN (khong OCR, khong doc hinh) roi ghi <WORK_DIR>/native.srt.
          Dieu kien dat:
            1) Co >= MIN_CUES cue nam trong khoang cua ep.
            2) Cue hop le (end > start) >= 80%.
            3) >= MIN_CJK_RATIO cue trong ep co chu Han (la sub tieng Trung that).
            4) Sub khong dai vuot qua video: voi video KHONG cat ep, cue cuoi <= do dai video + MAX_END_OVER giay.
            5) Sub phu du: khoang tu cue dau -> cue cuoi >= MIN_SPAN_RATIO do dai ep.
            6) Mat do cue >= MIN_CUES_PER_MIN cue/phut.
          Khong dat -> exit 1 (ep nay that bai, cac ep khac van chay).
          Bien moi truong: VIDEO, WORK_DIR, EP_SLUG.
          """
          import json, os, re, subprocess, sys
          from pathlib import Path

          VIDEO = os.environ["VIDEO"]
          WORK = Path(os.environ["WORK_DIR"])
          EP_SLUG = os.environ.get("EP_SLUG", "")
          SRC = Path("work/bili_sub.json")

          MIN_CUES = 5
          MIN_VALID_RATIO = 0.80
          MIN_CJK_RATIO = 0.70
          MAX_END_OVER = 10.0
          MIN_SPAN_RATIO = 0.30
          MIN_CUES_PER_MIN = 0.5

          def log(msg):
              print(msg, flush=True)

          def fail(msg):
              print(f"::error::[{EP_SLUG}] Sub Bili khong dat dieu kien: {msg}", flush=True)
              sys.exit(1)

          def cjk_n(t):
              return sum("\u4e00" <= ch <= "\u9fff" for ch in t)

          def clean(raw):
              t = (raw or "").replace("\\N", " ").replace("\n", " ")
              t = re.sub(r"\{[^}]*\}", "", t)
              t = re.sub(r"<[^>]+>", "", t)
              return re.sub(r"\s+", " ", t).strip()

          def stamp(seconds):
              ms = max(0, round(seconds * 1000))
              hh, ms = divmod(ms, 3600000)
              mm, ms = divmod(ms, 60000)
              ss, ms = divmod(ms, 1000)
              return f"{hh:02}:{mm:02}:{ss:02},{ms:03}"

          def probe_duration():
              out = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                    "-of", "default=nw=1:nk=1", VIDEO],
                                   stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True).stdout.strip()
              return float(out)

          def main():
              if not SRC.exists():
                  fail("khong co work/bili_sub.json")
              data = json.loads(SRC.read_text(encoding="utf-8"))
              all_cues = data["cues"]
              dur = probe_duration()
              t0, t1 = 0.0, dur
              ep_file, plan_file = Path("work/eps.json"), Path("work/plan.json")
              split = False
              if plan_file.exists():
                  split = bool(json.loads(plan_file.read_text(encoding="utf-8")).get("split"))
              if ep_file.exists():
                  for e in json.loads(ep_file.read_text(encoding="utf-8")):
                      if e["slug"] == EP_SLUG:
                          t0, t1 = float(e["start"]), float(e["end"])
              log(f"[BILI-SUB] ep={EP_SLUG} lan={data.get('lan')} | cat goc {t0:.1f}s..{t1:.1f}s | video ep dai {dur:.1f}s | "
                  f"tong {len(all_cues)} cue (cua ca video)")

              # (4) video khong cat ep: sub khong duoc dai hon video qua nhieu
              last_all = max(float(c["to"]) for c in all_cues)
              if not split and last_all > dur + MAX_END_OVER:
                  fail(f"cue cuoi ket thuc luc {last_all:.1f}s, vuot do dai video {dur:.1f}s (sub khac ban?)")

              inside, bad = [], 0
              for c in all_cues:
                  s, e = float(c["from"]), float(c["to"])
                  if e <= t0 or s >= t1:
                      continue
                  if e <= s:
                      bad += 1
                      continue
                  s, e = max(s, t0) - t0, min(e, t1) - t0
                  if e - s < 0.05:
                      continue
                  inside.append({"s": s, "e": min(e, dur), "text": clean(c["content"])})
              total = len(inside) + bad
              log(f"[BILI-SUB] cue trong ep: {len(inside)} (cue loi thoi gian: {bad})")

              # (1)
              if len(inside) < MIN_CUES:
                  fail(f"chi co {len(inside)} cue trong khoang ep (can >= {MIN_CUES})")
              # (2)
              if len(inside) / float(total) < MIN_VALID_RATIO:
                  fail(f"qua nhieu cue loi thoi gian ({bad}/{total})")
              # (3)
              good = [c for c in inside if cjk_n(c["text"]) >= 2]
              ratio = len(good) / float(len(inside))
              if ratio < MIN_CJK_RATIO:
                  fail(f"chi {ratio * 100:.0f}% cue co chu Han (can >= {MIN_CJK_RATIO * 100:.0f}%) - khong phai sub tieng Trung?")
              good.sort(key=lambda c: (c["s"], c["e"]))
              # (5)
              span = good[-1]["e"] - good[0]["s"]
              if span < MIN_SPAN_RATIO * dur:
                  fail(f"sub chi phu {span:.0f}s / {dur:.0f}s ({span / dur * 100:.0f}%, can >= {MIN_SPAN_RATIO * 100:.0f}%)")
              # (6)
              density = len(good) / (dur / 60.0)
              if density < MIN_CUES_PER_MIN:
                  fail(f"mat do cue qua thua: {density:.2f} cue/phut (can >= {MIN_CUES_PER_MIN})")

              with (WORK / "native.srt").open("w", encoding="utf-8") as f:
                  for i, c in enumerate(good, 1):
                      f.write(f"{i}\n{stamp(c['s'])} --> {stamp(c['e'])}\n{c['text']}\n\n")
              log(f"[BILI-SUB] DAT: {len(good)} cue, phu {span:.0f}s/{dur:.0f}s ({span / dur * 100:.0f}%), "
                  f"{density:.1f} cue/phut, {ratio * 100:.0f}% co chu Han -> native.srt")

          if __name__ == "__main__":
              main()
          PY

      - name: Fetch Bilibili Chinese subtitle (stop early if none)
        env:
          VIDEO_URL: ${{ steps.plan.outputs.clean_url }}
        run: |
          set -euo pipefail
          python3 bili_sub_fetch.py
          echo "Sub Bili: $(jq -r '.lan' work/bili_sub.json), $(jq '.cues | length' work/bili_sub.json) cue"

      - name: Download Bilibili video
        timeout-minutes: 180
        env:
          VIDEO_URL: ${{ steps.plan.outputs.clean_url }}
          MAX_ATTEMPTS: "40"
        run: |
          set -uo pipefail
          BILIBILI_URL="$VIDEO_URL"
          echo "Tai: $BILIBILI_URL"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          COMMON=(
            --cookies work/cookies.txt --no-playlist
            --continue --no-overwrites
            --extractor-retries 3 --fragment-retries 5 --retries 3 --socket-timeout 30
            --throttled-rate 200K --extractor-retries 10
            --add-header "User-Agent: $UA"
            --add-header "Referer: https://www.bilibili.com/"
            --add-header "Origin: https://www.bilibili.com"
            -f "bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b"
            -S "res,codec:avc1:h264,ext:mp4:m4a"
            --merge-output-format mp4
            -o "raw_video.mp4"
          )
          show_status() {
            echo "--- Trạng thái file đã tải ---"
            ls -lh raw_video* 2>/dev/null || echo "(chưa có file nào)"
            echo "------------------------------"
          }
          # Kiểm tra file cuối có hợp lệ không (không bị cụt / hỏng)
          valid_video() {
            [ -s raw_video.mp4 ] || return 1
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4 2>/dev/null)
            [ -n "$d" ] && [ "$d" != "N/A" ]
          }
          ok=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== attempt $attempt/$MAX_ATTEMPTS: yt-dlp native (resume) ==="
            show_status
            if yt-dlp "${COMMON[@]}" "$BILIBILI_URL"; then
              if valid_video; then
                ok=1; break
              fi
              echo "::warning::File ghép xong nhưng không hợp lệ, xóa file ghép và thử lại."
              rm -f raw_video.mp4
            fi
            echo "::warning::Attempt $attempt thất bại, giữ lại phần đã tải để tải tiếp."
            [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep $(( attempt * 8 > 60 ? 60 : attempt * 8 ))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Khong tai duoc video Bilibili sau $MAX_ATTEMPTS lan thu (CDN tu choi IP runner)."
            show_status
            exit 1
          fi
          ls -lh raw_video.mp4
          echo "duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_video.mp4)"

      # ============================================================
      # CẮT VIDEO THEO EP (nếu URL có epN-start/epN-end), dùng -c copy.
      # Mốc cắt được dời về KEYFRAME gần nhất -> không lỗi frame.
      # Mốc end của ep trước & start của ep sau sát nhau (<=2s) -> dùng chung 1 điểm cắt.
      # Kết quả: work/eps/<slug>/raw_video.mp4 + work/eps.json
      # ============================================================
      - name: Create split script
        run: |
          cat > split_video.py <<'PY'
          """
          Doc work/plan.json, cat raw_video.mp4 thanh tung ep (stream copy, can keyframe).
          Khong co ep nao -> chi chuyen file vao work/eps/<slug>/raw_video.mp4.
          Ghi work/eps.json: [ {n, slug, dir, video, start, end, duration} ]
          """
          import json, shutil, subprocess, sys
          from pathlib import Path

          VIDEO = Path("raw_video.mp4")
          WORK = Path("work")
          SHARE_GAP = 2.0       # end ep truoc ~ start ep sau (<= N giay) -> dung chung 1 diem cat
          MIN_EP_SECONDS = 1.0

          def log(msg):
              print(msg, flush=True)

          def fail(msg):
              print(f"::error::{msg}", flush=True)
              sys.exit(1)

          def probe_duration(path):
              out = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=nw=1:nk=1", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True).stdout.strip()
              try:
                  return float(out)
              except ValueError:
                  return None

          def keyframes_near(t):
              """Liet ke thoi diem cac keyframe quanh t (doc packet flags, khong decode -> rat nhanh)."""
              for radius in (30, 120, 600):
                  lo, hi = max(0.0, t - radius), t + radius
                  out = subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                       "-read_intervals", f"{lo:.3f}%{hi:.3f}",
                       "-show_entries", "packet=pts_time,flags", "-of", "csv=p=0", str(VIDEO)],
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True).stdout
                  ks = []
                  for line in out.splitlines():
                      parts = line.strip().split(",")
                      if len(parts) >= 2 and parts[0] not in ("", "N/A") and "K" in parts[1]:
                          try:
                              ks.append(float(parts[0]))
                          except ValueError:
                              pass
                  if ks:
                      return sorted(ks)
              return []

          def main():
              plan = json.loads((WORK / "plan.json").read_text(encoding="utf-8"))
              eps = plan["eps"]
              dur = probe_duration(VIDEO)
              if not dur:
                  fail("Khong doc duoc do dai raw_video.mp4")
              log(f"[SPLIT] video dai {dur:.3f}s | split={plan['split']} | {len(eps)} ep")
              result = []

              if not plan["split"]:
                  ep = eps[0]
                  d = WORK / "eps" / ep["slug"]
                  d.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(VIDEO), str(d / "raw_video.mp4"))
                  result.append({"n": ep["n"], "slug": ep["slug"], "dir": str(d),
                                 "video": str(d / "raw_video.mp4"), "start": 0.0, "end": dur, "duration": dur})
                  (WORK / "eps.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  log("[SPLIT] khong co epN-start/epN-end -> lay toan bo video")
                  return

              def snap(t):
                  if t <= 0.05:
                      return 0.0
                  if t >= dur - 0.05:
                      return dur
                  ks = keyframes_near(t)
                  if not ks:
                      fail(f"Khong tim thay keyframe nao quanh {t:.1f}s")
                  return min(ks, key=lambda k: abs(k - t))

              # --- 1) mốc yeu cau (da kep vao do dai video) ---
              req_s, req_e = [], []
              for ep in eps:
                  s = float(ep["start"] or 0.0)
                  e = ep["end"]
                  if s >= dur - 0.5:
                      fail(f"ep{ep['n']}: start={s:.1f}s vuot qua do dai video ({dur:.1f}s)")
                  if e is None or e >= dur - 0.5:
                      if e is not None:
                          log(f"::warning::ep{ep['n']}: end={e:.1f}s >= do dai video ({dur:.1f}s) -> cat den het video")
                      e = dur
                  req_s.append(s)
                  req_e.append(float(e))

              # --- 2) can keyframe (diem cat chung cho 2 ep sat nhau) ---
              n = len(eps)
              S = [None] * n
              E = [None] * n
              for i in range(n):
                  if S[i] is None:
                      S[i] = snap(req_s[i])
                  if i + 1 < n and abs(req_s[i + 1] - req_e[i]) <= SHARE_GAP:
                      c = snap(req_s[i + 1])
                      E[i] = c
                      S[i + 1] = c
                  else:
                      E[i] = snap(req_e[i])

              # --- 3) cat bang stream copy ---
              for i, ep in enumerate(eps):
                  s, e = S[i], E[i]
                  if e - s < MIN_EP_SECONDS:
                      fail(f"ep{ep['n']}: doan sau khi can keyframe qua ngan ({s:.2f}s -> {e:.2f}s)")
                  d = WORK / "eps" / ep["slug"]
                  d.mkdir(parents=True, exist_ok=True)
                  out = d / "raw_video.mp4"
                  log(f"[SPLIT] ep{ep['n']} ({ep['slug']}): yeu cau {req_s[i]:.2f}s -> {req_e[i]:.2f}s | "
                      f"keyframe {s:.3f}s -> {e:.3f}s (lech {s - req_s[i]:+.2f}s / {e - req_e[i]:+.2f}s)")
                  cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                         "-ss", f"{s + 0.001:.3f}" if s > 0 else "0", "-i", str(VIDEO)]
                  if e < dur - 0.01:
                      cmd += ["-t", f"{e - s - 0.003:.3f}"]
                  cmd += ["-map", "0:v:0", "-map", "0:a?", "-c", "copy",
                          "-avoid_negative_ts", "make_zero", "-movflags", "+faststart", str(out)]
                  r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if r.returncode != 0 or not out.exists() or out.stat().st_size == 0:
                      fail(f"ffmpeg cat ep{ep['n']} that bai: {r.stderr[-500:]}")
                  od = probe_duration(out)
                  if not od:
                      fail(f"ep{ep['n']}: file cat ra khong doc duoc do dai")
                  if abs(od - (e - s)) > 3.0:
                      log(f"::warning::ep{ep['n']}: do dai thuc te {od:.2f}s lech so voi du kien {e - s:.2f}s")
                  chk = subprocess.run(
                      ["ffmpeg", "-v", "error", "-i", str(out), "-t", "20", "-f", "null", "-"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if chk.stderr.strip():
                      log(f"::warning::ep{ep['n']}: decode thu 20s dau co canh bao: {chk.stderr.strip()[:300]}")
                  log(f"[SPLIT] ep{ep['n']} OK: {od:.2f}s, {out.stat().st_size // 1048576} MB -> {out}")
                  result.append({"n": ep["n"], "slug": ep["slug"], "dir": str(d), "video": str(out),
                                 "start": s, "end": e, "duration": od})

              VIDEO.unlink()  # giai phong dia, ban goc khong can nua
              (WORK / "eps.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              log(f"[SPLIT] xong {len(result)} ep -> work/eps.json")

          if __name__ == "__main__":
              main()
          PY

      - name: Split video by episode (stream copy, keyframe-aligned)
        run: |
          set -euo pipefail
          python3 split_video.py
          cat work/eps.json
          ls -lh work/eps/*/raw_video.mp4

      # ============================================================
      # PIXELDRAIN UPLOAD HELPER: bash pd_upload.sh <file> <ten-tren-pixeldrain> -> in ra ID (stdout)
      # ============================================================
      - name: Create Pixeldrain upload helper
        run: |
          cat > pd_upload.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          FILE="$1"
          NAME="$2"
          : "${PD_KEY:?Missing PD_KEY}"
          SIZE=$(stat -c %s "$FILE")
          echo "FILE: $NAME = $((SIZE / 1048576)) MB ($SIZE bytes)" >&2
          TMP=$(mktemp)
          ID=""
          MAX=6
          for attempt in $(seq 1 "$MAX"); do
            echo "[UP] Pixeldrain attempt $attempt/$MAX" >&2
            rm -f "$TMP"
            code=$(curl -sS -T "$FILE" -u ":$PD_KEY" \
              -o "$TMP" -w "%{http_code}" \
              "https://pixeldrain.com/api/file/${NAME}" || true)
            echo "HTTP $code: $(head -c 300 "$TMP" 2>/dev/null || true)" >&2
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              ID=$(jq -r '.id // empty' "$TMP")
              if [ -n "$ID" ]; then break; fi
            fi
            case "$code" in
              401|403|413|422)
                echo "::error::Pixeldrain từ chối (HTTP $code), không thử lại: $(head -c 300 "$TMP" 2>/dev/null || true)" >&2
                exit 1 ;;
            esac
            if [ "$attempt" -lt "$MAX" ]; then sleep $(( attempt * 10 )); fi
          done
          [ -n "$ID" ] || { echo '::error::Upload Pixeldrain thất bại sau nhiều lần thử' >&2; exit 1; }
          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://pixeldrain.com/api/file/${ID}/info")
          remote_size=$(jq -r '.size' <<<"$info")
          echo "Pixeldrain ID=$ID | size=$remote_size (local=$SIZE)" >&2
          [ "$remote_size" = "$SIZE" ] || { echo '::error::Size trên Pixeldrain không khớp file local' >&2; exit 1; }
          echo "$ID"
          SH

      # ============================================================
      # UPLOAD RAW từng ep lên Pixeldrain với tên {slug}-RAW.mp4
      # ============================================================
      - name: Upload RAW videos to Pixeldrain (one per episode)
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          for ep_slug in $(jq -r '.[].slug' work/eps.json); do
            echo "::group::RAW upload ${ep_slug}"
            id=$(bash pd_upload.sh "work/eps/${ep_slug}/raw_video.mp4" "${ep_slug}-RAW.mp4")
            [ -n "$id" ] || { echo "::error::Không có RAW ID cho ${ep_slug}"; exit 1; }
            printf '%s' "$id" > "work/eps/${ep_slug}/raw_id.txt"
            echo "RAW Link ${ep_slug}: https://pixeldrain.com/u/${id}"
            echo "::endgroup::"
          done

      # ============================================================
      # DỊCH: dọn sub Trung -> Gemini -> không bao giờ fallback tiếng Trung
      # ============================================================
      - name: Create Translate script
        run: |
          cat > translate_native.py <<'PY'
          """
          Doc sub goc (<WORK_DIR>/native.srt, tieng Trung) -> DON SACH sub Trung (gop cue trung/gan giong,
          bo rac) -> dich sang tieng Viet bang Gemini (gioi han ky tu ngay trong prompt).
          Moi lan goi API random 1 model + 1 key.
          Loi server (500/503/504/timeout): retry toi da 20 lan, moi lan cach 90s.
          Loi limit (429): doi model/key, cho 90s.
          Dong sot / con chu Han KHONG retry ngay, gom lai het roi dich lai 1 luot o cuoi.
          Dong AI tra "..." (rac khong doc duoc) = BO TRONG, KHONG BAO GIO giu lai tieng Trung.
          Ket qua: <WORK_DIR>/vi_raw.json (start, end, text, vi). Buoc finalize_vi.py se lam sach hoan toan.
          """
          import os, re, time, random, json
          from difflib import SequenceMatcher
          from pathlib import Path
          import pysubs2
          from google import genai
          from google.genai import types
          WORK = Path(os.environ.get("WORK_DIR", "work"))
          NATIVE_SRT = WORK / "native.srt"
          MIN_CUE_DURATION = 0.10
          ZH_MERGE_GAP = 1.5
          ZH_MERGE_SIM = 0.55
          CJK_RE = re.compile(r"[\u2e80-\u2fdf\u3000-\u30ff\u3100-\u31ff\u3200-\u32ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]")
          # ---- GEMINI ----
          GEMINI_MODELS = [
              "gemini-3.1-flash-lite",
              "gemini-3.5-flash-lite",
          ]
          GEMINI_BATCH_SIZE = 200
          GEMINI_MAX_RETRIES = 10     # dung cho loi limit (429) va loi khac (404/400/401/403)
          SERVER_MAX_RETRIES = 20     # dung cho loi server (500/503/504/timeout)
          SERVER_RETRY_WAIT = 90      # giay cho giua 2 lan retry khi loi server
          LIMIT_RETRY_WAIT = 90       # giay cho giua 2 lan retry khi loi limit (429)
          MAX_CHARS_PER_LINE = 60     # gioi han so ky tu (tinh ca dau cach) cho moi dong tieng Viet
          RAW_GEMINI_KEYS = os.environ.get("GEMINI_API_KEYS", "")
          GEMINI_API_KEYS = [k.strip() for k in RAW_GEMINI_KEYS.strip().splitlines() if k.strip()]
          SYSTEM_INSTRUCTION = (
              "You are a professional video subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty, unreadable garbage, or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context of the whole video.\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text.\n"
              "6. PRONOUN SAFETY (VERY IMPORTANT): The source is Chinese, where family/relationship terms "
              "(mother, older brother, uncle, etc.) are usually explicit in the dialogue itself. When translating "
              "to Vietnamese, ALWAYS use the correct relational pronoun based on the clear relationship stated or "
              "implied (mẹ/con, anh/em, cô/cháu, etc.) — never swap the roles.\n"
              "7. If the relationship between speaker and listener is AMBIGUOUS or CANNOT be determined from the "
              "given line alone, DO NOT guess a specific relational pronoun. Instead, rephrase the sentence to be "
              "SHORTER and more NEUTRAL — using no pronoun, an implied subject, or a generic/neutral phrasing — "
              "so the sentence still sounds natural in Vietnamese without committing to an incorrect relationship.\n"
              "8. The source subtitles may come from an automatic (AI) subtitle track and may contain "
              "recognition errors, wrong or missing characters and homophone mistakes. Use the surrounding context to infer the "
              "intended meaning. If a line is so corrupted that you cannot recover a sensible meaning, output '...' for it.\n"
              "9. CONCISENESS (VERY IMPORTANT): Make every Vietnamese line SHORT, concise and easy to understand at a "
              "glance. Use simple, everyday spoken Vietnamese. Cut filler words, repeated phrases and unnecessary "
              "modifiers, and prefer short sentences. Keep the core meaning and the tone, but never pad or explain. "
              f"HARD LIMIT: every Vietnamese line MUST be at most {MAX_CHARS_PER_LINE} characters long (spaces included). "
              "If the source line is long, compress the meaning to fit the limit instead of exceeding it.\n"
              "10. The output must be PURE VIETNAMESE. NEVER output Chinese characters, pinyin or any other language."
          )
          def log(msg):
              print(msg, flush=True)
          def has_cjk(t):
              return bool(CJK_RE.search(t or ""))
          def cjk_n(t):
              return sum("\u4e00" <= ch <= "\u9fff" for ch in t)
          def norm_zh(t):
              return re.sub(r"[^\u4e00-\u9fffA-Za-z0-9]", "", t)
          def similar_zh(a, b):
              a, b = norm_zh(a), norm_zh(b)
              if not a or not b:
                  return False
              if min(len(a), len(b)) >= 3 and (a in b or b in a):
                  return True
              need = ZH_MERGE_SIM if min(len(a), len(b)) >= 6 else 0.75
              return SequenceMatcher(None, a, b).ratio() >= need
          def clean_text(raw):
              t = raw.replace("\\N", " ").replace("\\n", " ").replace("\n", " ")
              t = re.sub(r"\{[^}]*\}", "", t)
              t = re.sub(r"<[^>]+>", "", t)
              t = re.sub(r"\s+", " ", t).strip()
              return t
          def load_native_cues():
              if not NATIVE_SRT.exists():
                  raise RuntimeError(f"Khong tim thay {NATIVE_SRT}")
              subs = pysubs2.load(str(NATIVE_SRT), encoding="utf-8")
              raw = []
              for ev in subs.events:
                  text = clean_text(ev.text)
                  if not text:
                      continue
                  raw.append({"start": ev.start / 1000.0, "end": ev.end / 1000.0, "text": text})
              raw.sort(key=lambda c: (c["start"], c["end"]))
              final = []
              for c in raw:
                  st, en = c["start"], c["end"]
                  if final and st < final[-1]["end"]:
                      if st > final[-1]["start"]:
                          mid = (st + final[-1]["end"]) / 2.0
                          mid = min(mid, st)
                          final[-1]["end"] = max(final[-1]["start"] + 0.01, mid)
                      else:
                          st = final[-1]["end"]
                  if en - st < MIN_CUE_DURATION:
                      continue
                  final.append({"start": st, "end": en, "text": c["text"]})
              log(f"CHINESE CUES (native sub, tho) = {len(final)}")
              if not final:
                  raise RuntimeError("Sub goc khong co cue nao hop le.")
              return final
          def clean_zh_cues(cues):
              """Bo cue khong co chu Han, gop cue gan nhau co chu gan giong."""
              kept = [c for c in cues if cjk_n(c["text"]) >= 2]
              dropped = len(cues) - len(kept)
              out, merged = [], 0
              for c in kept:
                  if out:
                      p = out[-1]
                      if c["start"] - p["end"] <= ZH_MERGE_GAP and similar_zh(p["text"], c["text"]):
                          p["end"] = max(p["end"], c["end"])
                          if len(norm_zh(c["text"])) > len(norm_zh(p["text"])) * 1.15:
                              p["text"] = c["text"]
                          merged += 1
                          continue
                  out.append(dict(c))
              log(f"CLEAN ZH: bo {dropped} cue khong co chu Han, gop {merged} cue trung/gan giong -> con {len(out)} cue")
              if not out:
                  raise RuntimeError("Sau khi don sach khong con cue nao.")
              return out
          def get_random_gemini_client():
              key = random.choice(GEMINI_API_KEYS)
              model = random.choice(GEMINI_MODELS)
              return genai.Client(api_key=key), key, model
          def classify_error(e):
              """Tra ve (nhan, kind). kind: 'server' | 'limit' | 'fatal'."""
              msg = str(e)
              code = getattr(e, "code", None)
              if code is None:
                  m = re.search(r"\b([45]\d\d)\b", msg)
                  code = int(m.group(1)) if m else None
              low = msg.lower()
              if code == 429 or "RESOURCE_EXHAUSTED" in msg:
                  if "perday" in low or "per day" in low:
                      return "LIMIT HET QUOTA NGAY (429)", "limit"
                  if "perminute" in low or "per minute" in low:
                      return "LIMIT THEO PHUT (429) - RPM/TPM cua project", "limit"
                  return "LIMIT (429) - vuot han muc cua project/model", "limit"
              if code == 503 or "UNAVAILABLE" in msg:
                  return "SERVER QUA TAI (503) - phia Google, KHONG phai limit cua ban", "server"
              if code == 500 or "INTERNAL" in msg:
                  return "SERVER LOI NOI BO (500) - phia Google", "server"
              if code == 504 or "DEADLINE_EXCEEDED" in msg:
                  return "SERVER TIMEOUT (504) - phia Google", "server"
              if any(w in low for w in ("timed out", "timeout", "connection", "disconnected", "reset by peer")):
                  return "LOI MANG / TIMEOUT - coi nhu loi server", "server"
              if code == 404:
                  return "MODEL KHONG TON TAI (404) - kiem tra lai ten model", "fatal"
              if code in (401, 403) or "API_KEY_INVALID" in msg or "PERMISSION_DENIED" in msg:
                  return f"KEY SAI/KHONG CO QUYEN ({code})", "fatal"
              if code == 400:
                  return "REQUEST SAI (400)", "fatal"
              return f"LOI KHAC ({code})", "fatal"
          def call_gemini_with_retry(prompt_text):
              server_fails = 0
              other_fails = 0
              attempt = 0
              while True:
                  attempt += 1
                  client, key, model = get_random_gemini_client()
                  kno = GEMINI_API_KEYS.index(key) + 1
                  log(f">> GUI GEMINI - Lan {attempt} (loi server {server_fails}/{SERVER_MAX_RETRIES}, "
                      f"loi khac {other_fails}/{GEMINI_MAX_RETRIES}) | Model {model} | Key #{kno} | {time.strftime('%H:%M:%S')}")
                  t0 = time.time()
                  try:
                      response = client.models.generate_content(
                          model=model,
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=SYSTEM_INSTRUCTION,
                              temperature=0.3,
                          )
                      )
                      log(f"<< NHAN KET QUA ({model}) - Thanh cong sau {time.time() - t0:.1f}s")
                      return response.text
                  except Exception as e:
                      label, kind = classify_error(e)
                      log(f"<< LOI [{label}] | Model {model} | Key #{kno} | sau {time.time() - t0:.1f}s")
                      log(f"   Chi tiet: {str(e)[:300]}")
                      if kind == "server":
                          server_fails += 1
                          if server_fails >= SERVER_MAX_RETRIES:
                              log(f"   Het {SERVER_MAX_RETRIES} lan retry loi server. Bo cuoc.")
                              return None
                          log(f"   Loi server, thu lai lan {server_fails + 1}/{SERVER_MAX_RETRIES} sau {SERVER_RETRY_WAIT}s (model/key random lai)...")
                          time.sleep(SERVER_RETRY_WAIT)
                      elif kind == "limit":
                          other_fails += 1
                          if other_fails >= GEMINI_MAX_RETRIES:
                              log(f"   Het {GEMINI_MAX_RETRIES} lan retry loi limit/khac. Bo cuoc.")
                              return None
                          log(f"   Limit, doi model/key khac va cho {LIMIT_RETRY_WAIT}s...")
                          time.sleep(LIMIT_RETRY_WAIT)
                      else:
                          other_fails += 1
                          if other_fails >= GEMINI_MAX_RETRIES:
                              log(f"   Het {GEMINI_MAX_RETRIES} lan retry loi khac. Bo cuoc.")
                              return None
                          log("   Loi khong the cho de khac phuc. Doi model/key khac thu lai ngay.")
          def parse_translated(response_text):
              out = {}
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          head, val = line.split("]", 1)
                          val = val.strip()
                          idx = int(head.replace("[", "").split("|")[0].strip())
                          out[idx] = "" if val == "..." else val
                      except Exception:
                          pass
              return out
          def parse_pairs(response_text):
              pairs = []
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          head, val = line.split("]", 1)
                          idx = int(head.replace("[", "").split("|")[0].strip())
                          pairs.append((idx, val.strip()))
                      except Exception:
                          pass
              return pairs
          def parse_batch(response_text, n):
              """Ghep theo SO THU TU AI ghi. Dong sot -> KHONG co trong dict (se dich lai o cuoi).
              Dong AI chu dong tra '...' -> co trong dict voi gia tri '' (= bo trong, KHONG dich lai)."""
              pairs = parse_pairs(response_text)
              out = {}
              in_range = sum(1 for i, _ in pairs if 0 <= i < n)
              if len(pairs) == n and in_range < n * 0.5:
                  log(">> SUA SO THU TU: AI ghi sai so hang loat, ghep theo vi tri")
                  for k, (_, val) in enumerate(pairs):
                      out[k] = "" if val == "..." else val
                  return out
              prev = -1
              for k, (i, val) in enumerate(pairs):
                  nxt_i = pairs[k + 1][0] if k + 1 < len(pairs) else None
                  if prev < i < n:
                      idx = i
                  else:
                      expected = prev + 1
                      if expected < n and expected not in out and (nxt_i is None or nxt_i == expected + 1):
                          log(f">> SUA SO THU TU: AI ghi [{i}], dat vao [{expected}]")
                          idx = expected
                      else:
                          log(f">> BO QUA dong thua/trung/sai so [{i}]: {val[:40]!r}")
                          continue
                  out[idx] = "" if val == "..." else val
                  prev = idx
              return out
          def translate_cues(cues):
              if not GEMINI_API_KEYS:
                  raise RuntimeError("Chua cau hinh GEMINI_API_KEYS trong GitHub Secrets.")
              total = len(cues)
              total_batches = (total + GEMINI_BATCH_SIZE - 1) // GEMINI_BATCH_SIZE
              log(f"BAT DAU DICH - {total} dong / {total_batches} batch")
              # vi = None nghia la CHUA DICH DUOC (sot hoac con chu Han) -> se dich lai 1 luot o cuoi
              results = []
              # ---------- LUOT 1: dich tung batch, KHONG retry dong sot ----------
              for i in range(0, total, GEMINI_BATCH_SIZE):
                  batch = cues[i:i + GEMINI_BATCH_SIZE]
                  bn = i // GEMINI_BATCH_SIZE + 1
                  log(f"[BATCH {bn}/{total_batches}] Dong {i + 1}-{min(i + GEMINI_BATCH_SIZE, total)}")
                  prompt_text = "".join(f"[{idx}] {c['text'].strip() or '...'}\n" for idx, c in enumerate(batch))
                  log(">> NOI DUNG GUI LEN API:")
                  for line in prompt_text.strip().split("\n"):
                      log(f"   {line}")
                  response_text = call_gemini_with_retry(prompt_text)
                  if response_text is None:
                      raise RuntimeError(f"[THAT BAI] Khong the dich batch {bn}.")
                  log(">> KET QUA DICH TU AI:")
                  for line in response_text.strip().split("\n"):
                      log(f"   {line}")
                  translated = parse_batch(response_text, len(batch))
                  n_miss = 0
                  for idx, cue in enumerate(batch):
                      vi = translated.get(idx)
                      if vi is None or has_cjk(vi):
                          vi = None
                          n_miss += 1
                      results.append({"start": cue["start"], "end": cue["end"],
                                      "text": cue["text"], "vi": vi})
                  log(f"[BATCH {bn}/{total_batches}] Hoan thanh | {n_miss} dong sot/con chu Han (se dich lai o cuoi)")
                  time.sleep(3)
              # ---------- LUOT 2: gom TAT CA dong sot, dich lai 1 luot ----------
              missing = [i for i, r in enumerate(results) if r["vi"] is None]
              log(f">> TONG KET LUOT 1: {len(missing)}/{total} dong sot -> dich lai 1 luot")
              for k in range(0, len(missing), GEMINI_BATCH_SIZE):
                  part = missing[k:k + GEMINI_BATCH_SIZE]
                  rp = "Translate ONLY these lines into pure Vietnamese (no Chinese characters). Use '...' if unreadable:\n\n"
                  rp += "".join(f"[{i}] {results[i]['text'].strip() or '...'}\n" for i in part)
                  rp += "\nOutput ONLY these lines with their exact [index] prefix."
                  rr = call_gemini_with_retry(rp)
                  if not rr:
                      log(">> LUOT 2: khong nhan duoc ket qua cho nhom nay")
                      continue
                  log(">> KET QUA DICH LAI:")
                  for line in rr.strip().split("\n"):
                      log(f"   {line}")
                  allowed = set(part)
                  for i, v in parse_translated(rr).items():
                      if i in allowed and not has_cjk(v):
                          results[i]["vi"] = v
                  time.sleep(3)
              # ---------- Dong van con sot sau luot 2 -> BO TRONG ----------
              n_still = 0
              for i, r in enumerate(results):
                  if r["vi"] is None:
                      r["vi"] = ""
                      n_still += 1
                      log(f"   [{i + 1:04d}] VAN SOT sau luot 2 -> BO TRONG: {r['text']!r}")
              n_blank = sum(1 for r in results if not r["vi"].strip())
              log(f">> Tong cong {n_blank}/{total} dong bo trong ({n_still} dong van sot, con lai la rac AI tra '...')")
              return results
          def count_syl(t):
              return len(re.findall(r"\w+", t, re.UNICODE))
          def write_debug(results):
              with open(WORK / "translation_debug.txt", "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh, vi = len(r["text"]), len(r["vi"])
                      dur = r["end"] - r["start"]
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s ({dur:.2f}s)\n")
                      f.write(f"  ZH ({zh}): {r['text']}\n")
                      f.write(f"  VI ({vi} ky tu, {count_syl(r['vi'])} tu): {r['vi']}\n\n")
          def main():
              cues = load_native_cues()
              cues = clean_zh_cues(cues)
              subs = pysubs2.SSAFile()
              for c in cues:
                  subs.events.append(pysubs2.SSAEvent(start=int(c["start"] * 1000), end=int(c["end"] * 1000), text=c["text"]))
              subs.save(str(WORK / "chinese.srt"), encoding="utf-8")
              for i, c in enumerate(cues, 1):
                  log("[%04d] %.3f -> %.3f | %s" % (i, c["start"], c["end"], c["text"]))
              translated = translate_cues(cues)
              write_debug(translated)
              (WORK / "vi_raw.json").write_text(json.dumps(translated, ensure_ascii=False, indent=1), encoding="utf-8")
              log("TRANSLATE COMPLETE -> vi_raw.json (chua hoan thien, chay finalize_vi.py)")
          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # HOÀN THIỆN SUB VIỆT (làm sạch + khử trùng + kiểm tra cứng)
      # ============================================================
      - name: Create Finalize-Vietnamese script
        run: |
          cat > finalize_vi.py <<'PY'
          """
          <WORK_DIR>/vi_raw.json -> vietnamese.srt + vietnamese.vtt (SACH).
          1) Chuan hoa: NFKC, bo tag/markdown, XOA moi ky tu Han/CJK/fullwidth. Dong co chu Han ma con lai < 3 tu -> bo.
          2) Bo dong trong / chi co dau cau / khong co chu cai.
          3) Gop cau TRUNG hoac GAN GIONG nhau trong cua so thoi gian ngan, giu ban dai hon.
          4) Sua thoi gian: sap xep, khong chong lan, end > start.
          5) Kiem tra cung: khong CJK, khong cap lien ke trung lap, co it nhat vai cue. Loi -> exit 1.
          """
          import json, os, re, sys, unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path
          WORK = Path(os.environ.get("WORK_DIR", "work"))
          CJK_RE = re.compile(r"[\u2e80-\u2fdf\u3000-\u30ff\u3100-\u31ff\u3200-\u32ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]")
          SHORT_WORDS = 4
          WIN_SHORT = 3.0
          WIN_LONG = 8.0
          SIM_THRESHOLD = 0.85
          CONTAIN_RATIO = 0.60
          LOOKBACK = 3
          MIN_FINAL_CUES = 1
          # --- Quy tắc riêng cho TTS ---
          # "vi" đứng một mình -> "vy" (giữ nguyên hoa/thường)
          VI_ALONE_RE = re.compile(r"(?<!\w)(vi)(?!\w)", re.IGNORECASE | re.UNICODE)
          # Từ chỉ gồm 1 cụm 2-4 ký tự lặp lại (hihihi, hahaha, hehe...) hoặc 1 ký tự lặp >=4 lần (aaaaa)
          REPEAT_RE = re.compile(r"(?<!\w)(?:(\w{2,4}?)\1+|(\w)\2{3,})(?!\w)", re.UNICODE)
          DASH_RE = re.compile(r"[-\u2013\u2014]")
          def log(msg):
              print(msg, flush=True)
          def _vi_to_vy(m):
              w = m.group(1)
              return "VY" if w.isupper() else ("Vy" if w[0].isupper() else "vy")
          def tts_tweaks(t):
              # 3) bỏ tiếng cười/lặp ký tự (hihihi, hahaha...). Nếu cả dòng chỉ có vậy -> rỗng -> dòng bị loại
              t = REPEAT_RE.sub(" ", t)
              # 2) bỏ dấu gạch ngang (thay bằng khoảng trắng để "anh-em" -> "anh em")
              t = DASH_RE.sub(" ", t)
              # 1) "vi" đứng một mình -> "vy"
              t = VI_ALONE_RE.sub(_vi_to_vy, t)
              return t 
          def clean_vi(text):
              t = unicodedata.normalize("NFKC", text or "")
              t = re.sub(r"\{[^}]*\}", " ", t)
              t = re.sub(r"<[^>]+>", " ", t)
              t = re.sub(r"^\s*\[\d+(\|\d+)?\]\s*", "", t)
              t = t.replace("、", ", ").replace("。", ". ")
              had_cjk = bool(CJK_RE.search(t))
              t = CJK_RE.sub(" ", t)
              t = tts_tweaks(t)
              t = t.replace("…", "...")
              t = re.sub(r"[\*_`#~^|\\<>]", " ", t)
              t = re.sub(r"\.{2,}", ".", t)
              t = re.sub(r"([,;:!?])\1+", r"\1", t)
              t = re.sub(r"\s+([,.;:!?])", r"\1", t)
              t = re.sub(r"([,;:!?])(?=[^\s,;:!?.])", r"\1 ", t)
              t = re.sub(r"\s+", " ", t).strip()
              t = t.lstrip(" ,.;:!?-–—'\"")
              t = t.rstrip(" ,;:-–—'\"")
              t = unicodedata.normalize("NFC", t)
              return t, had_cjk
          def n_words(t):
              return len(re.findall(r"\w+", t, re.UNICODE))
          def has_letters(t):
              return bool(re.search(r"[^\W\d_]", t, re.UNICODE))
          def key_of(t):
              k = re.sub(r"[\W_]+", " ", t.casefold(), flags=re.UNICODE)
              return re.sub(r"\s+", " ", k).strip()
          def is_dup(ka, kb):
              if not ka or not kb:
                  return False
              if ka == kb:
                  return True
              short, long_ = (ka, kb) if len(ka) <= len(kb) else (kb, ka)
              if len(short.split()) >= 2 and short in long_ and len(short) / float(len(long_)) >= CONTAIN_RATIO:
                  return True
              return SequenceMatcher(None, ka, kb).ratio() >= SIM_THRESHOLD
          def ts(sec, sep):
              ms = max(0, int(round(sec * 1000)))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{s:02}{sep}{ms:03}"
          def main():
              raw = json.loads((WORK / "vi_raw.json").read_text(encoding="utf-8"))
              raw.sort(key=lambda r: (r["start"], r["end"]))
              dropped = []
              cues = []
              for r in raw:
                  t, had_cjk = clean_vi(r.get("vi", ""))
                  if not t or not has_letters(t):
                      dropped.append((r["start"], "TRONG", r.get("text", ""), r.get("vi", "")))
                      continue
                  if had_cjk and n_words(t) < 3:
                      dropped.append((r["start"], "CON_CHU_HAN", r.get("text", ""), r.get("vi", "")))
                      continue
                  cues.append({"start": float(r["start"]), "end": float(r["end"]), "text": t, "key": key_of(t)})
              n_clean = len(cues)
              out = []
              for c in cues:
                  hit, hit_pos = None, None
                  for back, p in enumerate(reversed(out[-LOOKBACK:])):
                      words = min(n_words(p["text"]), n_words(c["text"]))
                      win = WIN_SHORT if words < SHORT_WORDS else WIN_LONG
                      if c["start"] - p["end"] <= win and is_dup(p["key"], c["key"]):
                          hit, hit_pos = p, back
                          break
                  if hit is None:
                      out.append(c)
                      continue
                  if len(c["key"]) > len(hit["key"]):
                      hit["text"], hit["key"] = c["text"], c["key"]
                  if hit_pos == 0:
                      hit["end"] = max(hit["end"], c["end"])
                  dropped.append((c["start"], "TRUNG", "", c["text"]))
              n_dedup = len(out)
              out.sort(key=lambda c: (c["start"], c["end"]))
              for i, c in enumerate(out):
                  if i + 1 < len(out) and c["end"] > out[i + 1]["start"]:
                      c["end"] = out[i + 1]["start"]
                  if c["end"] <= c["start"]:
                      c["end"] = c["start"] + 0.1
              errors = []
              for i, c in enumerate(out):
                  if CJK_RE.search(c["text"]):
                      errors.append(f"cue {i} con ky tu Trung: {c['text']!r}")
                  if i > 0:
                      p = out[i - 1]
                      words = min(n_words(p["text"]), n_words(c["text"]))
                      win = WIN_SHORT if words < SHORT_WORDS else WIN_LONG
                      if c["start"] - p["end"] <= win and is_dup(p["key"], c["key"]):
                          errors.append(f"cue {i-1}/{i} trung lap: {p['text']!r} | {c['text']!r}")
              if len(out) < MIN_FINAL_CUES:
                  errors.append("khong con cue nao sau khi hoan thien")
              with (WORK / "vi_dropped.txt").open("w", encoding="utf-8") as f:
                  for st, why, zh, vi in dropped:
                      f.write(f"{st:8.2f}s | {why:11s} | ZH={zh!r} | VI={vi!r}\n")
              log(f"[FINALIZE] raw={len(raw)} -> sach={n_clean} -> sau loai trung={n_dedup} | "
                  f"bo {len(dropped)} dong (chi tiet: vi_dropped.txt)")
              if errors:
                  for e in errors[:30]:
                      print(f"::error::{e}")
                  sys.exit(1)
              with (WORK / "vietnamese.srt").open("w", encoding="utf-8") as f:
                  for i, c in enumerate(out, 1):
                      f.write(f"{i}\n{ts(c['start'], ',')} --> {ts(c['end'], ',')}\n{c['text']}\n\n")
              with (WORK / "vietnamese.vtt").open("w", encoding="utf-8") as f:
                  f.write("WEBVTT\n\n")
                  for c in out:
                      f.write(f"{ts(c['start'], '.')} --> {ts(c['end'], '.')}\n{c['text']}\n\n")
              log(f"[FINALIZE] OK: {len(out)} cue sach -> vietnamese.srt / vietnamese.vtt")
          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # SCRIPT XỬ LÝ 1 EP:
      #   [1] Kiểm tra sub Bili (đơn giản) -> native.srt
      #   [2] Dịch Gemini  [3] Finalize  [4] Đóng gói {slug}-SUB.zip -> Pixeldrain -> báo VPS
      # Chạy bằng process riêng (bash process_episode.sh <slug>) nên lỗi ở ep này
      # không chặn các ep còn lại.
      # ============================================================
      - name: Create per-episode pipeline script
        run: |
          cat > process_episode.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          EP_SLUG="$1"
          EP_DIR="work/eps/${EP_SLUG}"
          export EP_SLUG
          export VIDEO="${EP_DIR}/raw_video.mp4"
          export WORK_DIR="${EP_DIR}"
          [ -s "$VIDEO" ] || { echo "::error::Không có video cho ${EP_SLUG}"; exit 1; }
          [ -s "${EP_DIR}/raw_id.txt" ] || { echo "::error::Không có RAW ID cho ${EP_SLUG}"; exit 1; }
          RAW_ID=$(cat "${EP_DIR}/raw_id.txt")

          echo "===== [1/4] Check Bilibili subtitle (${EP_SLUG}) ====="
          rm -f "${EP_DIR}/native.srt"
          python3 bili_sub.py
          [ -s "${EP_DIR}/native.srt" ] || { echo "::error::Không tạo được native.srt cho ${EP_SLUG}"; exit 1; }
          echo "--- native.srt (head) ---"
          head -20 "${EP_DIR}/native.srt" || true

          echo "===== [2/4] Translate (${EP_SLUG}) ====="
          python3 translate_native.py

          echo "===== [3/4] Finalize Vietnamese (${EP_SLUG}) ====="
          python3 finalize_vi.py
          echo "--- VIETNAMESE VTT (head) ---"
          head -40 "${EP_DIR}/vietnamese.vtt" || true
          wc -l "${EP_DIR}/vietnamese.vtt" || true
          echo "--- DROPPED (head) ---"
          head -30 "${EP_DIR}/vi_dropped.txt" || true

          echo "===== [4/4] Pack + upload SUB zip + notify VPS (${EP_SLUG}) ====="
          PACK="${EP_DIR}/pack"
          rm -rf "$PACK" && mkdir -p "$PACK"
          printf '%s' "$RAW_ID" > "${EP_DIR}/raw.txt"
          cp "${EP_DIR}/vietnamese.srt" "${PACK}/vietnamese.srt"
          cp "${EP_DIR}/vietnamese.vtt" "${PACK}/vietnamese.vtt"
          cp "${EP_DIR}/raw.txt"        "${PACK}/raw.txt"
          ZIP_NAME="${EP_SLUG}-SUB.zip"
          ZIP_PATH="${EP_DIR}/${ZIP_NAME}"
          rm -f "$ZIP_PATH"
          (cd "$PACK" && zip -0 -q -r "../${ZIP_NAME}" .)
          unzip -tq "$ZIP_PATH"
          echo "ZIP: $ZIP_NAME = $(( $(stat -c %s "$ZIP_PATH") / 1024 )) KB | raw.txt = $RAW_ID"

          SUB_ID=$(bash pd_upload.sh "$ZIP_PATH" "$ZIP_NAME")
          [ -n "$SUB_ID" ] || { echo '::error::Không có Pixeldrain SUB ID'; exit 1; }
          printf '%s' "$SUB_ID" > "${EP_DIR}/sub_id.txt"
          echo "SUB Link: https://pixeldrain.com/u/${SUB_ID}"

          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -G "https://cp.ssplay.net/bili.php" \
            --data-urlencode "type=raw" \
            --data-urlencode "slug=${EP_SLUG}" \
            --data-urlencode "pixel=${SUB_ID}"
          echo
          echo "Đã báo type=raw cho VPS (slug=${EP_SLUG}, pixel=${SUB_ID})."
          echo "Link cho workflow [2/3] (${EP_SLUG}): ${SUB_ID}"
          printf '%s\t%s\t%s\n' "$EP_SLUG" "$RAW_ID" "$SUB_ID" >> work/results.tsv
          SH

      # ============================================================
      # CHẠY LẦN LƯỢT TỪNG EP (RAW đã up xong ở trên). Ep nào lỗi thì ghi nhận,
      # vẫn chạy tiếp các ep còn lại, cuối cùng fail job nếu có ep lỗi.
      # ============================================================
      - name: Process each episode (Bili sub → translate → SUB zip → Pixeldrain → VPS)
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -uo pipefail
          : > work/results.tsv
          failed=()
          for ep_slug in $(jq -r '.[].slug' work/eps.json); do
            echo "::group::EPISODE ${ep_slug}"
            if bash process_episode.sh "$ep_slug"; then
              echo "EPISODE ${ep_slug}: OK"
            else
              echo "::error::EPISODE ${ep_slug} THẤT BẠI (các ep khác vẫn được xử lý tiếp)"
              failed+=("$ep_slug")
            fi
            echo "::endgroup::"
          done
          echo "================ KẾT QUẢ ================"
          echo -e "slug\traw_id\tsub_id"
          cat work/results.tsv
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Các ep lỗi: ${failed[*]}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Kết quả"
            echo
            echo "| slug | RAW | SUB (ID cho workflow 2/3) |"
            echo "|---|---|---|"
            if [ -s work/results.tsv ]; then
              while IFS=$'\t' read -r s r b; do
                echo "| ${s} | https://pixeldrain.com/u/${r} | ${b} |"
              done < work/results.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
