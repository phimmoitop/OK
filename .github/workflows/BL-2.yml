name: "NEW [2/3] SUB → TTS"

on:
  workflow_dispatch:
    inputs:
      link:
        description: "SUB ID"
        required: true
        type: string
      slug:
        description: "slug"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      SLUG: ${{ inputs.slug }}

    steps:
      # Không checkout (không dùng file nào trong repo), không apt-get, không ffmpeg.
      # Chỉ dùng curl/jq/zip/unzip có sẵn trên ubuntu-latest + 4 gói pip nhỏ.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages (pip only, no apt)
        run: |
          set -eux
          python -m pip install --disable-pip-version-check webvtt-py av numpy requests
          python3 -c "import av, webvtt, numpy, requests; print('ALL IMPORTS OK')"

      # Validate input + smoke test Pixeldrain key: lỗi thì dừng ngay, trước khi tốn tiền TTS
      - name: Validate inputs + Pixeldrain smoke test
        env:
          LINK: ${{ inputs.link }}
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          for c in curl jq zip unzip; do
            command -v "$c" >/dev/null || { echo "::error::Runner thiếu '$c' (thêm: sudo apt-get install -y $c)"; exit 1; }
          done
          [[ "$SLUG" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo '::error::slug chỉ được chứa A-Z a-z 0-9 _ -'; exit 1; }
          SUB_ID="$(echo -n "$LINK" | tr -d '[:space:]')"
          [[ "$SUB_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::link phải là ID Pixeldrain của {slug}-SUB.zip (bước 1)'; exit 1; }
          echo "SUB_ID=$SUB_ID" >> "$GITHUB_ENV"
          echo "SUB zip = $SUB_ID"
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          code=$(curl -s -o /tmp/pd_user.json -w "%{http_code}" --retry 3 --retry-all-errors \
            -u ":$PD_KEY" "https://pixeldrain.com/api/user" || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Pixeldrain API key sai / không truy cập được: $(head -c 300 /tmp/pd_user.json 2>/dev/null)"; exit 1; }
          can_upload=$(jq -r '.can_upload // true' /tmp/pd_user.json)
          echo "Pixeldrain user: $(jq -r '.username' /tmp/pd_user.json) | can_upload=$can_upload"
          [ "$can_upload" != "false" ] || { echo '::error::Tài khoản Pixeldrain chưa được phép upload (cần xác minh email)'; exit 1; }
          mkdir -p work chunks dl

      # ============================================================
      # TẢI {slug}-SUB.zip -> chỉ lấy vietnamese.vtt (cho TTS)
      # ============================================================
      - name: Download SUB zip from Pixeldrain and extract
        timeout-minutes: 60
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=()
          [ -n "${PD_KEY:-}" ] && AUTH=(-u ":$PD_KEY")

          DL_URL="https://pixeldrain.com/api/file/${SUB_ID}?download"
          INFO_URL="https://pixeldrain.com/api/file/${SUB_ID}/info"

          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${AUTH[@]}" "$INFO_URL" || true)
          [ -n "$info" ] || { echo "::error::Không lấy được thông tin file SUB '$SUB_ID' (sai ID / file đã bị xóa?)"; exit 1; }
          want=$(jq -r '.hash_sha256 // empty' <<<"$info" 2>/dev/null || true)
          size=$(jq -r '.size // 0' <<<"$info" 2>/dev/null || echo 0)
          echo "[SUB] id=$SUB_ID name=$(jq -r '.name' <<<"$info") size=$((size / 1024)) KB sha256=${want:-?}"

          is_ok() {
            [ -s sub.zip ] || return 1
            if [ -n "$want" ]; then
              [ "$(sha256sum sub.zip | cut -d' ' -f1)" = "$want" ]
            else
              unzip -tq sub.zip >/dev/null 2>&1
            fi
          }

          ok=0
          for attempt in $(seq 1 10); do
            if is_ok; then ok=1; break; fi
            if [ -f sub.zip ] && [ "$size" -gt 0 ] && [ "$(stat -c %s sub.zip)" -ge "$size" ]; then
              echo "::warning::sub.zip đủ dung lượng nhưng sai, tải lại từ đầu."
              rm -f sub.zip
            fi
            echo "[GET SUB] attempt $attempt/10"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors -C - "${AUTH[@]}" \
              "$DL_URL" -o sub.zip \
              || echo "::warning::curl lỗi lần $attempt, thử tiếp (resume)."
            sleep 3
          done
          if [ "$ok" -ne 1 ] && is_ok; then ok=1; fi
          [ "$ok" -eq 1 ] || { echo "::error::Không tải được file SUB '$SUB_ID' hợp lệ sau 10 lần thử."; exit 1; }
          echo "[OK] sub.zip hợp lệ"

          # Bước 2 chỉ cần vietnamese.vtt (không đụng raw.txt / video RAW)
          unzip -o -q sub.zip vietnamese.vtt -d dl || { echo "::error::SUB zip thiếu vietnamese.vtt (có chắc ID là {slug}-SUB.zip của bước 1?)"; exit 1; }
          [ -s dl/vietnamese.vtt ] || { echo '::error::vietnamese.vtt rỗng'; exit 1; }
          mv dl/vietnamese.vtt work/
          rm -rf dl sub.zip
          ls -lh work/

      - name: TTS Generation (Revid TTS API + Vietnamese VTT)
        env:
          REVID_API_KEYS: ${{ secrets.REVID_API_KEYS }}   # mỗi dòng 1 key
          REVID_VOICE_ID: "3001"  # 3001
          REVID_LANGUAGE: "vi-VN"
          REVID_RATE: "0%"
          TTS_WORKERS: "4"
          TTS_MAX_RETRIES: "10"
          TTS_TIMEOUT: "200"
          TTS_HEARTBEAT: "30"
          TTS_ERROR_RATIO: "0.1"
        run: |
          python3 <<'PY'
          import io, os, re, sys, time, base64, logging, random, threading, unicodedata
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse
          import av
          import numpy as np
          import requests
          import webvtt
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          API_URL = "https://tts.revidapi.com/api/v1/tts"
          API_KEYS = []
          for k in os.environ.get("REVID_API_KEYS", "").splitlines():
              k = k.strip()
              if k and k not in API_KEYS:
                  API_KEYS.append(k)
          VOICE_ID = int(os.environ.get("REVID_VOICE_ID", "3001"))
          LANGUAGE = os.environ.get("REVID_LANGUAGE", "vi-VN")
          RATE = os.environ.get("REVID_RATE", "0%")
          WORKERS = max(1, int(os.environ.get("TTS_WORKERS", "2")))
          MAX_RETRIES = max(1, int(os.environ.get("TTS_MAX_RETRIES", "3")))
          TIMEOUT = float(os.environ.get("TTS_TIMEOUT", "100"))
          HEARTBEAT = float(os.environ.get("TTS_HEARTBEAT", "20"))
          ERROR_RATIO = float(os.environ.get("TTS_ERROR_RATIO", "0.1"))
          T0 = time.time()
          LOCK = threading.Lock()
          INFLIGHT = {}
          KEY_STATS = {}
          def log(msg):
              with LOCK:
                  print(f"[{time.time() - T0:7.1f}s] {msg}", flush=True)
          def stat(ki, ok, sec):
              with LOCK:
                  s = KEY_STATS.setdefault(ki, {"n": 0, "ok": 0, "err": 0, "sec": 0.0})
                  s["n"] += 1
                  s["ok" if ok else "err"] += 1
                  s["sec"] += sec
          def heartbeat(stop):
              while not stop.wait(HEARTBEAT):
                  with LOCK:
                      items = sorted(INFLIGHT.items())
                  now = time.time()
                  if items:
                      desc = " | ".join(f"c{i}: key#{ki + 1} lan{att} cho {now - t:.0f}s"
                                        for i, (ki, att, t) in items)
                      log(f"[HEARTBEAT] dang cho: {desc}")
                  else:
                      log("[HEARTBEAT] khong co request nao dang cho")
          def pick_key(avoid=None):
              idxs = list(range(len(API_KEYS)))
              if avoid is not None and len(idxs) > 1:
                  idxs = [i for i in idxs if i != avoid]
              i = random.choice(idxs)
              return i, API_KEYS[i]
          def make_headers(key):
              return {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "x-api-key": key,
                  "x-revidapi-client": "tts-studio",
              }
          def normalize_for_tts(text):
              text = unicodedata.normalize("NFKC", text)
              text = re.sub(r"\{[^}]*\}", " ", text)
              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("\\N", " ").replace("\\n", " ")
              text = re.sub(r"[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff]", " ", text)
              text = re.sub(r"[‘’´`]", "'", text)
              text = re.sub(r"[–—―]", "-", text)
              text = text.lower()
              text = re.sub(r"\b([a-zà-ỹđ])-\1", r"\1", text)
              text = re.sub(r"[^\w\s,.!?;:'%-]|_", " ", text)
              text = re.sub(r"\.{2,}", ".", text)
              text = re.sub(r"([,;:!?])\1+", r"\1", text)
              text = re.sub(r"\s+([,.;:!?])", r"\1", text)
              text = re.sub(r"([,;:!?])(?=\S)", r"\1 ", text)
              text = re.sub(r"\.(?=[^\W\d_])", ". ", text)
              text = re.sub(r"\s+", " ", text).strip(" ,.;:-'")
              if not re.search(r"\w", text):
                  return ""
              if not text.endswith((".", "!", "?")):
                  text += "."
              return text
          def n_words(text):
              return len(re.findall(r"\w+", text, re.UNICODE))
          def decode_mp3(mp3_bytes, sr=24000):
              """Giai ma MP3 -> float32 mono bang PyAV."""
              c = av.open(io.BytesIO(mp3_bytes))
              rs = av.AudioResampler(format="flt", layout="mono", rate=sr)
              parts = []
              def take(x):
                  if x is None:
                      return
                  for f in (x if isinstance(x, list) else [x]):
                      parts.append(f.to_ndarray().reshape(-1))
              for frame in c.decode(audio=0):
                  take(rs.resample(frame))
              take(rs.resample(None))
              c.close()
              a = np.concatenate(parts).astype(np.float32) if parts else np.zeros(0, np.float32)
              return a, sr
          def plausible(a, sr, text):
              if a.size == 0 or not np.isfinite(a).all():
                  return False
              if float(np.abs(a).max()) < 0.01:
                  return False
              dur = len(a) / float(sr)
              w = max(1, n_words(text))
              return max(0.15, 0.08 * w) <= dur <= 0.9 * w + 2.5
          def fetch_mp3(i, text):
              payload = {
                  "text": text,
                  "voice_id": VOICE_ID,
                  "language": LANGUAGE,
                  "rate": RATE,
                  "return_base64": True,
              }
              last = "unknown"
              bad_key = None
              for attempt in range(1, MAX_RETRIES + 1):
                  ki, key = pick_key(avoid=bad_key)
                  t_req = time.time()
                  with LOCK:
                      INFLIGHT[i] = (ki, attempt, t_req)
                  try:
                      r = requests.post(API_URL, json=payload, headers=make_headers(key), timeout=TIMEOUT)
                      el = time.time() - t_req
                      if r.status_code in (429, 500, 502, 503, 504):
                          stat(ki, False, el)
                          last = f"HTTP {r.status_code} (key #{ki + 1})"
                          bad_key = ki
                          log(f"c{i} LOI TAM THOI {last} | body: {r.text[:200]!r} | cho {3 * attempt}s roi thu lai")
                          time.sleep(3 * attempt)
                          continue
                      data = r.json()
                      if r.status_code != 200 or not data.get("success"):
                          stat(ki, False, el)
                          raise RuntimeError(f"API loi HTTP {r.status_code} (key #{ki + 1}): "
                                             f"{data.get('error')} | {str(data)[:200]}")
                      audio = None
                      b64 = data.get("audio_base64")
                      if b64:
                          if b64.startswith("data:"):
                              b64 = b64.split(",", 1)[1]
                          audio = base64.b64decode(b64)
                      if not audio and data.get("audio_url"):
                          u = urlparse(data["audio_url"])
                          if u.scheme != "https" or (u.hostname or "").lower() != "tts.revidapi.com":
                              raise RuntimeError("audio_url khong hop le")
                          t_dl = time.time()
                          rr = requests.get(data["audio_url"], timeout=90, allow_redirects=False)
                          rr.raise_for_status()
                          audio = rr.content
                      if not audio:
                          stat(ki, False, el)
                          raise RuntimeError("API khong tra ve du lieu MP3")
                      stat(ki, True, el)
                      return audio
                  except (requests.RequestException, ValueError) as e:
                      el = time.time() - t_req
                      stat(ki, False, el)
                      last = f"{e!r} (key #{ki + 1})"
                      bad_key = ki
                      log(f"c{i} LOI MANG/JSON key#{ki + 1} lan {attempt} sau {el:.1f}s: {e!r} | "
                          f"cho {3 * attempt}s roi thu lai")
                      time.sleep(3 * attempt)
                  finally:
                      with LOCK:
                          INFLIGHT.pop(i, None)
              raise RuntimeError(f"het {MAX_RETRIES} lan thu: {last}")
          def save_mp3(mp3_bytes, out):
              with open(out, "wb") as f:
                  f.write(mp3_bytes)
              if os.path.getsize(out) == 0:
                  raise RuntimeError("Empty mp3")
          def process(i, text):
              out = f"chunks/c_{i}.mp3"
              t_all = time.time()
              try:
                  mp3 = fetch_mp3(i, text)
                  a, sr = decode_mp3(mp3)
                  dur = len(a) / float(sr)
                  if not plausible(a, sr, text):
                      return i, text, False, f"bat thuong (dur={dur:.2f}s, {n_words(text)} tu)", time.time() - t_all, dur
                  save_mp3(mp3, out)
                  return i, text, True, "", time.time() - t_all, dur
              except Exception as e:
                  if os.path.exists(out):
                      os.remove(out)
                  return i, text, False, str(e), time.time() - t_all, 0.0
          def main():
              if not API_KEYS:
                  print("Missing GitHub secret REVID_API_KEYS"); sys.exit(1)
              vtt_path = "work/vietnamese.vtt"
              if not os.path.exists(vtt_path):
                  print(f"Missing {vtt_path}"); sys.exit(1)
              vtt = webvtt.read(vtt_path)
              os.makedirs("chunks", exist_ok=True)
              total = len(vtt)
              log(f"[Revid] keys={len(API_KEYS)} | voice_id={VOICE_ID} lang={LANGUAGE} rate={RATE} | "
                  f"workers={WORKERS} | timeout={TIMEOUT:.0f}s | cues={total}")
              jobs = []
              for i, c in enumerate(vtt):
                  text = normalize_for_tts(c.text)
                  if not text or text == ".":
                      continue
                  jobs.append((i, text))
              ERROR_THRESHOLD = max(1, int(len(jobs) * ERROR_RATIO))
              log(f"[Revid] jobs={len(jobs)} | Dung neu loi >= {ERROR_THRESHOLD}/{len(jobs)} doan")
              failed = []
              made = 0
              done = 0
              stop = threading.Event()
              threading.Thread(target=heartbeat, args=(stop,), daemon=True).start()
              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  futs = [ex.submit(process, i, t) for i, t in jobs]
                  for fut in as_completed(futs):
                      i, text, ok, msg, took, dur = fut.result()
                      done += 1
                      if ok:
                          made += 1
                      else:
                          failed.append((i, text))
                          log(f"c{i} THAT BAI -> bo qua | tong {took:.1f}s | {msg} | [{done}/{len(jobs)}]")
                      if done % 5 == 0 or done == len(jobs):
                          el = time.time() - T0
                          rate = done / el * 60 if el > 0 else 0
                          eta = (len(jobs) - done) / (done / el) / 60 if done else 0
                          log(f"[TIEN DO] {done}/{len(jobs)} | ok={made} | loi={len(failed)} | "
                              f"{rate:.1f} cau/phut | con lai ~{eta:.0f} phut")
              stop.set()
              log("[THONG KE THEO KEY]")
              for ki in sorted(KEY_STATS):
                  s = KEY_STATS[ki]
                  avg = s["sec"] / s["n"] if s["n"] else 0
                  log(f"  key#{ki + 1}: {s['n']} request | ok={s['ok']} loi={s['err']} | trung binh {avg:.1f}s/request")
              failed.sort()
              failed_count = len(failed)
              print(f"Tổng số đoạn lỗi: {failed_count}")
              for i, t in failed:
                  print(f"  - doan {i}: {t!r}")
              if failed_count > ERROR_THRESHOLD:
                  print(f"Phát hiện {failed_count} đoạn lỗi (vượt ngưỡng {ERROR_THRESHOLD}). Dừng Workflow!")
                  sys.exit(1)
              with open("count.txt", "w") as f: f.write(str(total))
              print(f"[DONE] Generated {total} TTS chunks (Revid ok={made}, loi={failed_count})")
          main()
          PY

      # ============================================================
      # ĐÓNG GÓI {slug}-AUDIO.zip (toàn bộ chunks/c_*.mp3, tên = chỉ số cue trong vtt)
      # ============================================================
      - name: Pack AUDIO zip (all TTS mp3) and upload to Pixeldrain
        id: pixel
        env:
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PD_KEY" ] || { echo '::error::Missing GitHub secret PIXELDRAIN_API_KEY'; exit 1; }
          N=$(ls chunks/c_*.mp3 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo '::error::Không có file mp3 nào để đóng gói'; exit 1; }
          rm -rf pack && mkdir -p pack
          cp chunks/c_*.mp3 pack/
          ZIP="${SLUG}-AUDIO.zip"
          rm -f "$ZIP"
          (cd pack && zip -0 -q -r "../$ZIP" .)
          unzip -tq "$ZIP"
          SIZE=$(stat -c %s "$ZIP")
          echo "ZIP: $ZIP = $N mp3, $((SIZE / 1048576)) MB"
          ID=""
          MAX=6
          for attempt in $(seq 1 "$MAX"); do
            echo "[UP] Pixeldrain attempt $attempt/$MAX"
            rm -f work/pd_upload.json
            code=$(curl -sS -T "$ZIP" -u ":$PD_KEY" \
              -o work/pd_upload.json -w "%{http_code}" \
              "https://pixeldrain.com/api/file/${ZIP}" || true)
            echo "HTTP $code: $(head -c 300 work/pd_upload.json 2>/dev/null || true)"
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              ID=$(jq -r '.id // empty' work/pd_upload.json)
              [ -n "$ID" ] && break
            fi
            case "$code" in
              401|403|413|422)
                echo "::error::Pixeldrain từ chối (HTTP $code), không thử lại: $(head -c 300 work/pd_upload.json 2>/dev/null || true)"
                exit 1 ;;
            esac
            [ "$attempt" -lt "$MAX" ] && sleep $(( attempt * 10 ))
          done
          [ -n "$ID" ] || { echo '::error::Upload Pixeldrain thất bại sau nhiều lần thử'; exit 1; }
          info=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://pixeldrain.com/api/file/${ID}/info")
          remote_size=$(jq -r '.size' <<<"$info")
          echo "Pixeldrain ID=$ID | size=$remote_size (local=$SIZE)"
          [ "$remote_size" = "$SIZE" ] || { echo '::error::Size trên Pixeldrain không khớp file local'; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "AUDIO Link: https://pixeldrain.com/u/${ID}"

      - name: Notify VPS (type=sub, pixel = AUDIO zip ID)
        env:
          AUDIO_ID: ${{ steps.pixel.outputs.id }}
        run: |
          set -euo pipefail
          [ -n "$AUDIO_ID" ] || { echo '::error::Không có Pixeldrain AUDIO ID'; exit 1; }
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -G "https://cp.ssplay.net/bili.php" \
            --data-urlencode "type=sub" \
            --data-urlencode "slug=${SLUG}" \
            --data-urlencode "pixel=${AUDIO_ID}"
          echo
          echo "Đã báo type=sub cho VPS (slug=${SLUG}, pixel=${AUDIO_ID})."
          echo "Link cho workflow [3/3]: ${AUDIO_ID}-SUB-${SUB_ID}"
